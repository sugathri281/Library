      ${['#FDE7B5','#D7F0D6','#FCD9C9','#F7D3D3','#FFF3B0','#E4D7F5'].map(c=>`<button class="sw" style="background:${c}" data-cmd="hilitecolor" data-val="${c}" aria-label="Background colour ${c}" title="Background colour"></button>`).join('')}
      <button class="sw" style="background:var(--surface2)" data-cmd="hilitecolor" data-val="transparent" aria-label="Remove background" title="Remove background">×</button>
      </div>`;
    rb0.innerHTML=`<div class="row sp noprint" style="margin-bottom:10px"><div class="seg" id="rmode"><button data-m="full" aria-pressed="${mode==='full'}">Full text</button><button data-m="hl" aria-pressed="${mode==='hl'}">Highlights only</button><button data-m="qs" aria-pressed="${mode==='qs'}">Quick summary</button></div>
      <div class="row">${mode==='qs'?`<button class="btn sm" id="rListen">${ic('play',18)} Listen</button><button class="btn sm" id="rCar" title="Add this note to Car audio">Car audio</button><button class="btn sm" id="qsCopy">${ic('copy',18)} Copy</button><button class="btn sm ghost" id="qsClear">Clear</button>`:`<button class="btn sm" id="rListen">${ic('play',18)} Listen</button><button class="btn sm" id="rCar" title="Add this note to Car audio">Car audio</button>${editing||mode==='hl'?'':'<button class="btn sm" id="rCol">Collapse all</button><button class="btn sm" id="rExp">Expand all</button><button class="btn sm" id="rAuto">Auto-highlight</button>'}<button class="btn sm ${editing?'pri':''}" id="rEdit">${editing?'Done editing':'Edit'}</button>`}</div></div>
      ${mode==='qs'?`<p class="small muted" style="margin:0 0 10px">Paste a summary from anywhere — colours, tables and formatting are kept as you pasted them. To listen from a certain point, tap there and press Listen.</p>${qtb}`:''}
      ${editing?etb:''}${mode==='qs'?'':`<div class="legend">${legend}</div>`}<article id="readBody" class="reader ${editing?'editing':''}"></article>
      ${mode==='qs'?'':`<div class="row" style="margin:24px auto;max-width:44em"><button class="btn" id="rDone">Mark as read</button><span class="small muted" id="rProg">${pct(t)}% read</span></div>`}`;
    const rb=$('#readBody');
    {const rc=$('#rCar');if(rc)rc.onclick=()=>{flushEdit();addToCar(['t:'+t.id])}}
    $('#rmode').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.m===mode)return;if(TTS.root)TTS.stop(true);flushEdit();mode=b.dataset.m;if(mode!=='full')editing=false;renderRead()};
    if(mode==='qs'){
      rb.className='reader qs';
      rb.innerHTML=t.qs||'';
      rb.contentEditable='true';rb.spellcheck=true;
      try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
      if(!strip(t.qs||''))rb.setAttribute('data-ph','Paste your AI-generated summary here, or type one yourself.');
      const saveQS=debounce(()=>{t.qs=sanitizeRich(rb.innerHTML);saveTopic(t)},900);
      rb.addEventListener('input',()=>{rb.removeAttribute('data-ph');saveQS()});
      rb.addEventListener('paste',e=>{
        e.preventDefault();
        const h=e.clipboardData.getData('text/html'),tx=e.clipboardData.getData('text/plain');
        if(!h){
          const img=[...(e.clipboardData.items||[])].find(it=>it.type&&it.type.startsWith('image/'));
          if(img){const file=img.getAsFile(),rd=new FileReader();rd.onload=()=>{document.execCommand('insertHTML',false,`<img src="${rd.result}" alt="">`);rb.removeAttribute('data-ph');saveQS()};rd.readAsDataURL(file);return}
        }
        document.execCommand('insertHTML',false,h?sanitizeRich(h):md2html(tx,{lines:true}));
        rb.removeAttribute('data-ph');saveQS();
      });
      rb.focus();
      const tb=$('#qsTb');
      if(tb){tb.addEventListener('pointerdown',e=>e.preventDefault());tb.onclick=e=>{const b=e.target.closest('[data-cmd]');if(!b)return;rb.focus();document.execCommand(b.dataset.cmd,false,b.dataset.val||null);rb.removeAttribute('data-ph');saveQS()}}
      const ls=$('#rListen');
      if(ls)ls.onclick=()=>{
        if(!strip(rb.innerHTML)){toast('Paste or type a summary first, then press Listen.');return}
        let startEl=null;const sl=getSelection();
        if(sl.rangeCount&&sl.anchorNode&&rb.contains(sl.anchorNode)){const n=sl.anchorNode.nodeType===3?sl.anchorNode.parentElement:sl.anchorNode;startEl=n.closest('p,li,h1,h2,h3,h4,h5,h6,td,th,blockquote,pre,div');if(startEl===rb)startEl=null}
        blockifyRoot(rb);TTS.open(rb,t,{noSummary:true,title:t.title+' (quick summary)',startEl});
      };
      const cpy=$('#qsCopy');
      if(cpy)cpy.onclick=async()=>{
        try{
          if(navigator.clipboard&&window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([rb.innerHTML],{type:'text/html'}),'text/plain':new Blob([rb.innerText],{type:'text/plain'})})]);
          else await navigator.clipboard.writeText(rb.innerText);
          toast('Copied — paste it wherever you need it');
        }catch(e){toast('Could not copy automatically — select the text and copy it yourself')}
      };
      const clr=$('#qsClear');
      if(clr)clr.onclick=async()=>{if(!await confirmBox('Clear the quick summary for this topic?','Clear',false))return;rb.innerHTML='';t.qs='';saveTopicNow(t);rb.setAttribute('data-ph','Paste your AI-generated summary here, or type one yourself.')};
      const prevClean2=tabClean;
      tabClean=()=>{t.qs=sanitizeRich(rb.innerHTML);DB.put('topics',t);if(prevClean2)prevClean2()};
      return;
    }
    const isH=el=>el&&/^H[1-6]$/.test(el.tagName),lvl=h=>+h.tagName[1];
    const empty=!strip(t.html||'');

    function setCollapsed(h,collapse){
      h.classList.toggle('col',collapse);const L=lvl(h);let el=h.nextElementSibling,skip=null;
      while(el&&!(isH(el)&&lvl(el)<=L)){
        if(collapse)el.classList.add('hid');
        else{
          if(skip!==null){if(isH(el)&&lvl(el)<=skip)skip=null;else{el=el.nextElementSibling;continue}}
          el.classList.remove('hid');if(isH(el)&&el.classList.contains('col'))skip=lvl(el);
        }
        el=el.nextElementSibling;
      }
    }
    const allH=()=>$$('h1,h2,h3,h4,h5,h6',rb);
    function prepare(){
      allH().forEach((h,i)=>{h.dataset.hi=i;
        if(!editing){const b=document.createElement('button');b.className='tg';b.type='button';b.contentEditable='false';b.setAttribute('aria-label','Collapse or expand section');b.innerHTML=ic('chev',18);h.appendChild(b)}});
    }
    function serialize(){
      const c=rb.cloneNode(true);$$('.tg',c).forEach(x=>x.remove());
      $$('.hid,.col,.speaking',c).forEach(x=>x.classList.remove('hid','col','speaking'));
      $$('[data-hi]',c).forEach(x=>x.removeAttribute('data-hi'));$$('[class=""]',c).forEach(x=>x.removeAttribute('class'));
      return c.innerHTML;
    }
    const persist=()=>{t.html=serialize();saveTopic(t)};
    function hlView(){
      const d=document.createElement('div');d.innerHTML=t.html||'';
      const hs=[...d.querySelectorAll('h1,h2,h3,h4,h5,h6')];hs.forEach((h,i)=>h.dataset.hi=i);
      const gr={d:[],f:[],e:[],w:[],k:[]};
      $$('mark',d).forEach(m=>{const c=(m.className.match(/hl-([dfewk])/)||[])[1]||'k';let k=m;while(k.parentElement&&k.parentElement!==d)k=k.parentElement;let h=k;while(h&&!isH(h))h=h.previousElementSibling;
        const tx=m.textContent.replace(/\s+/g,' ').trim();if(tx)gr[c].push({t:tx,h:h?h.textContent.trim():'',hi:h?+h.dataset.hi:-1})});
      const total=HL_KEYS.reduce((a,k)=>a+gr[k].length,0);
      if(!total)return '<div class="empty">No highlights yet. In Full text, select words and choose a colour. They will be collected here for quick revision.</div>';
      return `<div class="hlonly">${HL_KEYS.filter(k=>gr[k].length).map(k=>`<h4><mark class="hl hl-${k}">${esc(S.settings.legend[k])}</mark> <span class="muted">(${gr[k].length})</span></h4><ul>${gr[k].map(x=>`<li ${x.hi>=0?`data-hi="${x.hi}" style="cursor:pointer"`:''}>${esc(x.t)}${x.h?`<div class="from">in ${esc(x.h)}</div>`:''}</li>`).join('')}</ul>`).join('')}</div>`;
    }

    if(mode==='hl'){rb.className='reader';rb.innerHTML=hlView();rb.onclick=e=>{const li=e.target.closest('li[data-hi]');if(li){mode='full';renderRead({k:'h',i:+li.dataset.hi})}}}
    else if(empty&&!editing){rb.innerHTML='<p class="muted">This topic is empty. Choose Edit to paste or type your notes.</p>'}
    else{rb.innerHTML=t.html||'<p></p>';prepare()}
    if(editing&&mode==='full'){
      rb.contentEditable='true';rb.spellcheck=true;
      try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
      if(empty){rb.innerHTML='<p><br></p>'}
      rb.focus();
      rb.addEventListener('input',debounce(()=>{t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopic(t)},1200));
      rb.addEventListener('paste',e=>{e.preventDefault();const h=e.clipboardData.getData('text/html'),tx=e.clipboardData.getData('text/plain');
        document.execCommand('insertHTML',false,h?sanitize(h):md2html(tx,{lines:true}))});
      $('#etb').addEventListener('pointerdown',e=>e.preventDefault());
      $('#etb').onclick=e=>{const b=e.target.closest('[data-cmd]');if(!b)return;rb.focus();document.execCommand(b.dataset.cmd,false,b.dataset.val||null)};
    }
    /* collapse toggles */
    rb.addEventListener('click',e=>{
      const tg=e.target.closest('.tg');
      if(tg){const h=tg.parentElement;setCollapsed(h,!h.classList.contains('col'));return}
      const m=e.target.closest('mark');const sel=getSelection();
      if(m&&sel.isCollapsed&&mode==='full'){const rg=document.createRange();rg.selectNodeContents(m);sel.removeAllRanges();sel.addRange(rg);return}
      if(!editing&&mode==='full'&&sel.isCollapsed&&TTS.supported){
        const blk=e.target.closest('p,li,h1,h2,h3,h4,h5,h6,td,th');
        if(blk&&rb.contains(blk)){
          const lf=$('#lfh'),r=blk.getBoundingClientRect();
          lf._el=blk;lf._root=rb;lf._topic=t;lf.textContent=TTS.playing?'\u25B6 Jump here':'\u25B6 Listen from here';
          lf.style.top=Math.max(70,Math.min(innerHeight-260,r.top+4))+'px';lf.classList.add('show');
          clearTimeout(lf._t);lf._t=setTimeout(()=>lf.classList.remove('show'),5000);
        }
      }
    });
    const col=$('#rCol'),exp=$('#rExp');
    if(col)col.onclick=()=>allH().forEach(h=>{if(lvl(h)<=2)setCollapsed(h,true)});
    if(exp)exp.onclick=()=>allH().slice().reverse().forEach(h=>setCollapsed(h,false));
    $('#rEdit').onclick=()=>{
      if(editing){t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopicNow(t);editing=false;toast('Saved')}
      else{mode='full';editing=true}
      renderRead();
    };
    $('#rDone').onclick=()=>{t.progress=1;DB.put('topics',t);$('#rProg').textContent='100% read';toast('Marked as read')};
    $('#rListen').onclick=()=>{if(mode!=='full'){mode='full';renderRead()}if(editing){flushEdit();editing=false;renderRead()}TTS.open($('#readBody'),t)};

    /* jump to target */
    if(target&&mode==='full'){
      const openAll=()=>allH().slice().reverse().forEach(x=>setCollapsed(x,false));
      if(target.k==='h'){const h=$$('h1,h2,h3,h4,h5,h6',rb)[target.i];if(h){openAll();setTimeout(()=>{h.scrollIntoView({block:'start',behavior:'smooth'});h.classList.add('speaking');setTimeout(()=>h.classList.remove('speaking'),1600);flashTerms(h.nextElementSibling,target)},30)}}
      else if(target.k==='c'){const el=rb.children[target.i];if(el){openAll();setTimeout(()=>{el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('speaking');setTimeout(()=>el.classList.remove('speaking'),1600);flashTerms(el,target)},30)}}
    }else if(!target&&mode==='full'&&!editing&&SCROLLS[t.id]>300){
      const y=SCROLLS[t.id];setTimeout(()=>window.scrollTo(0,y),40);   // pick up where you stopped
    }
    const ab=$('#rAuto');
    if(ab){
      const hasAuto=!!rb.querySelector('mark[data-a]');
      if(hasAuto){ab.textContent='Clear auto-highlights'}
      ab.onclick=()=>{
        const y=window.scrollY;
        if(rb.querySelector('mark[data-a]')){NLP.clearAuto(rb);persist();toast('Automatic highlights removed');renderRead();window.scrollTo(0,y);return}
        const n=NLP.autoHighlight(t,rb);
        if(!n){toast('Nothing new to highlight in this note');return}
        persist();toast(`Highlighted ${n} key items. You can clear them from the same button.`,4500);renderRead();window.scrollTo(0,y);
      };
    }
    /* reading progress */
    const saveProg=debounce(()=>DB.put('topics',t),1500);
    const onScroll=()=>{if(mode!=='full'||editing)return;const b=rb.getBoundingClientRect();if(b.height<=0)return;const seen=Math.min(1,Math.max(0,(innerHeight-b.top)/b.height));
      if(seen>(t.progress||0)+0.02){t.progress=seen>0.97?1:seen;saveProg();const p=$('#rProg');if(p)p.textContent=pct(t)+'% read'}
      clearTimeout(onScroll.t);onScroll.t=setTimeout(()=>{SCROLLS[t.id]=Math.round(window.scrollY);saveScrolls()},400)};
    window.addEventListener('scroll',onScroll,{passive:true});
    /* highlight bar */
    let lastRange=null,hideT=null;const bar=$('#hlbar');
    const inRb=n=>n&&rb.contains(n.nodeType===3?n.parentNode:n);
    const onSel=()=>{
      const sel=getSelection();
      if(mode==='full'&&sel.rangeCount&&!sel.isCollapsed&&inRb(sel.anchorNode)&&inRb(sel.focusNode)){clearTimeout(hideT);lastRange=sel.getRangeAt(0).cloneRange();bar.classList.add('show')}
      else{clearTimeout(hideT);hideT=setTimeout(()=>{bar.classList.remove('show')},350)}
    };
    document.addEventListener('selectionchange',onSel);
    const barDown=()=>{clearTimeout(hideT)};
    bar.addEventListener('pointerdown',barDown);
    bar.onclick=e=>{
      const b=e.target.closest('button');if(!b||!lastRange)return;clearTimeout(hideT);
      const rg=lastRange,c=b.dataset.c;
      if(c==='x'){$$('mark',rb).filter(m=>rg.intersectsNode(m)).forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove()})}
      else{
        const root=rg.commonAncestorContainer,nodes=[];
        if(root.nodeType===3)nodes.push(root);
        else{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&!n.parentElement.closest('.tg'))nodes.push(n)}}
        for(const n of nodes){
          const st=n===rg.startContainer?rg.startOffset:0,en=n===rg.endContainer?rg.endOffset:n.length;
          if(st>=en||!n.data.slice(st,en).trim())continue;
          let mid=n;if(st>0)mid=n.splitText(st);if(en-st<mid.length)mid.splitText(en-st);
          const par=mid.parentElement;
          if(par&&par.tagName==='MARK'&&par.textContent===mid.data)par.className='hl hl-'+c;
          else{const mk=document.createElement('mark');mk.className='hl hl-'+c;mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid)}
        }
      }
      getSelection().removeAllRanges();bar.classList.remove('show');lastRange=null;
      if(editing){t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopic(t)}else persist();
    };
    const prevClean=tabClean;
    tabClean=()=>{window.removeEventListener('scroll',onScroll);document.removeEventListener('selectionchange',onSel);bar.classList.remove('show');bar.onclick=null;bar.removeEventListener('pointerdown',barDown);DB.put('topics',t);if(prevClean)prevClean()};
  }

  /* ---- related ---- */
  async function renderRelated(){
    const pane=$('#tpane');
    pane.innerHTML='<p class="muted">Looking for connections across your notes…</p>';
    if(!NLP.idx){await NLP.whenReady();if(tab!=='related')return}
    const pairOf=l=>l.from===t.id?l.to:l.from;
    const mine=S.links.filter(l=>l.from===t.id||l.to===t.id);
    const hidden=new Set(mine.filter(l=>l.rel==='hidden').map(pairOf)),pinned=mine.filter(l=>l.rel!=='hidden');
    const have=new Set(pinned.map(pairOf));
    const auto=NLP.related(t,12).filter(x=>!hidden.has(x.t.id)&&!have.has(x.t.id)).slice(0,8),top=auto.length?auto[0].score:1;
    const secs=NLP.sectionLinks(t).map(sc=>({...sc,links:sc.links.filter(l=>!hidden.has(l.t.id))})).filter(sc=>sc.links.length);

    const pinHtml=pinned.length?pinned.map(l=>{const out=l.from===t.id,o=byId(S.topics,pairOf(l));if(!o)return'';
      return `<div class="card tight row sp" style="margin-bottom:8px"><div class="grow"><span class="small muted">${out?'This topic':esc(o.title)} <b>${esc(l.rel)}</b> ${out?esc(o.title):'this topic'}</span><div><a href="#/topic/${o.id}"><b>${esc(o.title)}</b></a> <span class="small muted">${esc(o.subject)}</span></div></div><button class="btn sm dng" data-rm="${l.id}" aria-label="Remove link">${ic('x',16)}</button></div>`}).join(''):'<p class="muted small">Nothing pinned. Tap Keep on a suggestion, or link a topic yourself.</p>';
    pane.innerHTML=`<h2 class="sec" style="margin-top:0">Connected notes</h2>
      <p class="small muted">Found automatically from the ideas, terms and facts your notes share. Nothing to type. Keep the ones you want to pin, and Hide any that are not really related.</p>

    $('#lAdd').onclick=async()=>{
      const ids=await pickTopics({title:'Link to which topic?',exclude:[t.id]});if(!ids)return;

      $('#dDup',b).onclick=async()=>{const c=JSON.parse(JSON.stringify(t));c.id=uid();c.title=t.title+' (copy)';c.created=c.updated=Date.now();c.progress=0;S.topics.push(c);await DB.put('topics',c);closeModal();location.hash='#/topic/'+c.id};

        TXT.delete(t.id);tabClean=null;location.hash='#/library'};

<script>
'use strict';
/* ---------- global smart search ---------- */
const RECENT_KEY='sl_recent';
const recentQ=()=>{try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){return[]}};
const pushRecent=q=>{const l=[q,...recentQ().filter(x=>x!==q)].slice(0,8);try{localStorage.setItem(RECENT_KEY,JSON.stringify(l))}catch(e){}};
let SRCH={q:'',subject:''};
const hsParam=st=>(st||[]).slice(0,6).map(encodeURIComponent).join('+');

VIEWS.search=r=>{

  view().innerHTML=`<h1 class="pg">Search</h1><p class="sub">Looks inside every note in every subject, and follows related ideas. Type a topic or concept, or paste a whole exam question.</p>
  <input type="search" id="sq" placeholder="e.g. urban flooding, own source revenue, or paste a question" value="${esc(SRCH.q)}" aria-label="Search all notes" autocomplete="off">

function searchEmpty(){
  const res=$('#sres'),rc=recentQ();
  const cc=NLP.crossConcepts(18);
  res.innerHTML=(rc.length?`<h2 class="sec" style="margin-top:6px">Recent searches</h2><div class="rel">${rc.map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'')+
    (cc.length?`<h2 class="sec">Ideas that connect your subjects</h2><p class="small muted">Found automatically wherever the same idea appears in more than one subject. Tap one to see every place it comes up.</p><div class="rel">${cc.map(c=>`<button class="chip" data-q="${esc(c.term)}" title="${esc([...c.subjects].join(', '))}">${esc(c.term)} <span class="muted small">${c.subjects.size} subjects</span></button>`).join('')}</div>`:
    '<p class="muted">As your library grows, ideas shared between subjects will be listed here.</p>');

let SQID=0;
async function doSearch(raw,keep){
  const q=(raw||'').trim(),id=++SQID;SRCH.q=q;
  const res=$('#sres'),stat=$('#sstat'),flt=$('#sflt');if(!res)return;
  if(!S.topics.length&&!S.questions.length){stat.textContent='';flt.innerHTML='';res.innerHTML='<div class="empty">Add some notes or questions first, then search across them here.</div>';return}
  if(S.topics.length&&!NLP.idx){stat.textContent='Getting your notes ready…';await NLP.whenReady();if(id!==SQID||!$('#sres'))return}
  if(!q){stat.textContent='';flt.innerHTML='';searchEmpty();return}
  const out=(S.topics.length&&NLP.search(q))||{topics:[],examples:[],related:[],stems:[],terms:[],stats:{topics:0,passages:0}};
  const PR=typeof practiseResultsHtml==='function'?practiseResultsHtml(q):{html:'',n:0};
  if(!out.topics.length&&!PR.n){
    flt.innerHTML='';stat.textContent='';
    res.innerHTML=`<div class="empty">Nothing in your notes or Practise matches “${esc(q)}”.<br><span class="small">Try fewer or simpler words, or add related words under More → Smart features.</span></div>`;return;
  }
  pushRecent(q);
  const subs={};out.topics.forEach(g=>subs[g.t.subject]=(subs[g.t.subject]||0)+1);
  const names=Object.keys(subs).sort((a,b)=>subs[b]-subs[a]);
  flt.innerHTML=names.length>1?`<button class="chip" data-subj="" aria-pressed="${!SRCH.subject}">All subjects</button>`+names.map(n=>`<button class="chip" data-subj="${esc(n)}" aria-pressed="${SRCH.subject===n}">${esc(n)} (${subs[n]})</button>`).join(''):'';
  const shown=out.topics.filter(g=>!SRCH.subject||g.t.subject===SRCH.subject);
  stat.textContent=`${shown.length} note${shown.length===1?'':'s'}${names.length?` in ${names.length} subject${names.length===1?'':'s'}`:''}${PR.n?` · ${PR.n} from Practise`:''}${out.long?' · treated as a question: key ideas were picked out':''}`;
  const hs=hsParam(out.stems);
  const chips=out.related.length?`<div class="small muted">Also looking at related ideas:</div><div class="rel">${out.related.map(w=>`<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:'';
  const groups={};shown.forEach(g=>(groups[g.t.subject]=groups[g.t.subject]||[]).push(g));
  const card=g=>{
    const p0=g.passages[0];
    return `<div class="res"><div class="row sp"><h3><a href="#/topic/${g.t.id}/read?c=${p0.ci}&hs=${hs}">${esc(g.t.title)}</a>${g.t.chapterId?' <span class="qb ok">Revision sheet</span>':''}</h3><span class="tag">${esc(g.t.subject)}${g.t.unit?' › '+esc(g.t.unit):''}</span></div>`+
      g.passages.slice(0,3).map(p=>`<a class="pas" href="#/topic/${g.t.id}/read?c=${p.ci}&hs=${hs}"><div class="p">${p.path.length?esc(p.path.join(' › ')):'Opening section'}${p.via?' · related idea':''}${p.matched.length?' · matches '+esc(p.matched.slice(0,3).join(', ')):''}</div><div>${p.snip}</div></a>`).join('')+
      (g.passages.length>3?`<div class="small muted">+ ${g.passages.length-3} more passage${g.passages.length-3>1?'s':''} in this note</div>`:'')+`</div>`;
  };
  const ex=out.examples.length?`<div class="subjhead">Examples in your bank</div><div class="grid">${out.examples.map(e=>exCard(e)).join('')}</div>`:'';
  res.innerHTML=chips+Object.keys(groups).map(sj=>`<div class="subjhead">${esc(sj)}</div>`+groups[sj].map(card).join('')).join('')+(SRCH.subject?'':PR.html)+ex;
}

<script>
'use strict';
/* ---------- shared: HTML -> simple block model ---------- */
const BLOCKTAGS=new Set(['H1','H2','H3','H4','H5','H6','P','UL','OL','TABLE','BLOCKQUOTE','PRE','HR','DIV']);
function docBlocks(html,shift=0){
  const d=document.createElement('div');d.innerHTML=html||'';const out=[];
  const inl=(node,fmt,runs)=>{
    for(const n of node.childNodes){
      if(n.nodeType===3){const t=n.data.replace(/\s+/g,' ');if(t)runs.push({t,f:fmt});continue}
      if(n.nodeType!==1)continue;
      const g=n.tagName;
      if(g==='BR'){runs.push({br:1});continue}
      if(g==='IMG'){runs.push({t:'[image]',f:fmt});continue}
      if(/^(UL|OL|TABLE)$/.test(g))continue;
      const f=Object.assign({},fmt);
      if(g==='STRONG'||g==='B')f.b=1;if(g==='EM'||g==='I')f.i=1;if(g==='U')f.u='single';if(g==='S')f.s=1;
      if(g==='SUP')f.sup=1;if(g==='SUB')f.sub=1;if(g==='CODE')f.code=1;
      if(g==='MARK')f.hl=((n.className.match(/hl-([dfewk])/)||[])[1])||'k';
      inl(n,f,runs);
    }
  };
  const trim=r=>{while(r.length&&r[0].t!==undefined&&!r[0].t.trim())r.shift();if(r.length&&r[0].t)r[0]={t:r[0].t.replace(/^\s+/,''),f:r[0].f};
    while(r.length&&r[r.length-1].t!==undefined&&!r[r.length-1].t.trim())r.pop();const l=r.length-1;if(l>=0&&r[l].t)r[l]={t:r[l].t.replace(/\s+$/,''),f:r[l].f};return r};
  const own=el=>{const r=[];inl(el,{},r);return trim(r)};
  const has=r=>r.some(x=>x.br||(x.t&&x.t.trim()));
  const walk=(parent,ctx)=>{
    let pend=[];
    const flush=()=>{const r=trim(pend);pend=[];if(has(r))out.push({k:'p',runs:r,indent:ctx.indent,quote:ctx.quote})};
    for(const el of parent.childNodes){
      if(el.nodeType===3||(el.nodeType===1&&!BLOCKTAGS.has(el.tagName))){const w=document.createElement('div');w.appendChild(el.cloneNode(true));inl(w,{},pend);continue}
      if(el.nodeType!==1)continue;
      flush();const t=el.tagName;
      if(/^H[1-6]$/.test(t)){const r=own(el);if(has(r))out.push({k:'h',n:Math.min(3,+t[1]+shift),runs:r})}
      else if(t==='P'){const r=own(el);if(has(r))out.push({k:'p',runs:r,indent:ctx.indent,quote:ctx.quote});else if(el.classList.contains('sp'))out.push({k:'p',runs:[{t:' '}],indent:0,quote:false})}
      else if(t==='UL'||t==='OL'){let i=0;
        for(const li of el.children){if(li.tagName!=='LI')continue;i++;
          const r=own(li);if(has(r))out.push({k:'p',runs:r,indent:ctx.indent+1,bullet:t==='OL'?i+'.':'•',quote:ctx.quote});
          for(const c of li.children)if(/^(UL|OL)$/.test(c.tagName)){const w=document.createElement('div');w.appendChild(c.cloneNode(true));walk(w,{indent:ctx.indent+1,quote:ctx.quote})}
        }}
      else if(t==='TABLE'){const rows=[...el.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>{const r=[];inl(c,{},r);return trim(r)}));
        if(rows.length)out.push({k:'t',rows,head:!!el.querySelector('th')})}
      else if(t==='BLOCKQUOTE'){walk(el,{indent:ctx.indent+1,quote:true})}
      else if(t==='PRE'){el.textContent.split('\n').forEach(l=>out.push({k:'p',runs:[{t:l||' ',f:{code:1}}],indent:ctx.indent,code:true}))}
      else if(t==='HR'){out.push({k:'hr'})}
      else if(t==='DIV'){walk(el,ctx)}
    }
    flush();
  };
  walk(d,{indent:0,quote:false});
  return out;
}
const HLFILL={d:'CFE3FF',f:'CDEFD3',e:'FFE0BA',w:'FFD0CF',k:'FFF1A8'};
const HLUL={d:'single',f:'dotted',e:'dash',w:'wave',k:'double'};

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function buildDocx(title,secs){

    if(b.k==='hr')return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="AAAAAA"/></w:pBdr></w:pPr></w:p>';

        b.rows.map((row,ri)=>'<w:tr>'+Array.from({length:cols},(_,ci)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${ri===0&&b.head?'<w:shd w:val="clear" w:color="auto" w:fill="EEF2F0"/>':''}</w:tcPr>${P('',(row[ci]||[]).map(r=>runXml(r,ri===0&&b.head?{b:1}:null)).join(''),'<w:spacing w:after="40"/>')}</w:tc>`).join('')+'</w:tr>').join('')+'</w:tbl>'+P('','');
    }
    const ex=b.quote?{i:1}:b.code?{code:1}:null;

    if(b.bullet){inner=runXml({t:b.bullet})+runXml({tab:1})+inner;ppr=`<w:spacing w:after="60"/><w:ind w:left="${360*b.indent+360}" w:hanging="360"/>`}

  const hs=(id,name,sz,before)=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="${before}" w:after="100"/><w:outlineLvl w:val="${id.slice(-1)-1}"/></w:pPr><w:rPr><w:b/><w:color w:val="1D4E6B"/><w:sz w:val="${sz}"/></w:rPr></w:style>`;

/* ---------- PDF ---------- */
function buildPdf(title,secs){
  const W=595,H=842,M=52,BRAND='0.114 0.306 0.42',INK='0.09 0.14 0.17';
  const cv=document.createElement('canvas').getContext('2d');
  const CP={0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80};

    if(c in CP||(c>=32&&c<=126)||(c>=161&&c<=255))o+=ch;else if(c===0xA0||c===9)o+=' ';else if(c===0x2192)o+='->';else if(c===0x2212)o+='-';else o+='?'}return o};

  const mw=(t,f,size)=>{cv.font=f.code?`${size}px "Courier New",monospace`:`${f.i?'italic ':''}${f.b?'bold ':''}${size}px Arial,Helvetica,sans-serif`;return cv.measureText(t).width*1.015};
  const nn=x=>+x.toFixed(2);
  const rgbOf=h=>[0,2,4].map(i=>nn(parseInt(h.substr(i,2),16)/255)).join(' ');
  const toks=(runs,size,force)=>{const out=[];
    for(const r of runs){if(r.br){out.push({br:1});continue}
      const f=Object.assign({},r.f||{},force||{});
      norm(r.t||'').split(/(\s+)/).forEach(p=>{if(!p)return;const sp=/^\s+$/.test(p),t=sp?' ':p;out.push({t,f,sp,w:mw(t,f,size)})})}
    return out};
  const wrap=(tk,maxW,size)=>{const lines=[];let cur=[],w=0;
    const push=()=>{while(cur.length&&cur[cur.length-1].sp)cur.pop();lines.push(cur);cur=[];w=0};
    for(const t of tk){
      if(t.br){push();continue}
      if(t.sp&&!cur.length)continue;
      if(!t.sp&&t.w>maxW){ // very long word: split by characters
        if(cur.length)push();let piece='';
        for(const ch of t.t){if(mw(piece+ch,t.f,size)>maxW&&piece){cur=[{t:piece,f:t.f,w:mw(piece,t.f,size)}];push();piece=''}piece+=ch}
        if(piece){cur=[{t:piece,f:t.f,w:mw(piece,t.f,size)}];w=cur[0].w}continue}
      if(w+t.w>maxW&&cur.length&&!t.sp)push();
      cur.push(t);w+=t.w;
    }

  };

  const newPage=()=>{pages.push(page.join(''));page=[];y=M};
  const need=h=>{if(y+h>H-M&&y>M+1)newPage()};
  const drawLine=(items,x,top,size,color)=>{
    const base=H-(top+size*0.86);let cx=x,ops='';
    for(const it of items){
      const f=it.f||{};
      if(f.hl)ops+=`${rgbOf(HLFILL[f.hl])} rg ${nn(cx)} ${nn(base-size*0.24)} ${nn(it.w)} ${nn(size*1.14)} re f\n`;
      if(!it.sp||f.hl)ops+=`${color} rg BT /${fk(f)} ${size} Tf ${nn(cx)} ${nn(base)} Td (${pstr(it.t)}) Tj ET\n`;
      const ul=f.hl?HLUL[f.hl]:f.u;

  para(legendRuns(),8.5,{after:10});
  for(const s of secs){
    if(s.heading){y+=8;para([{t:s.heading}],18,{force:{b:1},color:BRAND,after:4,keep:1,lh:1.3})}
    for(const b of docBlocks(s.html,s.shift||0)){
      if(b.k==='h'){const size={1:17,2:14,3:12.5}[b.n];if(y>M+1)y+=size*0.7;para(b.runs,size,{force:{b:1},color:BRAND,after:size*0.25,keep:1,lh:1.3})}
      else if(b.k==='hr'){need(12);page.push(`0.7 0.7 0.7 RG 0.6 w ${M} ${H-y-4} m ${W-M} ${H-y-4} l S\n`);y+=12}
      else if(b.k==='t'){
        const cols=Math.max(...b.rows.map(r=>r.length)),cw=(W-2*M)/cols;
        b.rows.forEach((row,ri)=>{
          const cells=Array.from({length:cols},(_,ci)=>wrap(toks(row[ci]||[],9.5,ri===0&&b.head?{b:1}:null),cw-10,9.5));

    }

  pages.push(page.join(''));
  pages.forEach((c,i)=>{const lbl=`${i+1} / ${pages.length}`;pages[i]=c+`0.5 0.55 0.58 rg BT /F1 8.5 Tf ${nn(W/2-14)} 26 Td (${lbl}) Tj ET\n`});
  const objs=[];const add=s=>objs.push(s);
  add('<< /Type /Catalog /Pages 2 0 R >>');add('');
  ['Helvetica','Helvetica-Bold','Helvetica-Oblique','Helvetica-BoldOblique','Courier'].forEach(n=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${n} /Encoding /WinAnsiEncoding >>`));
  const kids=[];
  pages.forEach(c=>{add(`<< /Length ${c.length} >>\nstream\n${c}endstream`);const cid=objs.length;
    add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R /F5 7 0 R >> >> /Contents ${cid} 0 R >>`);kids.push(objs.length+' 0 R')});

  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}

async function exportTopics(list,title,fmt){
  if(!list.length){toast('Nothing to export');return false}
  const secs=list.length===1?[{heading:null,html:list[0].html,shift:0}]:list.map(t=>({heading:t.title,html:t.html,shift:1}));
  try{
    const bytes=fmt==='pdf'?buildPdf(title,secs):buildDocx(title,secs);
    return await saveFile(safeName(title)+'.'+fmt,bytes,fmt==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }catch(e){toast('Could not create the file: '+(e.message||e),5000);return false}
}
function exportModal(){
  const subs=subjects();
  modal(`<h3>Export</h3><label class="f" for="xs">What to export</label><select id="xs"><option value="">Everything in my library</option>${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
  <label class="f">Format</label><div class="seg" id="xf"><button data-f="docx" aria-pressed="true">Word (.docx)</button><button data-f="pdf" aria-pressed="false">PDF</button></div>
  <p class="small muted">Highlights are kept as colours with their underline styles. Each topic starts under its own heading. PDF supports English and Western European text only.</p>
  <div class="row" style="margin-top:14px"><button class="btn pri" id="xgo">Export</button><button class="btn" id="xno">Cancel</button></div>`,b=>{
    let fmt='docx';
    $('#xf',b).onclick=e=>{const x=e.target.closest('button');if(!x)return;fmt=x.dataset.f;$$('#xf button',b).forEach(y=>y.setAttribute('aria-pressed',y===x))};

      await exportTopics(list,s||'Study Library',fmt);closeModal()};

}

/* ---------- spaced revision ---------- */
const INTERVALS=[1,3,7,14,30,60,120];
const DAY=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const isDue=t=>!!(t.rev&&t.rev.due&&t.rev.due<=today0());
function reviseTopic(t,grade){
  const r=t.rev||{stage:-1,count:0};let st=r.stage;
  if(grade==='hard')st=0;else if(grade==='ok')st=Math.min(INTERVALS.length-1,st+1);else st=Math.min(INTERVALS.length-1,st+2);
  st=Math.max(0,st);
  let due=today0()+INTERVALS[st]*DAY;
  if(S.settings.examDate){
    const ex=new Date(S.settings.examDate+'T00:00:00').getTime()-2*DAY;
    if(ex>today0()&&due>ex)due=Math.max(today0()+DAY,ex);
  }
  t.rev={stage:st,due,last:Date.now(),count:(r.count||0)+1,weak:grade==='hard'};
  return saveTopicNow(t);
}
const dueLabel=t=>{if(!t.rev)return '';const n=dayDiff(t.rev.due,today0());return n<0?`${-n} day${n===-1?'':'s'} overdue`:n===0?'due today':n===1?'due tomorrow':'due in '+n+' days'};

/* ---- Realtime Database REST, one JSON tree per user: users/<uid>/<store> ---- */
async function dbFetch(path,opts={}){

  if(!cfg||!tok||!sess)throw new Error('not signed in');
  const sep=path.includes('?')?'&':'?';
  const url=`${cfg.url}/users/${sess.uid}/${path}${sep}auth=${encodeURIComponent(tok)}`;
  const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts));
  if(!r.ok){const t=await r.text().catch(()=>'');let m='';try{m=firebaseErr(JSON.parse(t).error)}catch(e){}throw new Error('Sync request failed ('+r.status+'): '+(m||t.slice(0,140)))}

  return (t&&t!=='null')?JSON.parse(t):null;
}

const wordTarget=q=>isEssay(q)?800:200;
const AP_RX=/\bandhra\b|\bA\.?P\.?\b(?=[\s'’,.)]|$)|amaravati|amaravathi|polavaram|visakhapatnam|vizag|rayalaseema|vijayawada|tirupati|godavari|krishna|telugu|uttarandhra|kurnool|nellore|guntur|kakinada|srikakulam|bifurcation/i;

/* ----- syllabus index ----- */
let SYL={sig:'',ch:new Map(),st:new Map(),order:new Map()};
function syl(){
  const sig=S.syllabus.map(p=>p.id+':'+(p.updated||0)).join('|');
  if(SYL.sig===sig)return SYL;
  const ch=new Map(),st=new Map(),order=new Map();let i=0;
  S.syllabus.slice().sort((a,b)=>a.id.localeCompare(b.id)).forEach(p=>(p.chapters||[]).forEach(c=>{
    ch.set(c.id,Object.assign({paper:p.id},c));order.set(c.id,i++);
    (c.subtopics||[]).forEach((s,k)=>{st.set(s.id,Object.assign({chapter:c.id,paper:p.id,k},s));order.set(s.id,i++)});
  }));
  SYL={sig,ch,st,order};return SYL;
}
const chapterName=id=>{const c=syl().ch.get(id);return c?`${c.no!=null?c.no+'. ':''}${c.title}`:''};
const subtopicName=id=>{const s=syl().st.get(id);return s?s.title:''};
const qIsAP=q=>AP_RX.test(q.text)||AP_RX.test(chapterName(q.chapter))||AP_RX.test(subtopicName(q.subtopic));
function repeatCounts(){const m=new Map();S.questions.forEach(q=>{if(q.repeatGroup)m.set(q.repeatGroup,(m.get(q.repeatGroup)||0)+1)});return m}

/* ----- answers ----- */
function ansIndex(){
  const m=new Map();
  const get=id=>{let o=m.get(id);if(!o){o={ai:0,ver:0,mine:0,last:0};m.set(id,o)}return o};
  S.answers.forEach(a=>{const o=get(a.qid);if(a.kind==='ai'){o.ai++;if(a.verified)o.ver++}else{o.mine++;o.last=Math.max(o.last,a.updated||0)}});
  S.plans.forEach(p=>{if(p.scores&&p.scores.length){const o=get(p.questionId);o.mine+=0;o.scored=1;o.last=Math.max(o.last,p.scores[p.scores.length-1].at||0)}});
  return m;
}
const answersFor=qid=>S.answers.filter(a=>a.qid===qid).sort((a,b)=>(a.kind===b.kind?0:a.kind==='ai'?-1:1)||(a.created||0)-(b.created||0));
const countWords=t=>(t.match(/[\p{L}\p{N}][\p{L}\p{N}'’.-]*/gu)||[]).length;
function planFor(q){
  let p=S.plans.find(x=>x.questionId===q.id);
  if(!p){p={id:uid(),questionId:q.id,sections:{},exampleIds:[],diagram:'',check:{},scores:[],minutes:isEssay(q)?60:12,updated:0};S.plans.push(p)}
  return p;
}

/* ----- list view ----- */
let PRACTISE_LINKED=false;
let QF={tab:'bank',paper:'',src:'',flt:new Set(),q:'',open:new Set(),grp:''};
function qMatches(q,A){
  if(QF.paper&&(QF.paper==='other'?paperById(q.paper):q.paper!==QF.paper))return false;
  if(QF.src&&(q.source||'Mine')!==QF.src)return false;
  if(QF.grp&&q.repeatGroup!==QF.grp)return false;
  const a=A.get(q.id)||{};
  if(QF.tab==='model'&&!a.ai)return false;
  if(QF.flt.has('vh')&&q.likelihood!=='Very high')return false;
  if(QF.flt.has('ans')&&!a.ai)return false;
  if(QF.flt.has('noans')&&a.ai)return false;
  if(QF.flt.has('ver')&&!a.ver)return false;
  if(QF.flt.has('new')&&(a.mine||a.scored))return false;
  if(QF.flt.has('ap')&&!qIsAP(q))return false;
  if(QF.q){const t=(q.text+' '+chapterName(q.chapter)+' '+subtopicName(q.subtopic)+' '+(q.basis||'')).toLowerCase();if(!QF.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)))return false}
  return true;
}
function qRow(q,A,R){
  const a=A.get(q.id)||{},rc=q.repeatGroup?R.get(q.repeatGroup):0;
  const src=q.source==='PYQ'?'<span class="qb pyq">PYQ</span>':q.source==='Probable'?`<span class="qb prob${q.likelihood==='Very high'?' vh':''}">Probable${q.likelihood?' · '+esc(q.likelihood):''}</span>`:'<span class="qb mine">Mine</span>';
  const st=a.ai?(a.ver?'<span class="qb ok">✓ Model answer</span>':'<span class="qb draft">Model answer · AI draft</span>'):'';
  const also=(q.alsoRelevant||[]).map(id=>{const c=syl().ch.get(id);return c?`<span class="qb also" title="${esc(chapterName(id))}">also ${paperById(c.paper)?paperById(c.paper).n.replace('Paper ','P-'):''} ch ${c.no}</span>`:''}).join('');
  return `<a class="qrow" href="#/practise/${encodeURIComponent(q.id)}"><div class="qt">${esc(q.text)}</div><div class="qm">${src}${q.directive?`<span class="qb dir">${esc(q.directive)}</span>`:''}${rc>1?`<span class="qb rep">theme asked ${rc}×</span>`:''}${st}${a.mine||a.scored?'<span class="qb att">attempted</span>':''}${also}</div></a>`;
}

  if(QF.tab==='mine')return drawAttempts();

function drawBank(A){
  const R=repeatCounts(),body=$('#qbody');
  const hasOther=S.questions.some(q=>!paperById(q.paper));
  const chips=(arr,key)=>arr.map(([v,l])=>`<button class="chip" data-${key}="${v}" aria-pressed="${key==='p'?QF.paper===v:key==='s'?QF.src===v:QF.flt.has(v)}">${l}</button>`).join('');
  body.innerHTML=`<input type="search" id="qq" placeholder="Search questions, chapters, sub-topics" value="${esc(QF.q)}" aria-label="Search questions">
   <div class="hscroll" id="qpf">${chips([['','All papers'],...PAPERS.map(p=>[p.id,p.n]),...(hasOther?[['other','Other']]:[])],'p')}</div>
   <div class="hscroll" id="qff">${chips([['PYQ','PYQ'],['Probable','Probable'],['Mine','Mine']],'s')}${chips([['vh','Very high'],...(QF.tab==='bank'?[['ans','Has model answer'],['noans','No model answer']]:[]),['ver','Verified'],['new','Not attempted'],['ap','Andhra Pradesh']],'f')}</div>
   ${QF.grp?`<div class="card tight row sp" style="margin:8px 0"><span class="small">Showing every version of one repeated theme.</span><button class="btn sm" id="qgx">Show all</button></div>`:''}
   <div id="qstat" class="small muted" style="margin:8px 0"></div><div id="qtree"></div>`;
  const draw=()=>{
    const list=S.questions.filter(q=>qMatches(q,A)),Y=syl();
    const filtering=!!(QF.q||QF.src||QF.flt.size||QF.grp||QF.tab==='model');
    $('#qstat').textContent=`${list.length} question${list.length===1?'':'s'}${QF.tab==='model'?' with a model answer':''}${filtering&&list.length?' · tap a chapter to open it':''}`;
    if(!S.questions.length){$('#qtree').innerHTML=`<div class="empty">No questions yet. Tap <b>Import</b> to bring in your question bank (question-bank.json), or add your own with <b>+ Question</b>.</div>`;return}
    if(!list.length){$('#qtree').innerHTML=`<div class="empty">${QF.tab==='model'?'No model answers match these filters yet. Import answers from your revision pages, or paste one on any question.':'No questions match these filters.'}</div>`;return}
    const byP=new Map();
    list.forEach(q=>{const pk=paperById(q.paper)?q.paper:'other';const ck=Y.ch.has(q.chapter)?q.chapter:'_'+pk;
      if(!byP.has(pk))byP.set(pk,new Map());const m=byP.get(pk);if(!m.has(ck))m.set(ck,[]);m.get(ck).push(q)});
    const autoOpen=filtering&&list.length<=40;
    let h='';
    [...PAPERS.map(p=>p.id),'other'].forEach(pk=>{
      const m=byP.get(pk);if(!m)return;const p=paperById(pk);
      h+=`<h2 class="sec pphd">${p?esc(p.n+' – '+p.t):'Other questions'}</h2>`;
      [...m.keys()].sort((a,b)=>(Y.order.get(a)??1e9)-(Y.order.get(b)??1e9)).forEach(ck=>{
        const qs=m.get(ck),pr=qs.filter(q=>q.source==='Probable').length,an=qs.filter(q=>(A.get(q.id)||{}).ai).length;
        const open=autoOpen||QF.open.has(ck);
        h+=`<details class="chap" data-ch="${esc(ck)}" ${open?'open':''}><summary><span class="ct">${ck.startsWith('_')?'Not linked to a chapter':esc(chapterName(ck))}</span><span class="cc">${qs.length} Q${pr?` · ${pr} probable`:''}${an?` · ${an} answered`:''}</span></summary><div class="cb">${open?chapBody(qs,A,R):''}</div></details>`;
      });
    });
    $('#qtree').innerHTML=h;
    $$('#qtree details.chap').forEach(d=>d.addEventListener('toggle',()=>{
      const ck=d.dataset.ch;if(d.open){QF.open.add(ck);const cb=$('.cb',d);if(!cb.innerHTML){const qs=S.questions.filter(q=>qMatches(q,A)&&((Y.ch.has(q.chapter)?q.chapter:'_'+(paperById(q.paper)?q.paper:'other'))===ck));cb.innerHTML=chapBody(qs,A,R)}}else QF.open.delete(ck)}));
    if(QF.jump){const el=$(`#qtree details[data-ch="${QF.jump}"]`);QF.jump=null;if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),30)}
  };
  draw();
  let t;$('#qq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{QF.q=e.target.value.trim();draw()},220)};
  $('#qpf').onclick=e=>{const c=e.target.closest('[data-p]');if(!c)return;QF.paper=c.dataset.p;$$('#qpf .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw()};
  $('#qff').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
    if(c.dataset.s!==undefined){QF.src=QF.src===c.dataset.s?'':c.dataset.s;$$('#qff [data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===QF.src))}
    else{const v=c.dataset.f;if(QF.flt.has(v))QF.flt.delete(v);else{QF.flt.add(v);if(v==='ans')QF.flt.delete('noans');if(v==='noans')QF.flt.delete('ans')}$$('#qff [data-f]').forEach(x=>x.setAttribute('aria-pressed',QF.flt.has(x.dataset.f)))}
    draw()};
  const gx=$('#qgx');if(gx)gx.onclick=()=>{QF.grp='';VIEWS.practise({})};
}
function chapBody(qs,A,R){
  const Y=syl(),by=new Map();

function ansStructure(root){
  const kids=[...root.children].filter(e=>e.textContent.trim());
  const txt=e=>e.textContent.replace(/\s+/g,' ').trim();
  const first=kids[0],last=kids[kids.length-1];
  const intro=!!first&&(/^(introduction|intro)\b/i.test(txt(first))||(first.tagName==='P'&&countWords(txt(first))>=12)||kids.slice(0,3).some(e=>/^(introduction|intro)\b/i.test(txt(e))));
  const body=!!root.querySelector('ul,ol,table,h3,h4,h5')||kids.length>=4;
  const concl=kids.some(e=>/^(conclusion|way forward|to conclude|in conclusion)\b/i.test(txt(e)))||(!!last&&last!==first&&last.tagName==='P'&&!!root.querySelector('ul,ol'));
  return{intro,body,concl};
}
function textNodesFor(root){
  const out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.data.trim()&&!n.parentElement.closest('mark,a,code,.nohl')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  let n;while((n=w.nextNode()))out.push(n);return out;
}
function wrapMatches(root,rx,cls,limit){
  let made=0;
  for(const n of textNodesFor(root)){
    if(limit&&made>=limit)break;
    rx.lastIndex=0;const ms=[...n.data.matchAll(rx)].filter(m=>m[0].trim().length>1);
    for(let i=ms.length-1;i>=0;i--){
      const m=ms[i];let s=m.index,e=s+m[0].length;
      while(e>s&&/[\s,;:.]/.test(n.data[e-1]))e--;
      if(e<=s)continue;
      const mid=n.splitText(s);mid.splitText(e-s);
      const mk=document.createElement('mark');mk.className='hl hl-'+cls;mk.setAttribute('data-a','1');mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid);made++;
    }
  }
  return made;
}
const AH={
  legal:/\b(?:Articles?|Art\.)\s?\d+[A-Z]?(?:\s?\(\d+[a-z]?\))*(?:\s?(?:,|and|&|to)\s?\d+[A-Z]?(?:\(\d+[a-z]?\))*)*|\b(?:Sections?|s\.)\s?\d+[A-Z]?(?:\(\d+\))?(?=\W)|\b\d+(?:st|nd|rd|th)\s(?:Constitutional\s)?(?:Amendment|Finance Commission|Schedule|Five[- ]Year Plan)(?:\sAct)?(?:,?\s(?:19|20)\d\d)?|\b(?:[A-Z][\w.'’&-]*\s(?:(?:of|for|and|on|the|to|in)\s)*){1,6}(?:Act|Code|Sanhita|Adhiniyam|Rules|Bill|Amendment|Committee|Commission|Council|Authority|Tribunal|Report|Declaration|Protocol|Convention|Accord|Agreement|Doctrine)(?:,?\s(?:19|20)\d\d)?\b|\b[A-Z][\w.]+(?:\s[A-Z][\w.]+){0,3}\sv(?:s)?\.?\s[A-Z][\w.]+(?:\s[A-Z][\w.]+){0,3}(?:\s?\((?:19|20)\d\d\))?/g,
  scheme:/\b(?:[A-Z][\w'’-]+\s){1,5}(?:Yojana|Mission|Abhiyan|Scheme|Programme|Program|Policy|Initiative|Pathakam|Kanuka|Bharosa|Deevena|Sachivalayam|Corridor|Index|Vision)(?:\s(?:19|20)\d\d)?\b/g,
  data:/(?:₹|Rs\.?\s?|INR\s?|US\$\s?|\$)\s?\d[\d,]*(?:\.\d+)?(?:\s?(?:lakh|crore|million|billion|trillion|bn|cr)\b)?(?:\s?crore\b)?|\b\d[\d,]*(?:\.\d+)?\s?(?:%|per\s?cent\b|percent\b)|\b\d[\d,]*(?:\.\d+)?\s?(?:lakh|crore|million|billion|trillion)\b(?:\s(?:tonnes|hectares|acres|people|households|km|MW|GW|jobs|farmers|families))?|\b\d[\d,]*(?:\.\d+)?\s?(?:sq\.?\s?km|km|hectares?|acres?|MW|GW|TMC|mm|tonnes?)\b|\b(?:1[6-9]|20)\d\d(?:\s?[–-]\s?\d{2,4})?\b/g,
  example:/\b(?:for example|for instance|e\.g\.|case study|such as|as seen in|best practice|success story)[,:]?\s[^.;:()\n]{3,70}/gi,
  wayHead:/^(way forward|conclusion|the way ahead|suggestions?|recommendations?|reforms?( needed)?|measures( needed)?|steps( needed)?|solutions?|remedies)\b/i
};
function ansHighlight(root,q){
  let n=0;
  /* way-forward points: lead phrase of each point after a "Way forward / Conclusion / Measures" heading */
  let inWay=false;
  [...root.children].forEach(el=>{
    const t=el.textContent.replace(/\s+/g,' ').trim();
    if(/^H[1-6]$/.test(el.tagName)||(/^P$/.test(el.tagName)&&el.firstElementChild&&/^(B|STRONG)$/.test(el.firstElementChild.tagName)&&t.startsWith(el.firstElementChild.textContent.trim())&&el.firstElementChild.textContent.trim().length<40)){
      const head=/^H/.test(el.tagName)?t:el.firstElementChild.textContent.trim();
      inWay=AH.wayHead.test(head.replace(/^[^A-Za-z]+/,''));if(/^H/.test(el.tagName))return;
    }
    if(!inWay)return;
    $$('li',el).concat(el.tagName==='LI'?[el]:[]).forEach(li=>{
      const lead=li.querySelector(':scope > b, :scope > strong');
      const target=lead&&!lead.closest('mark')?lead:null;
      if(target){const mk=document.createElement('mark');mk.className='hl hl-w';mk.setAttribute('data-a','1');target.parentNode.insertBefore(mk,target);mk.appendChild(target);n++;return}
      const tn=textNodesFor(li)[0];if(!tn)return;
      const m=/^\s*[^,:;.]{3,60}?(?=[,:;.]|$)/.exec(tn.data);if(!m)return;
      const ws=m[0].trim().split(/\s+/);if(ws.length>9)return;
      const s=tn.data.indexOf(m[0].trim()),mid=tn.splitText(s);mid.splitText(m[0].trim().length);
      const mk=document.createElement('mark');mk.className='hl hl-w';mk.setAttribute('data-a','1');mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid);n++;
    });
  });
  n+=wrapMatches(root,AH.legal,'d');
  n+=wrapMatches(root,AH.scheme,'k');
  n+=wrapMatches(root,AH.data,'f');
  n+=wrapMatches(root,AH.example,'e');
  /* words that echo the question: first use of each, so the examiner sees the question answered */
  if(q){
    const skip=new Set([...DIRECTIVES.map(d=>d.toLowerCase()),'critically','briefly','write','note','account','explain','discuss','examine','analyse','analyze','light','context','role','various','different','significance','importance','reference','india','indian','state','states','government']);
    const terms=[...new Set((q.text.match(/[A-Za-z][A-Za-z'’-]{4,}/g)||[]).map(w=>w.toLowerCase()).filter(w=>!skip.has(w)&&!(typeof STOPS!=='undefined'&&STOPS.has(w))))].slice(0,10);
    terms.forEach(w=>{const rx=new RegExp('\\b'+escRe(w.slice(0,Math.max(5,w.length-2)))+'[a-z]*\\b','i');n+=wrapMatches(root,new RegExp(rx.source,'gi'),'k',1)});
  }
  return n;
}

function planText(q,p){
  const lines=['# '+q.text,'',[paperLabel(q),q.directive,q.marks?q.marks+' marks':''].filter(Boolean).join(' · '),''];
  SKEL.forEach(sec=>{const s=p.sections[sec.k];if(s&&s.on===false)return;lines.push('## '+sec.t);
    if(sec.subs.length){Object.keys((s&&s.subs)||{}).forEach(k=>{lines.push('- '+k+(s.subs[k]?': '+s.subs[k].replace(/\n+/g,'; '):''))})}
    else if(sec.k==='examples'){(p.exampleIds||[]).map(id=>byId(S.examples,id)).filter(Boolean).forEach(e=>lines.push('- '+e.title+(e.date?' ('+e.date+')':'')+(e.summary?': '+e.summary:'')))}
    else if(sec.k==='diagram'){if(p.diagram)lines.push(p.diagram)}
    else if(s&&s.text)lines.push(s.text);
    lines.push('')});
  return lines.join('\n');
}

const BANK_FIELDS=['text','paper','chapter','subtopic','source','likelihood','basis','directive','repeatGroup','alsoRelevant','type'];
async function importBank(file){

    if(!x||!x.id||!x.text)continue;
    const cur=byId(S.questions,x.id);
    if(!cur){add.push(Object.assign({topicIds:[],marks:'',year:''},pickFields(x),{id:x.id,bank:true,created:now,updated:now}));continue}
    const fields=cur.mod?BANK_FIELDS.filter(f=>f!=='text'&&f!=='directive'):BANK_FIELDS,nx=pickFields(x);
    const diff=fields.some(f=>JSON.stringify(cur[f]??null)!==JSON.stringify(nx[f]??null));

  }

  const pyq=add.filter(q=>q.source==='PYQ').length,prob=add.filter(q=>q.source==='Probable').length;
  modal(`<h3>Import question bank</h3>

    <ul class="small"><li><b>${add.length}</b> new question${add.length===1?'':'s'}${add.length?` (${pyq} previous-year, ${prob} probable)`:''}</li><li><b>${upd.length}</b> updated</li><li>${same} unchanged</li>${kept.length?`<li>${kept.length} you edited yourself: your wording is kept, only their chapter and tags are updated</li>`:''}</ul>
    <p class="small muted">Your own questions, answers, plans and scores are not changed. A safety copy is taken first.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="ibOk">Import</button><button class="btn" id="ibNo">Cancel</button></div>`,b=>{

        await DB.putMany('syllabus',recs);
        const ch=[];
        [...upd,...kept].forEach(({cur,x,fields})=>{const nx=pickFields(x);fields.forEach(f=>{cur[f]=nx[f]});cur.bank=true;cur.updated=now;ch.push(cur)});

        if(location.hash.startsWith('#/practise'))VIEWS.practise({});else location.hash='#/practise';
      };
    });

const pickFields=x=>{const o={};BANK_FIELDS.forEach(f=>{o[f]=x[f]??null});if(!Array.isArray(o.alsoRelevant))o.alsoRelevant=[];return o};

/* matching revision-page questions to the bank */
const MSTOP=new Set('a an the of in on and or to for with by is are was were be been as at from its it this that their his her into what how why which who whom whose do does did discuss examine explain critically analyse analyze evaluate describe comment elucidate justify suggest briefly brief write note notes account give state also any some your about between under over upon within other such these those there here can may might would should could will has have had not but than then them they its i ii iii iv v vi'.split(' '));
const normQ=s=>String(s).toLowerCase().replace(/previous year question|probable question|\(\s*\d+\s*marks?\s*\)/g,' ').replace(/[^a-z0-9ఀ-౿]+/g,' ').replace(/\s+/g,' ').trim();
const qTok=s=>new Set(normQ(s).split(' ').filter(w=>w.length>1&&!MSTOP.has(w)).map(w=>stem(w)));
/* rare shared words count for more than common ones; a rephrased question that keeps its key terms still matches */
function qSim(A,B,na,nb,W){
  if(!A.size||!B.size)return 0;
  const wt=w=>W?(W.get(w)||W.max):1;
  let i=0,sa=0,sb=0;for(const w of A){const x=wt(w);sa+=x;if(B.has(w))i+=x}for(const w of B)sb+=wt(w);
  const dice=2*i/(sa+sb),cover=i/Math.min(sa,sb);
  let s=0.6*dice+0.4*cover;
  if(na.length>20&&nb.length>20&&(na.includes(nb)||nb.includes(na)))s=Math.max(s,0.95);
  return Math.min(1,s);
}
function qWeights(pool){
  const df=new Map();pool.forEach(p=>p.t.forEach(w=>df.set(w,(df.get(w)||0)+1)));
  const N=pool.length||1,W=new Map();df.forEach((d,w)=>W.set(w,Math.log(1+N/d)));W.max=Math.log(1+N);return W;
}
function parseRevisionPage(html,fname){
  const raw=html;
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,template').forEach(n=>n.remove());
  /* short label paragraphs used as sub-headings ("Introduction", "Way forward") become real headings */
  doc.querySelectorAll('p.lab,p.label,p.sub-head,p.subhead,div.lab').forEach(el=>{if(el.textContent.trim().length<70){const h=doc.createElement('h4');h.innerHTML=el.innerHTML;el.replaceWith(h)}});
  let title=(doc.title||(doc.querySelector('h1')||{}).textContent||fname||'Revision sheet').replace(/\s+/g,' ').trim();
  title=title.replace(/\s*[–—|-]\s*APPSC.*$/i,'').replace(/\s*\brevision( sheet)?\s*$/i,'').trim()||fname;
  const items=[];let qaSection=null;
  const clean=t=>t.replace(/\s+/g,' ').trim().replace(/^(?:Q\s?\d+|\d+)\s*[.:)\-–]?\s*/i,'').trim();
  let blocks=[...doc.querySelectorAll('.qa')].filter(el=>!el.parentElement||!el.parentElement.closest('.qa'));
  blocks.forEach(el=>{
    const h=el.querySelector('h1,h2,h3,h4,h5,h6');if(!h)return;
    const hc=h.cloneNode(true);const srcTag=((hc.querySelector('.src')||{}).textContent||'').trim();
    hc.querySelectorAll('.badge,.src,button,.noexp').forEach(n=>n.remove());
    const qtext=clean(hc.textContent);if(qtext.length<8)return;
    let ah;const ans=el.querySelector('.ans');
    if(ans)ah=ans.innerHTML;else{const c=el.cloneNode(true);const hh=c.querySelector(h.tagName);let n=c.firstChild;while(n&&n!==hh){const nx=n.nextSibling;n.remove();n=nx}if(hh)hh.remove();c.querySelectorAll('button,.noexp,.sec-tools').forEach(n=>n.remove());ah=c.innerHTML}
    items.push({qtext,html:sanitizeRich(ah),srcTag});
    if(!qaSection)qaSection=el.closest('section')||el.parentElement;
  });
  if(!items.length){
    const hd=[...doc.querySelectorAll('h1,h2,h3')].find(h=>/model answers?|questions?\s+(?:and|with)\s+(?:model\s+)?answers?|probable questions/i.test(h.textContent));
    if(hd){
      qaSection=hd.closest('section')||hd.parentElement;
      const lvl=+hd.tagName[1];let cur=null;
      let n=hd.nextElementSibling;
      while(n){
        if(/^H[1-6]$/.test(n.tagName)&&+n.tagName[1]<=lvl)break;
        if(/^H[1-6]$/.test(n.tagName)){if(cur)items.push(cur);const hc=n.cloneNode(true);hc.querySelectorAll('.badge,button').forEach(x=>x.remove());cur={qtext:clean(hc.textContent),html:'',srcTag:''}}
        else if(cur)cur.html+=n.outerHTML;
        n=n.nextElementSibling;
      }
      if(cur)items.push(cur);
      items.forEach(it=>{it.html=sanitizeRich(it.html)});
    }
  }
  const valid=items.filter(it=>it.qtext.length>=8&&strip(it.html).length>20);
  /* the rest of the page becomes a Library note */
  const body=doc.body.cloneNode(true);
  if(qaSection){const id=qaSection.id;const tgt=id?body.querySelector('#'+CSS.escape(id)):null;if(tgt)tgt.remove();else body.querySelectorAll('.qa').forEach(n=>n.remove())}
  body.querySelectorAll('nav,button,.noexp,.sec-tools,.tools,[role="toolbar"],#ov,.toast,footer,input,select,textarea,dialog').forEach(n=>n.remove());
  return{title,items:valid,notesHtml:body.innerHTML,raw,qaId:qaSection&&qaSection.id||'',fonts:fontLinksOf(raw)};
}
/* remove the questions-and-answers part (and leftover tools) from a captured page */
function stripQA(html,qaId){
  const d=new DOMParser().parseFromString(html,'text/html');
  const tgt=qaId?d.getElementById(qaId):null;
  if(tgt)tgt.remove();else{d.querySelectorAll('.qa').forEach(n=>n.remove());[...d.querySelectorAll('h1,h2,h3')].filter(h=>/model answers?|questions?\s+(?:and|with)\s+(?:model\s+)?answers?/i.test(h.textContent)).forEach(h=>{const sec=h.closest('section');(sec||h).remove()})}
  d.querySelectorAll('nav,button,.noexp,.sec-tools,.tools,[role="toolbar"],#ov,.toast,input,select,textarea,dialog,script,style,link').forEach(n=>n.remove());

}
async function importAnswers(files,saveNotes){

async function importAnswersPages(pages,saveNotes){

  if(!items.length&&!(saveNotes&&pages.length)){toast('No questions and answers were found in those pages.',4500);return}
  const pool=S.questions.map(q=>({q,t:qTok(q.text),n:normQ(q.text)})),W=qWeights(pool);
  const score=(it,chap)=>{const t=qTok(it.qtext),n=normQ(it.qtext);
    return pool.map(p=>({q:p.q,s:Math.min(1,qSim(t,p.t,n,p.n,W)+(chap&&p.q.chapter===chap?0.08:0))})).sort((a,b)=>b.s-a.s).slice(0,4)};

  /* second pass: questions on one page usually belong to one chapter, so favour it */
  pages.forEach(pg=>{const cnt=new Map();items.filter(x=>x.page===pg&&x.auto).forEach(x=>{const q=byId(S.questions,x.choice);if(q&&q.chapter)cnt.set(q.chapter,(cnt.get(q.chapter)||0)+1)});
    const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1])[0];if(top)items.filter(x=>x.page===pg&&!x.auto).forEach(x=>decide(x,score(x,top[0])))});

  pages.forEach(pg=>{const cnt=new Map();items.filter(it=>it.page===pg&&it.auto).forEach(it=>{const q=byId(S.questions,it.choice);if(q&&q.chapter)cnt.set(q.chapter,(cnt.get(q.chapter)||0)+1)});
    pg.chapter=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||'';
    const old=S.topics.find(x=>x.title===pg.title);pg.existing=old||null;
    if(!pg.chapter&&old&&old.chapterId)pg.chapter=old.chapterId;

async function applyAnswerImport(items,pages,saveNotes){

    for(const pg of pages){
      if(!strip(pg.notesHtml))continue;
      let cap=null;try{cap=await captureSheet(pg.raw)}catch(e){}
      const rich=sanitizeRich(cap?stripQA(cap,pg.qaId):pg.notesHtml);
      const p=paperById(pg.paper),ch=syl().ch.get(pg.chapter);
      let t=pg.existing&&byId(S.topics,pg.existing.id);
      if(!t){
        t={id:uid(),title:pg.title,subject:p?p.n+' – '+p.t:'Revision sheets',unit:ch?chapterName(ch.id):'',tags:['revision sheet'],html:sanitize(pg.notesHtml)||'<p></p>',qs:rich,summary:'',created:now,updated:now,lastOpened:0,progress:0,exampleIds:[],source:pg.file,chapterId:ch?ch.id:'',fonts:pg.fonts};
        S.topics.push(t);sheetsNew++;
      }else{
        t.qs=rich;t.fonts=pg.fonts;if(ch){t.chapterId=ch.id;if(!t.unit)t.unit=chapterName(ch.id);if(p&&(!t.subject||t.subject==='Revision sheets'))t.subject=p.n+' – '+p.t}
        if(!(t.tags||[]).includes('revision sheet'))t.tags=[...(t.tags||[]),'revision sheet'];
        sheetsUpd++;
      }
      await saveTopicNow(t);
      noteFor.set(pg,t);
    }
  }
  for(const it of items){
    if(it.choice==='skip'){skipped++;continue}
    let q;
    if(it.choice==='new'){
      const c=syl().ch.get(it.nch);
      const dir=(DIRECTIVES.find(d=>new RegExp('^'+escRe(d)+'\\b','i').test(it.qtext))||(it.qtext.match(/\b(Discuss|Examine|Explain|Analyse|Analyze|Evaluate|Describe|Comment|Elucidate|Justify|Assess|Distinguish|Define)\b/)||[])[1]||'');
      q={id:'my-'+uid(),text:it.qtext,paper:c?c.paper:'',chapter:c?c.id:'',subtopic:it.nst||'',source:/previous year/i.test(it.srcTag)?'PYQ':'Probable',likelihood:null,basis:'From revision page: '+it.page.title,directive:dir,repeatGroup:null,alsoRelevant:[],type:c&&c.paper==='P1'?'essay':'question',topicIds:[],marks:'',year:'',created:now,updated:now};
      S.questions.push(q);newQs.push(q);
    }else q=byId(S.questions,it.choice);
    if(!q){skipped++;continue}
    const t=noteFor.get(it.page);
    if(t&&!(q.topicIds||[]).includes(t.id)){q.topicIds=[...(q.topicIds||[]),t.id];q.updated=now;touchedQs.set(q.id,q)}
    const cur=byId(S.answers,it.aid);
    if(cur&&cur.mod){keptMine++;continue}
    if(cur&&cur.qid===q.id&&cur.html===it.html){continue}
    const a=Object.assign(cur||{id:it.aid,created:now,verified:false},{qid:q.id,kind:'ai',html:it.html,origin:'Claude · '+it.page.title,words:countWords(strip(it.html)),updated:now});
    if(!cur){S.answers.push(a);added++}else updated++;
    ans.push(a);
  }
  await DB.putMany('answers',ans);
  await DB.putMany('questions',[...newQs,...[...touchedQs.values()].filter(q=>!newQs.includes(q))]);
  await linkSheetsToChapters();
  closeModal();
  toast(`${added} answer${added===1?'':'s'} added${updated?`, ${updated} updated`:''}${newQs.length?`, ${newQs.length} new question${newQs.length===1?'':'s'}`:''}${sheetsNew?`, ${sheetsNew} revision sheet${sheetsNew===1?'':'s'} added`:''}${sheetsUpd?`, ${sheetsUpd} sheet${sheetsUpd===1?'':'s'} refreshed`:''}${keptMine?`. ${keptMine} you had edited were kept`:''}.`,6000);
  QF.tab=items.length?'model':'sheets';if(location.hash.startsWith('#/practise'))VIEWS.practise({});else location.hash='#/practise';
}

async function linkSheetsToChapters(){
  if(!S.syllabus.length)return 0;
  const ch=[];
  S.topics.filter(t=>!t.chapterId&&(t.tags||[]).includes('revision sheet')).forEach(t=>{
    const cnt=new Map();S.questions.forEach(q=>{if((q.topicIds||[]).includes(t.id)&&q.chapter)cnt.set(q.chapter,(cnt.get(q.chapter)||0)+1)});

}

/* ----- search inside Practise: questions, model answers and my answers ----- */
let PIDX=null;
function pIndex(){
  const sig=S.questions.length+':'+S.answers.length+':'+Math.max(0,...S.questions.map(q=>q.updated||0))+':'+Math.max(0,...S.answers.map(a=>a.updated||0));
  if(PIDX&&PIDX.sig===sig)return PIDX;
  const docs=[],df=new Map();
  const add=(kind,ref,text,extra)=>{
    const tf=new Map();let len=0;
    for(const x of toks(text+(extra?' '+extra:''))){if(x.stop||x.w.length<2)continue;tf.set(x.s,(tf.get(x.s)||0)+1);len++}
    if(!len)return;tf.forEach((_,k)=>df.set(k,(df.get(k)||0)+1));docs.push({kind,ref,text,tf,len});
  };
  S.questions.forEach(q=>add('q',q,q.text,subtopicName(q.subtopic)));
  S.answers.forEach(a=>{const q=byId(S.questions,a.qid);if(q&&a.html)add('a',a,strip(a.html))});
  const N=docs.length||1,avg={q:0,a:0},cnt={q:0,a:0};docs.forEach(d=>{avg[d.kind]+=d.len;cnt[d.kind]++});
  avg.q=avg.q/(cnt.q||1);avg.a=avg.a/(cnt.a||1);
  PIDX={sig,docs,df,N,avg};return PIDX;
}
function psearch(q){
  const P=pIndex();if(!P.docs.length||!q.trim())return{questions:[],answers:[],stems:[]};
  const all=toks(q),long=all.length>=7,terms=new Map();
  all.forEach(t=>{if(!t.stop&&t.w.length>=2&&!(long&&QSTOP.has(t.w)))terms.set(t.s,1)});
  const base=[...terms.keys()];
  try{const sm=synMap();base.forEach(s=>{const g=sm.get(s);if(g)g.forEach(b=>{if(!terms.has(b))terms.set(b,0.5)})})}catch(e){}
  try{const ix=NLP.idx;if(ix&&ix.acro)for(const [ac,full] of ix.acro){if(terms.has(ac))full.forEach(s=>{if(!terms.has(s))terms.set(s,0.45)});else if(full.length>1&&full.every(s=>terms.has(s))&&!terms.has(ac))terms.set(ac,0.8)}}catch(e){}
  const K1=1.2,B=0.75,res=[];
  for(const d of P.docs){
    let sc=0,hit=0;
    for(const [s,w] of terms){const tf=d.tf.get(s);if(!tf)continue;hit+=w===1?1:0;const idf=Math.log(1+(P.N-P.df.get(s)+0.5)/(P.df.get(s)+0.5));sc+=w*idf*(tf*(K1+1))/(tf+K1*(1-B+B*d.len/(P.avg[d.kind]||1)))}
    if(sc>0)res.push({d,sc,hit});
  }
  const need=Math.min(base.length,long?Math.max(2,Math.ceil(base.length*0.35)):base.length>2?2:1);
  const pick=kind=>{const r=res.filter(x=>x.d.kind===kind&&x.hit>=need).sort((a,b)=>b.sc-a.sc);const top=r.length?r[0].sc:0;return r.filter(x=>x.sc>=top*0.3).slice(0,kind==='q'?12:8)};
  const snip=(text)=>{
    const ss=sentencesOf(text);let best=ss[0]||text,bs=-1;
    for(const s1 of ss){let n=0;for(const t of toks(s1))if(terms.has(t.s))n+=terms.get(t.s);if(n>bs){bs=n;best=s1}}
    if(best.length>220)best=best.slice(0,220)+'…';
    let out='',pos=0;for(const t of toks(best)){if(terms.has(t.s)){out+=esc(best.slice(pos,t.i))+'<b>'+esc(best.slice(t.i,t.e))+'</b>';pos=t.e}}
    return out+esc(best.slice(pos));
  };
  return{
    questions:pick('q').map(x=>({q:x.d.ref,sc:x.sc})),
    answers:pick('a').map(x=>({a:x.d.ref,q:byId(S.questions,x.d.ref.qid),sc:x.sc,snip:snip(x.d.text)})),
    stems:[...terms.keys()]
  };
}
function practiseResultsHtml(q){
  const r=psearch(q);if(!r.questions.length&&!r.answers.length)return{html:'',n:0};
  const hs=hsParam(r.stems),A=ansIndex(),R=repeatCounts();
  let h='';
  if(r.answers.length)h+=`<div class="subjhead">Model answers and my answers</div>`+r.answers.map(x=>`<a class="res pas" style="display:block" href="#/practise/${encodeURIComponent(x.q.id)}?a=${encodeURIComponent(x.a.id)}&hs=${hs}"><div class="p">${x.a.kind==='ai'?'Model answer':'My answer'} · ${esc(paperLabel(x.q))}${x.q.chapter?' › '+esc(chapterName(x.q.chapter)):''}</div><div style="font-weight:700;margin:2px 0">${esc(x.q.text)}</div><div class="snip">${x.snip}</div></a>`).join('');
  if(r.questions.length)h+=`<div class="subjhead">Questions in Practise</div><div class="res">`+r.questions.map(x=>qRow(x.q,A,R)).join('')+`</div>`;
  return{html:h,n:r.questions.length+r.answers.length};
}

/* ---------- car audio: real audio files made with Google's text-to-speech, played as normal media ----------
   Browser speech is not treated as media by Android, so it does not reach Android Auto or Bluetooth reliably and
   stops when the screen locks. Here notes and answers are turned into MP3 once (stored on this device only),
   then played through one <audio> element with lock-screen, headphone and steering-wheel controls. */
const CAR={
  key(){try{return localStorage.getItem('sl_ttskey')||''}catch(e){return ''}},
  setKey(v){try{v?localStorage.setItem('sl_ttskey',v):localStorage.removeItem('sl_ttskey')}catch(e){}},
  voice(){try{return localStorage.getItem('sl_ttsvoice')||''}catch(e){return ''}},
  setVoice(v){try{localStorage.setItem('sl_ttsvoice',v)}catch(e){}},
  list(){try{return JSON.parse(localStorage.getItem('sl_carlist')||'[]')}catch(e){return[]}},
  saveList(l){try{localStorage.setItem('sl_carlist',JSON.stringify(l))}catch(e){}},
  usage(){try{const u=JSON.parse(localStorage.getItem('sl_ttsuse')||'{}');const m=new Date().toISOString().slice(0,7);return u.m===m?u:{m,n:0}}catch(e){return{m:'',n:0}}},
  addUsage(n){const u=this.usage();u.n+=n;try{localStorage.setItem('sl_ttsuse',JSON.stringify(u))}catch(e){}},
  voiceType(name){return /Chirp3-HD|Chirp-HD/i.test(name)?'Chirp 3 HD':/Neural2/i.test(name)?'Neural2':/Wavenet/i.test(name)?'WaveNet':/Studio/i.test(name)?'Studio':/Standard/i.test(name)?'Standard':'Other'},
  freeOf(name){const t=this.voiceType(name);return t==='WaveNet'||t==='Standard'?4e6:1e6},
  rankVoice(name){return {'Chirp 3 HD':5,'Neural2':4,'WaveNet':3,'Studio':2,'Standard':1}[this.voiceType(name)]||0},
  async api(path,body){
    const k=this.key();if(!k)throw new Error('Add your Google voice key in More › Car audio first.');
    let r;
    try{r=await fetch('https://texttospeech.googleapis.com/v1/'+path+(path.includes('?')?'&':'?')+'key='+encodeURIComponent(k),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})}
    catch(e){throw new Error('Could not reach Google. Check your internet connection.')}
    if(!r.ok){
      let m='';try{const j=await r.json();m=(j.error&&j.error.message)||''}catch(e){}
      if(r.status===403&&/billing/i.test(m))throw new Error('Google says billing is not enabled for this key’s project. See the setup steps in More › Car audio.');
      if(r.status===403||r.status===401||/API key/i.test(m))throw new Error('Google did not accept the key ('+(m||r.status)+'). Check the key and that the Text-to-Speech API is enabled.');
      if(r.status===429)throw new Error('Google’s rate limit was reached. Wait a minute and try again.');
      throw new Error('Google returned an error ('+r.status+'): '+m.slice(0,160));
    }
    return r.json();
  },
  async voices(){
    const j=await this.api('voices?languageCode=en-IN');
    return (j.voices||[]).filter(v=>(v.languageCodes||[]).some(c=>/^en-IN$/i.test(c))).sort((a,b)=>this.rankVoice(b.name)-this.rankVoice(a.name)||a.name.localeCompare(b.name));
  }
};

/* ----- MP3 helpers: strip tags/info frames so chunks join into one clean stream ----- */
function mp3FrameLen(b,i){
  if(b[i]!==0xFF||(b[i+1]&0xE0)!==0xE0)return 0;
  const ver=(b[i+1]>>3)&3,layer=(b[i+1]>>1)&3;if(ver===1||layer!==1)return 0;   // layer III only
  const bi=(b[i+2]>>4)&15,si=(b[i+2]>>2)&3,pad=(b[i+2]>>1)&1;if(bi===0||bi===15||si===3)return 0;
  const v1=ver===3;
  const br=(v1?[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320]:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160])[bi]*1000;
  const sr=[[11025,12000,8000],null,[22050,24000,16000],[44100,48000,32000]][ver][si];
  return Math.floor((v1?144:72)*br/sr)+pad;
}
function mp3Clean(buf){
  let b=new Uint8Array(buf),i=0;
  if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){const sz=((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127);i=10+sz+((b[5]&0x10)?10:0)}
  while(i<b.length-4&&!mp3FrameLen(b,i))i++;
  const L=mp3FrameLen(b,i);
  if(L){const seg=String.fromCharCode(...b.subarray(i,Math.min(i+L,b.length)));if(/Xing|Info|VBRI/.test(seg))i+=L}
  let end=b.length;
  if(end>128&&b[end-128]===0x54&&b[end-127]===0x41&&b[end-126]===0x47)end-=128;   // ID3v1 "TAG"
  return b.subarray(i,end);
}
let _actx=null;
async function mp3Duration(bytes){
  try{_actx=_actx||new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,24000);
    const ab=await _actx.decodeAudioData(bytes.slice().buffer);return ab.duration}catch(e){}
  /* fallback: count frames */
  let i=0,n=0,sr=24000,spf=576;while(i<bytes.length-4){const L=mp3FrameLen(bytes,i);if(!L){i++;continue}const ver=(bytes[i+1]>>3)&3;sr=[[11025,12000,8000],null,[22050,24000,16000],[44100,48000,32000]][ver][(bytes[i+2]>>2)&3];spf=ver===3?1152:576;n++;i+=L}
  return n*spf/sr;
}
const b64bytes=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};

/* ----- what to read for an item ----- */
function carItemInfo(k){
  const [kind,id]=[k.slice(0,1),k.slice(2)];
  if(kind==='t'){const t=byId(S.topics,id);if(!t)return null;return{k,kind,title:t.title,sub:t.chapterId?'Revision sheet · '+chapterName(t.chapterId):(t.subject||''),html:t.html||'',lead:t.title}}
  if(kind==='a'){const a=byId(S.answers,id);if(!a)return null;const q=byId(S.questions,a.qid);if(!q)return null;
    return{k,kind,title:q.text,sub:(a.kind==='ai'?'Model answer':'My answer')+(q.chapter?' · '+chapterName(q.chapter):''),html:a.html||'',lead:'Question. '+q.text}}
  return null;
}
function carBlocks(info){
  const d=document.createElement('div');d.innerHTML=info.html;
  d.querySelectorAll('svg,script,style,.tg,figure svg').forEach(n=>n.remove());
  blockifyRoot(d);
  const els=[...d.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote,figcaption,td,th,div')].filter(el=>!(/^(DIV|BLOCKQUOTE)$/.test(el.tagName)&&el.querySelector('p,li,h1,h2,h3,h4,h5,h6,td,th,div,ul,ol,table,blockquote'))&&(S.settings.readTables||!el.closest('table')));
  const out=[{text:info.lead,head:true}];
  els.forEach(el=>{
    const tx=TTS.textMap(el).text.replace(/\s+/g,' ').trim();
    if(tx)out.push({text:tx,head:/^H[1-6]$/.test(el.tagName)});
  });
  return out;
}
const xmlEsc=s=>s.replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
function carRequests(blocks){
  const reqs=[];let cur={parts:[],marks:[],size:0};
  const flush=()=>{if(cur.parts.length)reqs.push(cur);cur={parts:[],marks:[],size:0}};
  blocks.forEach(b=>{
    const spoken=TTS.prep(b.text).spoken;
    const piece=xmlEsc(spoken)+`<break time="${b.head?650:420}ms"/>`;
    const bytes=new TextEncoder().encode(piece).length;
    if(cur.size+bytes>4300)flush();
    if(bytes>4300){   // very long block: split by sentences
      sentencesOf(spoken).forEach(sn=>{const p=xmlEsc(sn)+' ';const n=new TextEncoder().encode(p).length;if(cur.size+n>4300)flush();cur.parts.push(p);cur.marks.push({text:b.text,len:sn.length,head:b.head});cur.size+=n});
      cur.parts.push('<break time="420ms"/>');return;
    }
    cur.parts.push(piece);cur.marks.push({text:b.text,len:spoken.length,head:b.head});cur.size+=bytes;
  });
  flush();
  return reqs;
}
async function carMake(k,onStep,signal){
  const info=carItemInfo(k);if(!info)throw new Error('That item no longer exists.');
  const voice=CAR.voice();if(!voice)throw new Error('Choose a voice in More › Car audio first.');
  const blocks=carBlocks(info),reqs=carRequests(blocks);
  const sig=hash36(voice+'|'+blocks.map(b=>b.text).join('\n'));
  const parts=[],marks=[];let t0=0,chars=0;
  for(let i=0;i<reqs.length;i++){
    if(signal&&signal.stop)throw new Error('stopped');
    const r=reqs[i],ssml='<speak>'+r.parts.join('')+'</speak>';
    let j;
    try{j=await CAR.api('text:synthesize',{input:{ssml},voice:{languageCode:'en-IN',name:voice},audioConfig:{audioEncoding:'MP3',sampleRateHertz:24000}})}
    catch(e){
      if(!/SSML|ssml/.test(e.message))throw e;
      j=await CAR.api('text:synthesize',{input:{text:r.parts.join(' ').replace(/<break[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'")},voice:{languageCode:'en-IN',name:voice},audioConfig:{audioEncoding:'MP3',sampleRateHertz:24000}});
    }
    chars+=ssml.length;
    const bytes=mp3Clean(b64bytes(j.audioContent));const dur=await mp3Duration(bytes);
    const tot=r.marks.reduce((a,m)=>a+m.len,0)||1;let acc=0;
    r.marks.forEach(m=>{marks.push({t:t0+dur*acc/tot,text:m.text,head:m.head});acc+=m.len});
    parts.push(bytes);t0+=dur;
    if(onStep)onStep(i+1,reqs.length);
  }
  CAR.addUsage(chars);
  const rec={id:k,sig,voice,blob:new Blob(parts,{type:'audio/mpeg'}),dur:t0,marks,title:info.title,made:Date.now()};
  await DB.put('audio',rec);
  return rec;
}
function carSig(k){const info=carItemInfo(k);return info?hash36(CAR.voice()+'|'+carBlocks(info).map(b=>b.text).join('\n')):''}
async function carRecord(k){if(DB.mem)return null;try{return await DB.tx('audio','readonly',s=>s.get(k))}catch(e){return null}}
function carCharsFor(k){const info=carItemInfo(k);if(!info)return 0;return carRequests(carBlocks(info)).reduce((a,r)=>a+r.parts.join('').length+15,0)}
function addToCar(keys){
  const l=CAR.list(),have=new Set(l.map(x=>x.k));let n=0;
  keys.forEach(k=>{if(!have.has(k)&&carItemInfo(k)){l.push({k});have.add(k);n++}});
  CAR.saveList(l);toast(n?`Added ${n} to Car audio`:'Already in Car audio');return n;
}

/* ----- the player: one <audio> playing the whole playlist ----- */
const CARP={el:null,url:'',bounds:[],items:[],marks:[],title:'',
  audio(){
    if(this.el)return this.el;
    const a=document.createElement('audio');a.id='carAudio';a.preload='auto';document.body.appendChild(a);this.el=a;
    a.addEventListener('timeupdate',()=>this.tick());
    a.addEventListener('play',()=>{this.media();this.ui()});a.addEventListener('pause',()=>{this.ui();this.savePos()});
    a.addEventListener('ended',()=>{this.ui();try{localStorage.removeItem('sl_carpos')}catch(e){}});
    a.addEventListener('ratechange',()=>this.ui());

  },
  async load(recs){

  },
  cur(){const t=this.el?this.el.currentTime:0;let i=0;while(i+1<this.bounds.length&&this.bounds[i+1]<=t+0.05)i++;return i},
  jumpItem(d){if(!this.el||!this.items.length)return;const i=this.cur(),t=this.el.currentTime;
    let n=d<0&&t-this.bounds[i]>4?i:i+d;n=Math.max(0,Math.min(this.items.length-1,n));this.el.currentTime=this.bounds[n]+0.01;this.ui()},
  seek(s){if(!this.el)return;this.el.currentTime=Math.max(0,Math.min((this.total||this.el.duration||0)-0.5,this.el.currentTime+s));this.ui()},
  toggle(){if(!this.el||!this.items.length)return;if(this.el.paused){if(TTS.root)TTS.stop(true);this.el.play().catch(()=>toast('Tap play again to start audio'))}else this.el.pause()},
  savePos(){try{if(this.el&&this.items.length)localStorage.setItem('sl_carpos',JSON.stringify({sig:this.items.map(r=>r.id+':'+r.sig).join('|'),t:this.el.currentTime}))}catch(e){}},
  media(){
    if(!('mediaSession' in navigator))return;
    const ms=navigator.mediaSession,h=(n,f)=>{try{ms.setActionHandler(n,f)}catch(e){}};
    h('play',()=>this.toggle());h('pause',()=>this.toggle());
    h('previoustrack',()=>this.jumpItem(-1));h('nexttrack',()=>this.jumpItem(1));
    h('seekbackward',d=>this.seek(-((d&&d.seekOffset)||15)));h('seekforward',d=>this.seek((d&&d.seekOffset)||15));
    h('seekto',d=>{if(this.el&&d&&d.seekTime!=null){this.el.currentTime=d.seekTime;this.ui()}});
    h('stop',()=>{if(this.el)this.el.pause()});
  },
  tick(){
    const now=Date.now();if(now-(this._lt||0)<400)return;this._lt=now;
    this.ui();if(now-(this._ls||0)>5000){this._ls=now;this.savePos()}
  },
  ui(){
    const a=this.el;if(!a)return;
    const i=this.cur(),it=this.items[i];
    if('mediaSession' in navigator&&it){
      if(this._mi!==i){this._mi=i;try{navigator.mediaSession.metadata=new MediaMetadata({title:it.title.slice(0,120),artist:'Study Library · '+(i+1)+' of '+this.items.length,album:'Car audio'})}catch(e){}}
      try{navigator.mediaSession.playbackState=a.paused?'paused':'playing';if(this.total)navigator.mediaSession.setPositionState({duration:this.total,playbackRate:a.playbackRate,position:Math.min(a.currentTime,this.total)})}catch(e){}
    }
    const v=$('#carNow');if(!v)return;

async function carReload(){

  await CARP.load(recs);
  let pos=0;try{const p=JSON.parse(localStorage.getItem('sl_carpos')||'null');if(p&&p.sig===sig)pos=p.t}catch(e){}

async function carMakeMissing(keys){
  if(!CAR.key()||!CAR.voice()){carSettings();return}
  if(CARJOB){toast('Already making audio');return}
  const l=keys||CAR.list().map(x=>x.k),todo=[];
  for(const k of l){const r=await carRecord(k);if(!r||r.sig!==carSig(k))todo.push(k)}
  if(!todo.length){toast('All audio is ready');return}
  const chars=todo.reduce((a,k)=>a+carCharsFor(k),0),u=CAR.usage(),free=CAR.freeOf(CAR.voice());
  if(u.n+chars>free*0.9&&!await confirmBox(`This needs about ${Math.round(chars/1000)}k characters. You have used ${Math.round(u.n/1000)}k of the free ${free/1e6} million this month (as counted on this device), so Google may charge for the rest. Continue?`,'Continue',false))return;
  CARJOB={stop:false};const msg=()=>$('#carMsg');
  const b=$('#carMakeAll');if(b){b.textContent='Stop';b.onclick=()=>{CARJOB.stop=true}}
