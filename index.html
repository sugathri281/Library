<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Library</title>
<meta name="theme-color" content="#1D4E6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#16232B; --muted:#56666E; --line:#D3DCD8;
  --brand:#1D4E6B; --brand-ink:#FFFFFF; --brand-soft:#DCEAF2; --danger:#B3261E;
  --hl-d:#CFE3FF; --hl-f:#CDEFD3; --hl-e:#FFE0BA; --hl-w:#FFD0CF; --hl-k:#FFF1A8;
  --b0:#1D4E6B; --b1:#7A3E9D; --b2:#B45309; --b3:#0F766E; --b4:#B0245B; --b5:#4D6B12; --b6:#3B4CCA; --b7:#8A5A00;
  --ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --read-font:var(--serif); --read-size:18px; --read-lh:1.7;
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --surface:#16222A; --surface2:#1B2A33; --ink:#E6EEF2; --muted:#9DB0BA; --line:#2A3A44;
    --brand:#6CB4D9; --brand-ink:#08222F; --brand-soft:#1D3542; --danger:#F2B8B5;
    --hl-d:#25467A; --hl-f:#22563A; --hl-e:#75501A; --hl-w:#7A2B2B; --hl-k:#6B6118;
    --b0:#6CB4D9; --b1:#C79BE0; --b2:#F0A75B; --b3:#5CD0C4; --b4:#F08DB4; --b5:#B4D66B; --b6:#9DA8FF; --b7:#E5BC5B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#16222A; --surface2:#1B2A33; --ink:#E6EEF2; --muted:#9DB0BA; --line:#2A3A44;
  --brand:#6CB4D9; --brand-ink:#08222F; --brand-soft:#1D3542; --danger:#F2B8B5;
  --hl-d:#25467A; --hl-f:#22563A; --hl-e:#75501A; --hl-w:#7A2B2B; --hl-k:#6B6118;
  --b0:#6CB4D9; --b1:#C79BE0; --b2:#F0A75B; --b3:#5CD0C4; --b4:#F08DB4; --b5:#B4D66B; --b6:#9DA8FF; --b7:#E5BC5B;
}
:root[data-theme="sepia"]{
  --bg:#F1E8D4; --surface:#FBF5E6; --surface2:#F6EED9; --ink:#33291B; --muted:#6E5F47; --line:#DDCFB0;
  --brand:#5B3A1E; --brand-ink:#FFFFFF; --brand-soft:#EBDCBC;
}
:root[data-theme="ocean"]{--bg:#E4EFF8; --surface:#F5FAFE; --surface2:#EAF3FA; --ink:#12263A; --muted:#4A6377; --line:#C3D8E8; --brand:#0B5C8E; --brand-ink:#FFFFFF; --brand-soft:#D0E5F4}
:root[data-theme="mint"]{--bg:#E5F2EA; --surface:#F6FBF8; --surface2:#EBF6EF; --ink:#14291E; --muted:#4D6A59; --line:#C3DCCD; --brand:#1F6B45; --brand-ink:#FFFFFF; --brand-soft:#D1EAD9}
:root[data-theme="lavender"]{--bg:#ECE8F6; --surface:#F9F7FD; --surface2:#F1EEF9; --ink:#231C3A; --muted:#605677; --line:#D3CCE7; --brand:#5B3FA0; --brand-ink:#FFFFFF; --brand-soft:#E0D8F2}
:root[data-theme="rose"]{--bg:#F8E9EC; --surface:#FFF8F9; --surface2:#FBEFF1; --ink:#3A1A22; --muted:#7A5460; --line:#EACBD2; --brand:#A3324A; --brand-ink:#FFFFFF; --brand-soft:#F4D8DE}
:root[data-theme="sepia"],:root[data-theme="ocean"],:root[data-theme="mint"],:root[data-theme="lavender"],:root[data-theme="rose"]{
  --danger:#B3261E; --hl-d:#CFE3FF; --hl-f:#CDEFD3; --hl-e:#FFE0BA; --hl-w:#FFD0CF; --hl-k:#FFF1A8;
  --b0:#1D4E6B; --b1:#7A3E9D; --b2:#B45309; --b3:#0F766E; --b4:#B0245B; --b5:#4D6B12; --b6:#3B4CCA; --b7:#8A5A00;
  color-scheme:light;
}
:root[data-theme="slate"]{--bg:#1A2230; --surface:#222C3D; --surface2:#2A3548; --ink:#E4EAF3; --muted:#A2B0C4; --line:#36445A; --brand:#7FB2F0; --brand-ink:#0B1B33; --brand-soft:#25395A}
:root[data-theme="forest"]{--bg:#0F1A14; --surface:#16241C; --surface2:#1C2D23; --ink:#E3EFE7; --muted:#9BB5A4; --line:#2B4034; --brand:#6FD29A; --brand-ink:#06200F; --brand-soft:#1F3D2D}
:root[data-theme="plum"]{--bg:#1A1222; --surface:#241A30; --surface2:#2D2139; --ink:#EDE6F5; --muted:#B09FC4; --line:#3F3050; --brand:#C79BF0; --brand-ink:#1E0B33; --brand-soft:#3A2A52}
:root[data-theme="midnight"]{--bg:#000000; --surface:#0B0B0D; --surface2:#141418; --ink:#EDEDED; --muted:#9A9AA3; --line:#26262C; --brand:#8AC4F2; --brand-ink:#04121F; --brand-soft:#14283A}
:root[data-theme="dark"],:root[data-theme="slate"],:root[data-theme="forest"],:root[data-theme="plum"],:root[data-theme="midnight"]{
  --danger:#F2B8B5; --hl-d:#25467A; --hl-f:#22563A; --hl-e:#75501A; --hl-w:#7A2B2B; --hl-k:#6B6118;
  --b0:#6CB4D9; --b1:#C79BE0; --b2:#F0A75B; --b3:#5CD0C4; --b4:#F08DB4; --b5:#B4D66B; --b6:#9DA8FF; --b7:#E5BC5B;
  color-scheme:dark;
}
.modal #asr,.modal #app,.modal #aps,#asr,#app,#aps{width:100%}
.ck{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-start;margin-top:10px}
.ck input{flex:none;width:20px;height:20px;margin:2px 0 0}
.thmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:6px 0 4px}
.thm{position:relative;border:2px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;font:700 12.5px var(--ui);cursor:pointer;min-height:64px}
.thm[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.thm b{display:block;font:700 19px var(--serif);line-height:1.1}
.thm i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0}
.swrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.swb{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.swb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.f{fill:currentColor;stroke:none}

/* shell */
#app{display:flex;min-height:100vh}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:12px;border-top:3px solid transparent}
nav#nav a[aria-current="page"]{color:var(--brand);border-top-color:var(--brand);font-weight:700}
main#view{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + 90px);max-width:980px;margin:0 auto;width:100%}
@media (min-width:900px){
  nav#nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 10px 16px}
  nav#nav a{flex:none;flex-direction:row;gap:12px;padding:11px 12px;border-top:0;border-left:3px solid transparent;border-radius:8px;font-size:15px}
  nav#nav a[aria-current="page"]{border-left-color:var(--brand);background:var(--brand-soft)}
  main#view{margin:0 0 0 200px;width:auto;max-width:1000px;padding:28px 32px 120px}
  #app{display:block}
}
h1.pg{font:600 26px/1.2 var(--serif);margin:4px 0 4px}
p.sub{color:var(--muted);margin:0 0 16px}
h2.sec{font:700 17px/1.3 var(--ui);margin:26px 0 10px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
textarea{min-height:88px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;margin:0 4px 4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.tight{padding:12px 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* library */
.grp{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.grp h3{margin:0;font:700 16px var(--ui);color:var(--brand)}
.grp .u{font-weight:400;color:var(--muted);font-size:14px}
.trow{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:0 0 8px}
.trow:hover{border-color:var(--brand)}
.trow .t{font-weight:700}
.trow .m{display:flex;gap:10px;align-items:center;margin-top:6px}
.trow .bar{flex:0 0 90px}
.snip{color:var(--muted);font-size:14px;margin-top:3px}
.snip b{background:var(--hl-k);color:inherit;padding:0 1px;border-radius:2px}

/* topic header + tabs */
.thead{margin-bottom:8px}
.thead h1{font:600 25px/1.25 var(--serif);margin:6px 0 4px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:10px 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* glance */
.sumcard{border-left:5px solid var(--brand);background:var(--surface);border-radius:0 14px 14px 0;padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sumcard p{margin:0;font:400 17px/1.6 var(--serif);white-space:pre-wrap}
.branches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.br{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 12px 12px 0;padding:12px 14px}
.br h4{margin:0 0 8px;font:600 17px/1.3 var(--serif);color:var(--c);cursor:pointer}
.br .lv{display:flex;flex-wrap:wrap;gap:6px}
.lf{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:14px;cursor:pointer;text-align:left}
.recall .lf{filter:blur(6px);transition:filter .15s}
.recall .lf.shown{filter:none}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:14px}
.mapwrap svg{display:block;min-width:820px;width:100%;height:auto}
.mapwrap text{font-family:var(--ui);fill:var(--ink)}
.mapwrap .cn text{fill:var(--brand-ink)}
.mapwrap g[data-go]{cursor:pointer}

/* reader */
.reader{font-family:var(--read-font);font-size:var(--read-size);line-height:var(--read-lh);max-width:44em;margin:0 auto;color:var(--read-ink,var(--ink))}
.reader.qs{outline:none;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface)}
.reader.qs:empty:before,.reader.qs[data-ph]:before{content:attr(data-ph);color:var(--muted)}
.reader.qs table{border-collapse:collapse;max-width:100%}
.reader.qs td,.reader.qs th{border:1px solid var(--line);padding:6px 10px}
.reader.qs img{max-width:100%;border-radius:6px}
.qstoolbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qstoolbar .sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.qstoolbar .sw.tx{background:#fff;color:#111;font:700 13px var(--ui);line-height:24px}
.reader h1,.reader h2,.reader h3,.reader h4{font-family:var(--head-font,var(--serif));line-height:1.3;color:var(--brand);position:relative;margin:1.6em 0 .5em;padding-right:34px}
.reader h1{font-size:1.5em}
.reader h2{font-size:1.3em;border-bottom:1px solid var(--line);padding-bottom:4px}
.reader h3{font-size:1.13em}
.reader h4,.reader h5,.reader h6{font-size:1em}
.reader p,.reader li{margin:.55em 0}
.reader p.sp{margin:.15em 0;min-height:1.1em}
.reader ul,.reader ol{padding-left:1.4em}
.reader table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:1em 0}
.reader td,.reader th{border:1px solid var(--line);padding:6px 10px;min-width:70px;vertical-align:top}
.reader th{background:var(--surface2)}
.reader img{max-width:100%;height:auto}
.reader blockquote{margin:1em 0;padding:2px 14px;border-left:4px solid var(--line);color:var(--muted)}
.reader pre{overflow:auto;background:var(--surface2);padding:10px;border-radius:8px;font-size:.85em}
.reader .hid{display:none}
.reader .tg{position:absolute;right:0;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:6px}
.reader h2 .tg{top:calc(50% - 2px)}
.reader h1.col .tg svg,.reader h2.col .tg svg,.reader h3.col .tg svg,.reader h4.col .tg svg{transform:rotate(-90deg)}
.reader.editing{outline:2px dashed var(--brand);outline-offset:8px;min-height:200px;padding:6px}
mark.hl{background:var(--hl-k);color:inherit;padding:0 2px;border-radius:3px;text-decoration-thickness:2px;text-underline-offset:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl-d{background:var(--hl-d);text-decoration-line:underline;text-decoration-style:solid}
mark.hl-f{background:var(--hl-f);text-decoration-line:underline;text-decoration-style:dotted}
mark.hl-e{background:var(--hl-e);text-decoration-line:underline;text-decoration-style:dashed}
mark.hl-w{background:var(--hl-w);text-decoration-line:underline;text-decoration-style:wavy}
mark.hl-k{background:var(--hl-k);text-decoration-line:underline;text-decoration-style:double}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend mark{font:400 13px var(--ui);padding:2px 8px}
.speaking{background:var(--brand-soft);border-radius:6px}
::highlight(tts-sent){background:var(--brand-soft);color:inherit}
::highlight(tts-word){background:var(--brand);color:var(--brand-ink)}
.hlonly h4{margin:16px 0 6px;font:700 15px var(--ui)}
.hlonly ul{margin:0;padding-left:1.2em}
.hlonly li{margin:6px 0}
.hlonly .from{color:var(--muted);font:13px var(--ui)}

/* floating bars */
#hlbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:none;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#hlbar.show{display:flex}
#hlbar button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);color:var(--ink);font-weight:700}
#hlbar button[data-c="d"]{background:var(--hl-d)}#hlbar button[data-c="f"]{background:var(--hl-f)}#hlbar button[data-c="e"]{background:var(--hl-e)}#hlbar button[data-c="w"]{background:var(--hl-w)}#hlbar button[data-c="k"]{background:var(--hl-k)}
#hlbar button[data-c="x"]{background:var(--surface)}
#player{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border-top:1px solid var(--line);display:none;align-items:center;gap:6px;padding:6px 10px}
#player.show{display:flex;flex-direction:column;align-items:stretch;gap:2px}
#player .prow{display:flex;align-items:center;gap:6px;min-width:0}
#player .prow.ctl{justify-content:center;gap:4px;padding-top:2px}
#player .prow:not(.ctl) button{min-width:38px;height:38px}
#player .skip{border-radius:22px;min-width:52px;padding:0 8px;gap:2px;font-size:12px}
#player .skip small{font:700 12px var(--ui)}
#player #pSecB,#player #pSecF{min-width:40px;font-size:18px}
#player #pPrev,#player #pNext{min-width:40px}
#player #pSeek{flex:1;min-width:0;margin:0}
#pPos{font-size:12px;color:var(--muted);min-width:58px;text-align:right}
#player .now b{color:var(--ink);font-weight:700}
body.has-player main#view{padding-bottom:calc(var(--nav-h) + 200px)}
#lfh{position:fixed;right:12px;z-index:27;display:none;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:9px 14px;font:700 14px var(--ui);box-shadow:0 4px 16px rgba(0,0,0,.28)}
#lfh.show{display:block}
.jumplist{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.jumplist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:15px}
.jumplist button.now{background:var(--brand-soft);font-weight:700}
.jumplist button .muted{display:inline-block;min-width:34px}
#player .now{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{min-width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#player button.play{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
@media (min-width:900px){#player{left:200px;bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}}
#rateBox{position:fixed;right:10px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 170px);z-index:26;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:min(320px,calc(100vw - 20px));box-shadow:0 6px 24px rgba(0,0,0,.2);display:none}
#rateBox.show{display:block}
#rateBox .rbrow{display:flex;align-items:center;gap:10px}
#rateBox .rbmid{flex:1;text-align:center}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const PATHS={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',

 bulb:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 00-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0012 3z"/>',
 pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 play:'<path d="M7 4l13 8-13 8z"/>', pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>',
 prev:'<path d="M6 4h2v16H6zM20 4v16L9 12z"/>', next:'<path d="M16 4h2v16h-2zM4 4l11 8L4 20z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>', check:'<path d="M5 12l5 5 9-10"/>', up:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
 chev:'<path d="M6 9l6 6 6-6"/>', sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
 down:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
 rew:'<path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/>', ff:'<path d="M5 6l6 6-6 6M13 6l6 6-6 6"/>', list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'
};
const FILLED=new Set(['play','pause','prev','next']);
const ic=(n,s=22)=>`<svg class="ic${FILLED.has(n)?' f':''}" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]||''}</svg>`;
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'never';
const dayDiff=(a,b)=>Math.round((a-b)/86400000);
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const strip=html=>{const d=document.createElement('div');d.innerHTML=String(html).replace(/<\/(?:p|li|h[1-6]|td|th|tr|blockquote|div)>|<br\s*\/?>/gi,m=>' '+m);return (d.textContent||'').replace(/\s+/g,' ').trim()};

/* ---------- state ---------- */
const DEFAULT_SET={ansHL:true,legacyDone:false,autoEx:true,syn:'',theme:'auto',accent:'',inkc:'',head:'',fs:18,lh:1.7,font:'serif',pauseP:450,pauseS:0,skipN:15,pron:'',spell:true,autoLang:true,examDate:'',rate:1,voice:'',summaryFirst:false,lastBackup:0,
  legend:{d:'Definition',f:'Fact / data',e:'Example / case study',w:'Warning / exception',k:'Answer keyword'}};
const S={topics:[],examples:[],questions:[],plans:[],links:[],answers:[],syllabus:[],settings:JSON.parse(JSON.stringify(DEFAULT_SET))};
const DATA_KEYS=['topics','examples','questions','plans','links','answers','syllabus'];
const STORES=[...DATA_KEYS,'meta','audio'];   // audio: device-only, never synced or backed up

/* ---------- storage (IndexedDB, local to this browser) ---------- */
const DB={db:null,mem:false,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('studylib',3);
        r.onupgradeneeded=()=>{STORES.forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})})};
        r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();try{toast('Study Library was updated in another tab. Reloading…',3000)}catch(e){}setTimeout(()=>location.reload(),1200)};res(db)};
        r.onerror=()=>rej(r.error);
        r.onblocked=()=>{try{toast('Finishing an update: please close other Study Library tabs or windows.',8000)}catch(e){}};   // keep waiting; the upgrade continues once they close
      });
    }catch(e){this.mem=true;}
  },
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  async all(store){if(this.mem)return[];return this.tx(store,'readonly',s=>s.getAll());},
  async put(store,obj){if(this.mem)return;try{await this.tx(store,'readwrite',s=>s.put(obj));if(!(store==='meta'&&obj&&obj.id==='sync')&&typeof pokeSync==='function')pokeSync();if(store==='topics'&&typeof NLP!=='undefined')NLP.dirty();}catch(e){toast('Could not save. Storage may be full or blocked.',4000);}},
  async putMany(store,arr){if(this.mem||!arr||!arr.length)return;try{await this.tx(store,'readwrite',s=>{arr.forEach(o=>s.put(o))});if(typeof pokeSync==='function')pokeSync();if(store==='topics'&&typeof NLP!=='undefined')NLP.dirty()}catch(e){toast('Could not save. Storage may be full.',4000)}},
  async del(store,id){if(this.mem)return;await this.tx(store,'readwrite',s=>s.delete(id));},
  async clear(store){if(this.mem)return;await this.tx(store,'readwrite',s=>s.clear());}
};
async function loadAll(){
  await DB.open();
  for(const k of DATA_KEYS)S[k]=(await DB.all(k)).filter(x=>!x.deleted);
  const meta=await DB.all('meta');
  const st=meta.find(m=>m.id==='settings');
  if(st)S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SET)),st.v,{legend:Object.assign({},DEFAULT_SET.legend,(st.v||{}).legend)});

  if(!SVG_TAGS.has(name))return null;
  const real={lineargradient:'linearGradient',radialgradient:'radialGradient',clippath:'clipPath'}[name]||name;
  const el=document.createElementNS(SVG_NS,real);

    if(n==='id'){if(/^[\w-]{1,60}$/.test(v))el.setAttribute('id',v.startsWith(idp)?v:idp+v);continue}
    if(n==='style'){const s=svgStyle(v);if(s)el.setAttribute('style',s);continue}
    if(!SVG_ATTR.test(n)||v.length>4000)continue;
    if(/javascript:|expression\(|<|>/i.test(v))continue;
    if(/url\(/i.test(v)){if(!/^url\(\s*['"]?#[\w-]+['"]?\s*\)$/i.test(v.trim()))continue;v=v.replace(/#([\w-]+)/,(m,id)=>'#'+(id.startsWith(idp)?id:idp+id))}

    el.setAttribute(fixed,v);
  }
  for(const c of [...src.childNodes]){
    if(c.nodeType===3){el.appendChild(document.createTextNode(c.data));continue}
    if(c.nodeType!==1)continue;
    const k=svgClean(c,idp);if(k)el.appendChild(k);

  if(name==='svg'){
    el.removeAttribute('x');el.removeAttribute('y');
    if(!el.getAttribute('id'))el.setAttribute('id',idp+'root');
    if(!el.getAttribute('viewBox')){const w=parseFloat(src.getAttribute('width')),h=parseFloat(src.getAttribute('height'));if(w&&h)el.setAttribute('viewBox',`0 0 ${w} ${h}`)}
    el.setAttribute('style',(el.getAttribute('style')?el.getAttribute('style')+';':'')+'max-width:100%;height:auto');
    if(el.getAttribute('viewBox'))el.removeAttribute('height');
    el.setAttribute('width',el.getAttribute('viewBox')?(el.getAttribute('viewBox').split(/[\s,]+/)[2]||'100%'):'100%');

}
function svgStyle(str){
  const out=[];
  for(const decl of String(str).split(';')){
    const ix=decl.indexOf(':');if(ix<1)continue;
    const p=decl.slice(0,ix).trim().toLowerCase(),v=decl.slice(ix+1).trim();
    if(!/^(fill|stroke|stroke-width|stroke-dasharray|stroke-linecap|stroke-linejoin|opacity|fill-opacity|stroke-opacity|font-size|font-weight|font-family|font-style|text-anchor|dominant-baseline|max-width|height|width|display)$/.test(p))continue;
    if(/url\(|expression|javascript|<|>/i.test(v)||v.length>200)continue;
    out.push(p+':'+v.replace(/"/g,"'"));
  }
  return out.join(';');
}

const CAPTURE_JS=`(function(){

 function tracks(v){var n=String(v).trim().split(/\\s+(?![^(]*\\))/).filter(Boolean).length;return n>0?'repeat('+n+',minmax(0,1fr))':''}

   var body=document.body,all=[].slice.call(body.querySelectorAll('*')),cs=new Map();

   var rm=[];
   all.forEach(function(e){
     var c=cs.get(e);if(!c)return;

       SVGP.forEach(function(p){var v=c.getPropertyValue(p);if(v&&!e.getAttribute(p)&&!(p==='opacity'&&v==='1'))e.setAttribute(p,v)});

       else if(p==='flex-direction'||p==='flex-wrap'||p==='justify-content'||p==='align-items'||p==='gap'){if(!/flex|grid/.test(c.display)||v==='normal'||v==='row'||v==='nowrap')return}

     else if(c.display==='block'&&/^(span|b|strong|em|i|a|small|mark|code|label|u|s|sup|sub|abbr|time|cite|q|big)$/.test(tag))st.push('display:block');
     else if(c.display==='inline'&&/^(div|p|h[1-6]|section|article|li|figure|header|footer)$/.test(tag))st.push('display:inline');

const STORAGE_SHIM=`try{window.localStorage.length}catch(e){(function(){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true});Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(e2){}})()}`;
function captureSheet(html,ms=9000){
  return new Promise(res=>{
    let src=String(html);
    const shim='<script>'+STORAGE_SHIM+'<\/script>',cap='<script>'+CAPTURE_JS+'<\/script>';
    src=/<head[^>]*>/i.test(src)?src.replace(/<head[^>]*>/i,m=>m+shim):shim+src;
    src=/<\/body>/i.test(src)?src.replace(/<\/body>(?![\s\S]*<\/body>)/i,cap+'</body>'):src+cap;
    const f=document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts');f.setAttribute('aria-hidden','true');f.tabIndex=-1;
    f.style.cssText='position:fixed;left:-12000px;top:0;width:420px;height:1400px;border:0;opacity:0;pointer-events:none';
    let tm;
    const done=v=>{clearTimeout(tm);window.removeEventListener('message',on);f.remove();res(v)};
    const on=e=>{if(e.source===f.contentWindow&&e.data&&'sheetCapture' in e.data)done(typeof e.data.sheetCapture==='string'?e.data.sheetCapture:null)};
    window.addEventListener('message',on);tm=setTimeout(()=>done(null),ms);
    f.srcdoc=src;document.body.appendChild(f);
  });
}

function sanitizeRich(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out=document.createElement('div');
  const idp='s'+Math.random().toString(36).slice(2,6)+'-';
  const walk=(node,parent)=>{
    for(const n of [...node.childNodes]){
      if(n.nodeType===3){parent.appendChild(document.createTextNode(n.data));continue}
      if(n.nodeType!==1)continue;
      let tag=n.tagName.toUpperCase();
      if(tag==='SVG'){const sv=svgClean(n,(n.getAttribute('id')||'').match(/^s[a-z0-9]{4}-/)?'':idp);if(sv)parent.appendChild(sv);continue}
      if(RICH_DROP.has(tag))continue;
      tag=RICH_TAGMAP[tag]||tag;
      if(tag==='FONT'){
        const e=document.createElement('span');let s=safeStyle(n.getAttribute('style')||'');
        const col=(n.getAttribute('color')||'').replace('#','');if(/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(col))s=(s?s+';':'')+'color:#'+col;
        if(s)e.setAttribute('style',s);
        parent.appendChild(e);walk(n,e);continue;
      }
      if(!RICH_ALLOW.has(tag)){walk(n,parent);continue}
      const el=document.createElement(tag.toLowerCase());
      const s=safeStyle(n.getAttribute('style')||'');if(s)el.setAttribute('style',s);
      const cls=(n.getAttribute('class')||'').split(/\s+/).filter(c=>/^hl-[dfewk]$/.test(c));if(cls.length)el.setAttribute('class','hl '+cls.join(' '));
      if(tag==='A'){const h=n.getAttribute('href')||'';if(/^(https?:|mailto:)/i.test(h)){el.setAttribute('href',h);el.setAttribute('target','_blank');el.setAttribute('rel','noopener')}}
      if(tag==='IMG'){const src=n.getAttribute('src')||'';if(!/^data:image\//i.test(src))continue;el.setAttribute('src',src);el.setAttribute('alt',n.getAttribute('alt')||'');if(s)el.setAttribute('style',s);parent.appendChild(el);continue}
      if(tag==='TD'||tag==='TH')['colspan','rowspan'].forEach(a=>{const v=parseInt(n.getAttribute(a),10);if(v>1&&v<50)el.setAttribute(a,v)});
      if(tag==='COL'){const v=parseInt(n.getAttribute('span'),10);if(v>1&&v<50)el.setAttribute('span',v)}
      parent.appendChild(el);
      walk(n,el);
    }
  };
  walk(doc.body||doc,out);
  $$('p,div,span,strong,em,u,s,mark,a,li,td,th,h1,h2,h3,h4,h5,h6',out).reverse().forEach(e=>{
    if(e.textContent.trim()||e.querySelector('img,table,svg'))return;
    if(!e.querySelector('br')&&!/^(TD|TH)$/.test(e.tagName)&&!e.getAttribute('style'))e.remove();
  });
  $$('table',out).forEach(tb=>{if(!tb.querySelector('tbody')&&!tb.querySelector('thead')){const b=document.createElement('tbody');[...tb.children].forEach(c=>b.appendChild(c));tb.appendChild(b)}});
  return out.innerHTML.replace(/\u00a0/g,' ');
}
function splitByHeading(html){
  const d=document.createElement('div');d.innerHTML=html;
  const kids=[...d.children];
  const cnt=l=>kids.filter(k=>k.tagName==='H'+l).length;
  const lvl=[1,2,3].find(l=>cnt(l)>=2);
  if(!lvl)return null;
  const parts=[];let cur=null;
  for(const k of kids){
    if(k.tagName==='H'+lvl){cur={title:k.textContent.replace(/\s+/g,' ').trim().slice(0,140)||'Untitled',html:k.outerHTML};parts.push(cur)}
    else if(cur)cur.html+=k.outerHTML;
    else{cur={title:/^H[1-6]$/.test(k.tagName)?(k.textContent.replace(/\s+/g,' ').trim().slice(0,140)||'Introduction'):'Introduction',html:k.outerHTML};parts.push(cur)}
  }
  return parts.filter(p=>strip(p.html).length>0);
}

async function docxToHtml(file){
  await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js']);
  const r=await window.mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()},{styleMap:['u => u','strike => s']});
  return sanitize(r.value);
}
async function pdfToHtml(file){
  const V='3.11.174';
  await loadScript([`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/pdf.min.js`]);
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/pdf.worker.min.js`;
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent();let cur=null;
    for(const it of tc.items){
      if(!it.str&&!it.hasEOL)continue;
      const y=Math.round(it.transform[5]),h=Math.round(it.height||Math.abs(it.transform[3])||10);
      if(cur&&Math.abs(cur.y-y)<=2){cur.t+=it.str;cur.h=Math.max(cur.h,h)}
      else{if(cur)lines.push(cur);cur={y,h,t:it.str}}
    }
    if(cur)lines.push(cur);lines.push({br:true});
  }
  const hs=lines.filter(l=>!l.br&&l.t.trim()).map(l=>l.h).sort((a,b)=>a-b);
  if(!hs.length)throw new Error('No selectable text found (scanned PDF). Run OCR first, then import again.');
  const med=hs[Math.floor(hs.length/2)];
  const out=[];let para=[],prevY=null;
  const flush=()=>{if(para.length){out.push('<p>'+esc(para.join(' ').replace(/\s+/g,' ').trim())+'</p>');para=[]}};
  for(const l of lines){
    if(l.br){flush();prevY=null;continue}
    const t=l.t.replace(/\s+/g,' ').trim();if(!t)continue;
    if(l.h>=med*1.18&&t.length<110){flush();out.push('<h2>'+esc(t)+'</h2>');prevY=null;continue}
    if(/^[•▪◦●\-–]\s+/.test(t)){flush();out.push('<li>'+esc(t.replace(/^[•▪◦●\-–]\s+/,''))+'</li>');prevY=l.y;continue}
    if(prevY!==null&&Math.abs(prevY-l.y)>l.h*2)flush();
    if(para.length&&/[a-z]-$/.test(para[para.length-1])){para[para.length-1]=para[para.length-1].slice(0,-1)+t}else para.push(t);
    prevY=l.y;
  }
  flush();
  return out.join('\n').replace(/((?:<li>.*?<\/li>\n?)+)/g,m=>'<ul>'+m+'</ul>');
}
async function snapshot(){
  if(!S.topics.length)return;
  try{await DB.put('meta',{id:'snapshot',at:Date.now(),data:JSON.stringify(exportAll())})}catch(e){}

async function importFiles(files,o){
  await snapshot();
  const made=[],failed=[];
  for(const f of files){
    try{
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      const base=f.name.replace(/\.[^.]+$/,'');
      let html;
      if(ext==='docx')html=await docxToHtml(f);
      else if(ext==='pdf')html=await pdfToHtml(f);
      else if(ext==='html'||ext==='htm')html=sanitize(await f.text());
      else if(ext==='md'||ext==='markdown')html=md2html(await f.text());
      else if(ext==='txt')html=md2html(await f.text(),{lines:true});
      else throw new Error('Unsupported file type');
      if(!strip(html))throw new Error('No text found');
      const parts=o.split?splitByHeading(html):null;
      (parts||[{title:base,html}]).forEach(p=>{
        const t={id:uid(),title:p.title,subject:o.subject||'General',unit:o.unit||'',tags:[...o.tags],html:p.html,qs:'',summary:'',
          created:Date.now(),updated:Date.now(),lastOpened:0,progress:0,exampleIds:[],source:f.name};
        S.topics.push(t);made.push(t);if(typeof scheduleAutoEx==='function')scheduleAutoEx(t);
      });
    }catch(e){failed.push(f.name+': '+(e.message||e))}
  }
  for(const t of made)await DB.put('topics',t);
  return{made,failed};
}

function html2md(html){
  const d=document.createElement('div');d.innerHTML=html;
  const kids=(n,ctx)=>[...n.childNodes].map(c=>node(c,ctx)).join('');
  const node=(n,ctx)=>{
    if(n.nodeType===3)return n.data.replace(/\s+/g,' ');
    if(n.nodeType!==1)return '';
    const t=n.tagName.toLowerCase(),inner=()=>kids(n,ctx);
    if(/^h[1-6]$/.test(t))return '\n\n'+'#'.repeat(+t[1])+' '+inner().trim()+'\n\n';
    switch(t){
      case 'p':return '\n\n'+inner().trim()+'\n\n';
      case 'br':return '  \n';
      case 'strong':return '**'+inner()+'**';
      case 'em':return '*'+inner()+'*';
      case 'u':return '<u>'+inner()+'</u>';
      case 's':return '~~'+inner()+'~~';
      case 'mark':return '=='+inner()+'==';
      case 'code':return '`'+n.textContent+'`';
      case 'pre':return '\n\n```\n'+n.textContent+'\n```\n\n';
      case 'a':return '['+inner()+']('+(n.getAttribute('href')||'')+')';
      case 'hr':return '\n\n---\n\n';
      case 'blockquote':return '\n\n'+inner().trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n';
      case 'img':return '![image]';
      case 'ul':case 'ol':{
        const dep=(ctx&&ctx.d)||0;let i=0;
        const items=[...n.children].filter(c=>c.tagName==='LI').map(li=>{i++;
          const own=[...li.childNodes].filter(c=>!/^(UL|OL)$/.test(c.tagName||'')).map(c=>node(c,{d:dep+1})).join('').replace(/\n+/g,' ').trim();
          const sub=[...li.children].filter(c=>/^(UL|OL)$/.test(c.tagName)).map(c=>node(c,{d:dep+1})).join('');
          return '  '.repeat(dep)+(t==='ol'?i+'. ':'- ')+own+(sub?'\n'+sub.replace(/^\n+|\n+$/g,''):'');
        });
        return (dep?'':'\n\n')+items.join('\n')+(dep?'':'\n\n');
      }
      case 'table':{
        const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>c.textContent.replace(/\s+/g,' ').trim().replace(/\|/g,'\\|')));
        if(!rows.length)return '';
        const w=Math.max(...rows.map(r=>r.length));const pad=r=>{while(r.length<w)r.push('');return '| '+r.join(' | ')+' |'};
        return '\n\n'+pad(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(pad).join('\n')+'\n\n';
      }
      default:return inner();
    }
  };
  return kids(d,null).replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

  await snapshot();
  const keys=DATA_KEYS;
  if(mode==='replace'){for(const k of keys){await DB.clear(k);S[k]=[]}}
  for(const k of keys){
    for(const item of (o[k]||[])){
      const cur=byId(S[k],item.id);

      const sTitle=sec.id?toks(sec.title).filter(x=>!x.stop&&x.w.length>1).map(x=>vid(x.s,x.w)):[];
      let buf=[],words=0,first=null;
      const flush=()=>{
        if(!buf.length)return;
        const text=buf.join(' '),cnt=new Map(),seq=[];
        for(const x of toks(text)){if(x.stop||x.w.length<2)continue;const id=vid(x.s,x.w);cnt.set(id,(cnt.get(id)||0)+1);if(!x.num)seq.push(id)}
        sTitle.forEach(id=>cnt.set(id,(cnt.get(id)||0)+2));tTitle.forEach(id=>cnt.set(id,(cnt.get(id)||0)+1));
        let len=0;for(const v of cnt.values())len+=v;
        const idx=chunks.length;
        chunks.push({ti,tid:t.id,sid:sec.id,ci:first.ci,hi:sec.hi,st:sec.title,text,ids:Int32Array.from(cnt.keys()),cs:Uint16Array.from(cnt.values()),len});
        seqs.push(Int32Array.from(seq));mine.push(idx);buf=[];words=0;first=null;
      };
      for(const u of sec.units){
        if(!first)first=u;buf.push(u.text);words+=u.text.split(/\s+/).length;
        if(words>=80)flush();
      }
      flush();
    }
    byTopic.set(t.id,mine);
    await tick('Indexing passages',ti,topics.length);
  }
  const nc=chunks.length,V=termList.length;
  if(!nc){NLP.idx={sig,stamp:++NLP.stamp,N:topics.length,nc:0,chunks,vocab,termList,surf,byTopic,cdf:new Map(),tv:new Map(),tcon:new Map(),acro:new Map(),ps:new Int32Array(1),ready:true};return}
  const df=new Int32Array(V);let tot=0;
  chunks.forEach(c=>{tot+=c.len;for(const id of c.ids)df[id]++});
  const avg=tot/nc,idf=new Float32Array(V);
  for(let i=0;i<V;i++)idf[i]=Math.log(1+(nc-df[i]+0.5)/(df[i]+0.5));
  const ps=new Int32Array(V+1);for(let i=0;i<V;i++)ps[i+1]=ps[i]+df[i];
  const pc=new Int32Array(ps[V]),pt=new Uint16Array(ps[V]),fill=new Int32Array(V);
  chunks.forEach((c,ci)=>{for(let k=0;k<c.ids.length;k++){const id=c.ids[k],p=ps[id]+fill[id]++;pc[p]=ci;pt[p]=c.cs[k]}});
  await tick('Learning word associations',0,1);
  /* random-indexing word vectors: words used in similar contexts get similar vectors */
  const D=160,NZ=8,W=4,big=nc>200;
  const rpos=new Int16Array(V*NZ),rsgn=new Int8Array(V*NZ);
  for(let id=0;id<V;id++){
    let seed=hash32(termList[id]);const rnd=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
    const used=new Set();let k=0;while(k<NZ){const p=Math.floor(rnd()*D);if(used.has(p))continue;used.add(p);rpos[id*NZ+k]=p;rsgn[id*NZ+k]=rnd()<0.5?-1:1;k++}
  }
  const tvec=new Float32Array(V*D);
  for(let ci=0;ci<nc;ci++){
    const seq=seqs[ci];
    for(let i=0;i<seq.length;i++){
      const a=seq[i];if(big&&df[a]<2)continue;const base=a*D;
      for(let j=Math.max(0,i-W);j<Math.min(seq.length,i+W+1);j++){
        if(j===i)continue;const c=seq[j];if(big&&df[c]<2)continue;const w=idf[c],cb=c*NZ;
        for(let k=0;k<NZ;k++)tvec[base+rpos[cb+k]]+=w*rsgn[cb+k];
      }
    }
    if(ci%200===0)await tick('Learning word associations',ci,nc);
  }
  const normRow=(arr,off)=>{let s=0;for(let k=0;k<D;k++)s+=arr[off+k]*arr[off+k];s=Math.sqrt(s)||1;for(let k=0;k<D;k++)arr[off+k]/=s;return s};
  const tmean=new Float32Array(D);let tn=0;
  for(let id=0;id<V;id++){normRow(tvec,id*D);if(df[id]>=2){for(let k=0;k<D;k++)tmean[k]+=tvec[id*D+k];tn++}}
  if(tn)for(let k=0;k<D;k++)tmean[k]/=tn;
  for(let id=0;id<V;id++){for(let k=0;k<D;k++)tvec[id*D+k]-=tmean[k];normRow(tvec,id*D)}
  const cvec=new Float32Array(nc*D),cmean=new Float32Array(D);
  for(let ci=0;ci<nc;ci++){
    const c=chunks[ci],off=ci*D;
    for(let k=0;k<c.ids.length;k++){const id=c.ids[k],w=(1+Math.log(c.cs[k]))*idf[id];for(let q=0;q<D;q++)cvec[off+q]+=w*tvec[id*D+q]}
    normRow(cvec,off);for(let q=0;q<D;q++)cmean[q]+=cvec[off+q]/nc;
  }
  for(let ci=0;ci<nc;ci++){for(let q=0;q<D;q++)cvec[ci*D+q]-=cmean[q];normRow(cvec,ci*D)}
  /* topic vectors */
  const tv=new Map(),tsum=[],tmn=new Float32Array(D);
  topics.forEach((t,ti)=>{const v=new Float32Array(D);for(const ci of byTopic.get(t.id)){const w=Math.sqrt(chunks[ci].len);for(let q=0;q<D;q++)v[q]+=w*cvec[ci*D+q]}normRow(v,0);tsum.push(v);for(let q=0;q<D;q++)tmn[q]+=v[q]/topics.length});
  topics.forEach((t,ti)=>{const v=tsum[ti];for(let q=0;q<D;q++)v[q]-=tmn[q];normRow(v,0);tv.set(t.id,v)});
  /* whole-note term vectors (TF-IDF at note level) */
  const NT=topics.length,ttf=topics.map(()=>new Map());
  topics.forEach((t,ti)=>{const m=ttf[ti];for(const ci of byTopic.get(t.id)){const c=chunks[ci];for(let k=0;k<c.ids.length;k++)m.set(c.ids[k],(m.get(c.ids[k])||0)+c.cs[k])}});
  const tdf=new Int32Array(V);ttf.forEach(m=>{for(const id of m.keys())tdf[id]++});
  const tt=new Map(),tdocs=new Map();
  topics.forEach((t,ti)=>{
    const w=new Map();let n=0;
    for(const [id,tf] of ttf[ti]){
      if(NT>=8&&tdf[id]>NT*0.7)continue;
      const x=(1+Math.log(tf))*Math.log(1+NT/tdf[id]);w.set(id,x);n+=x*x;
      if(tdf[id]>=2){let a=tdocs.get(id);if(!a){a=[];tdocs.set(id,a)}a.push(ti)}
    }
    n=Math.sqrt(n)||1;for(const [id,x] of w)w.set(id,x/n);tt.set(t.id,w);
  });
  /* concept document-frequency and acronyms */
  const cdf=new Map(),acro=new Map();
  As.forEach(A=>{for(const o of A.cand.values())if(o.count>=2||o.heads||o.emph||o.acr)cdf.set(o.key,(cdf.get(o.key)||0)+1);
    for(const a of A.acro){const st=toks(a.full).filter(x=>!x.stop).map(x=>x.s);if(st.length)acro.set(stem(a.ac),st)}});
  for(const [k,v] of Object.entries(ACRO_BUILTIN)){const s=stem(k);if(!acro.has(s))acro.set(s,toks(v).filter(x=>!x.stop).map(x=>x.s))}
  const ix={sig,stamp:++NLP.stamp,N:topics.length,nc,V,D,chunks,vocab,termList,surf,byTopic,df,idf,avg,ps,pc,pt,tvec,cvec,cmean,tmean,tv,tt,tdf,tdocs,topics,tcon:new Map(),cdf,acro,topicIndex:new Map(topics.map((t,i)=>[t.id,i]))};
  for(let i=0;i<topics.length;i++){ix.tcon.set(topics[i].id,conceptsOf(As[i],30,ix));if(i%25===0)await tick('Finding key concepts',i,topics.length)}
  NLP.idx=ix;NLP.vcache.clear();
}
const dotv=(a,ao,b,bo,D)=>{let s=0;for(let k=0;k<D;k++)s+=a[ao+k]*b[bo+k];return s};

/* ---- search ---- */
function queryModel(ix,q){
  const all=toks(q),long=all.length>=7,terms=new Map(),note=[];
  const add=(s,w,src)=>{if(!ix.vocab.has(s))return;const o=terms.get(s);if(!o||o.w<w)terms.set(s,{w,src})};
  const qs=all.filter(t=>!t.stop&&t.w.length>=2&&!(long&&QSTOP.has(t.w)));
  for(const t of qs)add(t.s,1,'q');
  const qset=new Set(qs.map(t=>t.s)),syn=synMap();
  for(const s of [...qset]){const g=syn.get(s);if(g)for(const b of g)add(b,0.5,'syn');const r=RELMAP.get(s);if(r)for(const b of r)if(!qset.has(b))add(b,0.28,'rel')}
  for(const [ac,full] of ix.acro){
    if(qset.has(ac))full.forEach(s=>add(s,0.45,'syn'));
    else if(full.length>1&&full.every(s=>qset.has(s)))add(ac,0.8,'syn');
  }
  const last=all[all.length-1];
  if(last&&!last.stop&&last.w.length>=3&&/\S$/.test(q)&&(!ix.vocab.has(last.s)||ix.df[ix.vocab.get(last.s)]<2)){
    const cands=[];for(let i=0;i<ix.V;i++)if(ix.termList[i].startsWith(last.w))cands.push(i);
    cands.sort((a,b)=>ix.df[b]-ix.df[a]).slice(0,5).forEach(i=>add(ix.termList[i],0.7,'pre'));
  }
  return{terms,qset,long};
}
function queryVec(ix,terms){
  const D=ix.D,v=new Float32Array(D);let any=false;
  for(const [s,o] of terms){if(o.src!=='q')continue;const id=ix.vocab.get(s);const w=ix.idf[id];for(let k=0;k<D;k++)v[k]+=w*ix.tvec[id*D+k];any=true}
  if(!any)return null;
  let n=0;for(let k=0;k<D;k++)n+=v[k]*v[k];n=Math.sqrt(n)||1;for(let k=0;k<D;k++)v[k]=v[k]/n-ix.cmean[k];
  n=0;for(let k=0;k<D;k++)n+=v[k]*v[k];n=Math.sqrt(n)||1;for(let k=0;k<D;k++)v[k]/=n;
  return v;
}
function snippetFor(ix,chunk,terms){
  const sents=sentencesOf(chunk.text);let best=sents[0]||chunk.text,bs=-1;
  for(const s of sents){let sc=0;for(const t of toks(s))if(terms.has(t.s))sc+=terms.get(t.s).w;if(sc>bs){bs=sc;best=s}}
  let txt=best;if(txt.length>230){const t0=toks(txt).find(t=>terms.has(t.s));const at=t0?t0.i:0;const a=Math.max(0,at-90);txt=(a>0?'…':'')+txt.slice(a,a+230)+'…'}
  let out='',pos=0;
  for(const t of toks(txt)){const o=terms.get(t.s);if(o){out+=esc(txt.slice(pos,t.i))+(o.src==='q'?'<b>':'<b class="r">')+esc(txt.slice(t.i,t.e))+'</b>';pos=t.e}}
  return out+esc(txt.slice(pos));
}
NLP.search=function(q,opts={}){
  const ix=NLP.idx;if(!ix||!q||!q.trim()||!ix.nc)return ix&&q&&q.trim()?{topics:[],examples:[],related:[],terms:[],stats:{topics:0,passages:0}}:null;
  const {terms,qset,long}=queryModel(ix,q.trim());
  const nc=ix.nc,D=ix.D,K1=1.2,B=0.75,lex=new Float32Array(nc);
  for(const [s,o] of terms){
    const id=ix.vocab.get(s),idf=ix.idf[id];
    for(let k=ix.ps[id];k<ix.ps[id+1];k++){const c=ix.pc[k],tf=ix.pt[k];lex[c]+=o.w*idf*(tf*(K1+1))/(tf+K1*(1-B+B*ix.chunks[c].len/ix.avg))}
  }
  const vq=queryVec(ix,terms),sem=vq?new Float32Array(nc):null;
  let maxLex=0;for(let c=0;c<nc;c++)if(lex[c]>maxLex)maxLex=lex[c];
  const cand=new Map();
  const lexTop=[];for(let c=0;c<nc;c++)if(lex[c]>0)lexTop.push(c);
  lexTop.sort((a,b)=>lex[b]-lex[a]);lexTop.slice(0,80).forEach(c=>cand.set(c,1));
  if(vq){
    const st=[];for(let c=0;c<nc;c++){sem[c]=dotv(vq,0,ix.cvec,c*D,D);st.push(c)}
    st.sort((a,b)=>sem[b]-sem[a]);let n=0;for(const c of st){if(n>=10)break;if(sem[c]<0.3)break;if(!cand.has(c)&&lex[c]===0){cand.set(c,2);n++}}
  }
  const phrase=(q.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim());
  const hits=[];
  for(const [c,kind] of cand){
    const lN=maxLex?lex[c]/maxLex:0,sN=sem?Math.max(0,Math.min(1,sem[c]/0.6)):0;
    if(kind===2&&sN<0.5)continue;
    let f=0.72*lN+0.28*sN;
    if(phrase.includes(' ')&&ix.chunks[c].text.toLowerCase().includes(phrase))f*=1.25;
    if(f<0.08)continue;
    hits.push({c,f,via:lex[c]===0?'related':''});
  }
  hits.sort((a,b)=>b.f-a.f);
  const groups=new Map();
  for(const h of hits.slice(0,70)){
    const ch=ix.chunks[h.c],t=byId(S.topics,ch.tid);if(!t)continue;
    if(opts.subject&&t.subject!==opts.subject)continue;
    let g=groups.get(t.id);if(!g){g={t,score:0,passages:[],n:0};groups.set(t.id,g)}
    g.n++;
    const matched=[];for(let k=0;k<ch.ids.length;k++){const s=ix.termList[ch.ids[k]];if(terms.has(s))matched.push(ix.surf[ch.ids[k]])}
    g.passages.push({ci:ch.ci,hi:ch.hi,path:[ch.st!==t.title?ch.st:''].filter(Boolean),snip:snippetFor(ix,ch,terms),score:h.f,via:h.via,matched:[...new Set(matched)].slice(0,5)});
  }
  const out=[...groups.values()];
  for(const g of out){g.passages.sort((a,b)=>b.score-a.score);const p=g.passages;g.score=p[0].score+0.25*(p[1]?p[1].score:0)+0.1*(p[2]?p[2].score:0)}
  out.sort((a,b)=>b.score-a.score);
  if(out.length>1){const cut=out[0].score*0.2;let k=out.findIndex((g,i)=>i>0&&g.score<cut);if(k>0)out.length=k}
  /* examples from the bank */
  const exs=[];
  for(const e of S.examples){
    const hay=toks((e.title||'')+' '+(e.summary||'')+' '+(e.tags||[]).join(' ')+' '+(e.region||'')),ts=new Set(toks(e.title||'').map(x=>x.s));
    let sc=0;const seen=new Set();for(const x of hay){const o=terms.get(x.s);if(o&&!seen.has(x.s)){seen.add(x.s);sc+=o.w*(ts.has(x.s)?2:1)}}
    if(sc>0)exs.push({e,sc});
  }
  exs.sort((a,b)=>b.sc-a.sc);
  /* related words to show */
  const rel=[];for(const [s,o] of terms){if(o.src==='syn'||o.src==='pre'||o.src==='rel'){const w=ix.surf[ix.vocab.get(s)];if(w&&!rel.includes(w))rel.push(w)}}
  const stems=[...terms.entries()].filter(([,o])=>o.src==='q'||o.src==='syn'||o.src==='pre').map(([s])=>s);
  return{topics:out,examples:exs.slice(0,6).map(x=>x.e),related:rel.slice(0,8),stems,terms:[...terms.entries()].filter(([,o])=>o.src==='q').map(([s])=>ix.surf[ix.vocab.get(s)]),
    stats:{topics:out.length,passages:out.reduce((a,g)=>a+g.passages.length,0)},long};
};

/* ---- automatic links between notes ---- */
function conOf(ix,t){
  let c=ix.tcon.get(t.id);if(!c)return{map:new Map()};
  const norm=Math.sqrt(c.reduce((a,x)=>a+x.score*x.score,0))||1,map=new Map();
  c.forEach(x=>map.set(x.key,{w:x.score/norm,disp:x.term}));
  return{map};
}
NLP.related=function(t,limit=8){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const wa=ix.tt.get(t.id),me=ix.tv.get(t.id);if(!wa)return[];
  const A=conOf(ix,t),out=[];
  for(const o of S.topics){
    if(o.id===t.id||o.deleted)continue;
    const wb=ix.tt.get(o.id);if(!wb)continue;
    const [sm,bg]=wa.size<wb.size?[wa,wb]:[wb,wa];
    let cos=0;const contrib=[];
    for(const [id,x] of sm){const y=bg.get(id);if(y){cos+=x*y;contrib.push([id,x*y])}}
    if(cos<0.04)continue;
    const B=conOf(ix,o);let con=0;const phr=[];
    for(const [k,x] of A.map){const y=B.map.get(k);if(y){con+=x.w*y.w;phr.push([x.disp,x.w*y.w])}}
    const ov=ix.tv.get(o.id),sem=(me&&ov)?Math.max(0,dotv(me,0,ov,0,ix.D)):0;
    let sc=0.7*cos+0.2*Math.min(1,con*2)+0.1*sem;
    const cross=o.subject!==t.subject;if(cross)sc*=1.12;
    phr.sort((a2,b2)=>b2[1]-a2[1]);contrib.sort((a2,b2)=>b2[1]-a2[1]);
    const shared=phr.slice(0,3).map(x=>x[0]);
    const have=new Set(shared.join(' ').toLowerCase().split(/\W+/));
    for(const [id] of contrib){if(shared.length>=4)break;const w=ix.surf[id];if(!have.has(w)&&w.length>3&&!isGenStem(ix.termList[id])){shared.push(w);have.add(w)}}
    out.push({t:o,score:sc,sem,con,cos,shared,cross});
  }
  out.sort((a,b)=>b.score-a.score);
  const top=out.length?out[0].score:0;
  return out.filter(x=>x.score>=Math.max(0.06,top*0.35)).slice(0,limit);
};
NLP.sectionLinks=function(t,perSec=2){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const mine=ix.byTopic.get(t.id)||[],D=ix.D,bySec=new Map();
  mine.forEach(ci=>{const s=ix.chunks[ci].sid;(bySec.get(s)||bySec.set(s,[]).get(s)).push(ci)});
  const rare=ix.nc*0.06,res=[];
  for(const [sid,cis] of bySec){
    const v=new Float32Array(D),ids=new Set();
    cis.forEach(ci=>{for(let k=0;k<D;k++)v[k]+=ix.cvec[ci*D+k];ix.chunks[ci].ids.forEach(id=>{if(ix.df[id]<=rare&&ix.df[id]>=2)ids.add(id)})});
    let n=0;for(let k=0;k<D;k++)n+=v[k]*v[k];n=Math.sqrt(n)||1;for(let k=0;k<D;k++)v[k]/=n;
    const cand=[];
    for(let c=0;c<ix.nc;c++){
      const ch=ix.chunks[c];if(ch.tid===t.id)continue;
      const cos=dotv(v,0,ix.cvec,c*D,D);if(cos<0.25)continue;
      const shared=[];for(let k=0;k<ch.ids.length;k++)if(ids.has(ch.ids[k]))shared.push(ch.ids[k]);
      if(shared.length<2)continue;
      cand.push({c,score:cos+0.05*Math.min(6,shared.length),shared});
    }
    cand.sort((a,b)=>b.score-a.score);
    const seenT=new Set(),picks=[];
    for(const x of cand){const ch=ix.chunks[x.c];if(seenT.has(ch.tid))continue;seenT.add(ch.tid);const o=byId(S.topics,ch.tid);if(!o)continue;
      picks.push({t:o,ci:ch.ci,hi:ch.hi,st:ch.st,snip:shortTxt(ch.text,170),shared:x.shared.slice(0,4).map(id=>ix.surf[id]),score:x.score,cross:o.subject!==t.subject});if(picks.length>=perSec)break}
    if(picks.length){const sec=(ix.chunks[cis[0]]);res.push({title:sec.st,hi:sec.hi,ci:sec.ci,links:picks})}
  }
  return res;
};
NLP.crossConcepts=function(limit=24){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const M=new Map();
  for(const t of S.topics){const c=ix.tcon.get(t.id);if(!c)continue;
    for(const x of c){let o=M.get(x.key);if(!o){o={key:x.key,term:x.term,len:x.len,topics:new Map(),subjects:new Set(),score:0};M.set(x.key,o)}o.topics.set(t.id,t);o.subjects.add(t.subject);o.score+=x.score}}
  const phrases=[...M.values()].filter(o=>o.topics.size>=2&&o.len>=2||o.topics.size>=2&&o.subjects.size>=2);
  const seen=new Set(phrases.flatMap(o=>o.term.toLowerCase().split(/\W+/)));
  const terms=[];
  for(const [id,tis] of ix.tdocs){
    const w=ix.surf[id];if(w.length<5||isGen(w)||isGenStem(ix.termList[id])||seen.has(w))continue;
    const subs=new Set(tis.map(i=>ix.topics[i].subject));if(subs.size<2)continue;
    if(ix.N>=8&&tis.length>ix.N*0.5)continue;
    let sc=0;tis.forEach(i=>{sc+=ix.tt.get(ix.topics[i].id).get(id)||0});
    const tp=new Map();tis.forEach(i=>tp.set(ix.topics[i].id,ix.topics[i]));
    terms.push({key:w,term:w,len:1,topics:tp,subjects:subs,score:sc});
  }
  const rank=(a,b)=>b.subjects.size-a.subjects.size||b.topics.size-a.topics.size||b.score-a.score;
  return phrases.sort(rank).slice(0,Math.ceil(limit/2)).concat(terms.sort(rank)).slice(0,limit);
};
NLP.stats=function(){const ix=NLP.idx;return ix?{topics:ix.N,passages:ix.nc,words:ix.V||0}:null};
</script>
<script>
'use strict';
/* ---- examples that the app finds in the notes by itself ---- */
const DISMISSED=new Set();

/* ---- highlight the important parts of a note automatically ---- */
function domTextMap(el){
  const nodes=[];let text='';
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.tg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode())){nodes.push({n,start:text.length});text+=n.data}
  return{nodes,text};
}
function rangeAt(map,a,b){
  const find=(off,end)=>{for(const nd of map.nodes){const L=nd.n.data.length;if(end?off<=nd.start+L:off<nd.start+L)return[nd.n,Math.max(0,off-nd.start)]}const l=map.nodes[map.nodes.length-1];return[l.n,l.n.data.length]};
  const r=document.createRange(),s=find(a,false),e=find(b,true);r.setStart(s[0],s[1]);r.setEnd(e[0],e[1]);return r;
}
function wrapRange(rg,cls,auto){
  const root=rg.commonAncestorContainer,nodes=[];
  if(root.nodeType===3)nodes.push(root);
  else{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&!n.parentElement.closest('.tg'))nodes.push(n)}}
  let made=0;
  for(const n of nodes){
    const st=n===rg.startContainer?rg.startOffset:0,en=n===rg.endContainer?rg.endOffset:n.length;
    if(st>=en||!n.data.slice(st,en).trim())continue;
    let mid=n;if(st>0)mid=n.splitText(st);if(en-st<mid.length)mid.splitText(en-st);
    const mk=document.createElement('mark');mk.className='hl hl-'+cls;if(auto)mk.setAttribute('data-a','1');
    mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid);made++;
  }
  return made;
}
function markPhrase(el,phrase,cls){
  if(!phrase||phrase.trim().length<2)return 0;
  const map=domTextMap(el);if(!map.nodes.length)return 0;
  const m=new RegExp(phrase.trim().split(/\s+/).map(rxEsc).join('\\s+'),'i').exec(map.text);if(!m)return 0;
  const rg=rangeAt(map,m.index,m.index+m[0].length);
  const inMark=(()=>{const w=document.createTreeWalker(rg.commonAncestorContainer.nodeType===3?rg.commonAncestorContainer.parentNode:rg.commonAncestorContainer,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&n.parentElement.closest('mark'))return true}return false})();
  if(inMark)return 0;
  return wrapRange(rg,cls,true)?1:0;
}
NLP.autoHighlight=function(t,root){
  const V=NLP.view(t),jobs=[];
  V.defs.forEach(d=>jobs.push([d.ci,d.phrase||d.term,'d']));
  V.facts.forEach(f=>jobs.push([f.ci,f.phrase,'f']));
  V.examples.forEach(x=>{if(x.phrase)jobs.push([x.ci,x.phrase,'e'])});
  V.cautions.slice(0,3).forEach(c=>jobs.push([c.ci,c.phrase,'w']));
  V.concepts.slice(0,8).forEach(c=>{if(c.go.k==='c')jobs.push([c.go.i,c.term,'k'])});
  let n=0;
  for(const [ci,ph,cls] of jobs){const el=root.children[ci];if(el)n+=markPhrase(el,ph,cls)}
  return n;
};
NLP.clearAuto=function(root){
  const ms=[...root.querySelectorAll('mark[data-a]')];
  ms.forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove();p.normalize()});
  return ms.length;
};

function drawLib(){
  const subs=subjects();
  const tagCount={};S.topics.forEach(t=>(t.tags||[]).forEach(g=>tagCount[g]=(tagCount[g]||0)+1));
  const tags=Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]).slice(0,14);
  $('#lchips').innerHTML=(subs.length>1?`<button class="chip" aria-pressed="${!LIB.subj}" data-s="">All subjects</button>`+subs.map(s=>`<button class="chip" aria-pressed="${LIB.subj===s}" data-s="${esc(s)}">${esc(s)}</button>`).join(''):'')+tags.map(g=>`<button class="chip" aria-pressed="${LIB.tag===g}" data-g="${esc(g)}">#${esc(g)}</button>`).join('');

  const el=$('#llist');

  const q=LIB.q.trim().toLowerCase();
  if(q){
    const terms=q.split(/\s+/).filter(Boolean),res=[];
    for(const t of list){
      const title=t.title.toLowerCase(),tg=(t.tags||[]).join(' ').toLowerCase(),text=topicText(t),low=text.toLowerCase();let score=0,ok=true;
      for(const w of terms){let s=0;if(title.includes(w))s+=5;if(tg.includes(w))s+=3;s+=Math.min(low.split(w).length-1,10);if(!s){ok=false;break}score+=s}
      if(!ok)continue;
      const idx=low.indexOf(terms[0]);let snip='';
      if(idx>=0){const part=text.slice(Math.max(0,idx-50),idx+100);snip=(idx>50?'…':'')+esc(part).replace(new RegExp('('+terms.map(x=>escRe(esc(x))).join('|')+')','gi'),'<b>$1</b>')+'…'}
      res.push({t,score,snip});
    }
    res.sort((a,b)=>b.score-a.score);

    el.innerHTML=smart+(res.length?`<p class="small muted">${res.length} title match${res.length>1?'es':''}</p>`+res.map(r=>row(r.t,r.snip)).join(''):'<div class="empty">No note title or tag matches that.</div>');
    return;
  }
  const groups={};

  view().innerHTML=`<div class="row sp"><h1 class="pg">Examples and case studies</h1><button class="btn pri" id="xNew">${ic('plus')} Add</button></div>

function drawEx(){
  const cnt={};S.examples.forEach(e=>(e.tags||[]).forEach(g=>cnt[g]=(cnt[g]||0)+1));
  const tags=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,14);
  const nAuto=S.examples.filter(e=>e.auto).length,nMine=S.examples.length-nAuto;
  $('#xchips').innerHTML=(nAuto?`<button class="chip" data-src="" aria-pressed="${!EXQ.src}">All ${S.examples.length}</button><button class="chip" data-src="auto" aria-pressed="${EXQ.src==='auto'}">Found in notes ${nAuto}</button><button class="chip" data-src="mine" aria-pressed="${EXQ.src==='mine'}">Added by me ${nMine}</button>`:'')+tags.map(g=>`<button class="chip" aria-pressed="${EXQ.tag===g}" data-g="${esc(g)}">#${esc(g)}</button>`).join('');
  $('#xchips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;if(c.dataset.src!==undefined){EXQ.src=c.dataset.src;drawEx();return}EXQ.tag=EXQ.tag===c.dataset.g?'':c.dataset.g;drawEx()};
  const unscanned=S.settings.autoEx===false?0:S.topics.filter(t=>SCANNED[t.id]!==t.updated).length,xs=$('#xscan');
  xs.innerHTML=unscanned?`<div class="card tight row sp" style="margin-bottom:12px"><span class="small">${unscanned} note${unscanned===1?'':'s'} not checked for examples yet.</span><button class="btn sm pri" id="xScan">Find examples in my notes</button></div>`:'';
  const sb=$('#xScan');if(sb)sb.onclick=async()=>{sb.disabled=true;await NLP.whenReady();const r=await scanAllExamples((i,n)=>{sb.textContent=`Checking ${i} of ${n}…`});toast(r.added?`Found ${r.added} new example${r.added===1?'':'s'} in ${r.topics} notes`:'Checked every note. Nothing new to add.',4000);drawEx()};
  const q=EXQ.q.trim().toLowerCase();
  const list=S.examples.filter(e=>(!EXQ.src||(EXQ.src==='auto')===!!e.auto)&&(!EXQ.tag||(e.tags||[]).includes(EXQ.tag))&&(!q||(e.title+' '+e.summary+' '+e.region+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q))).sort((a,b)=>(b.updated||0)-(a.updated||0));
  const el=$('#xlist');
  if(!S.examples.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">No examples yet. Add a real case study, scheme or data point you would like to quote.</div>';return}
  el.innerHTML=list.map(e=>{const used=S.topics.filter(t=>(t.exampleIds||[]).includes(e.id)).length;
    return exCard(e,`<div class="row sp" style="margin-top:8px"><span class="small muted">Used in ${used} topic${used===1?'':'s'}</span><span><button class="btn sm" data-ed="${e.id}">Edit</button> <button class="btn sm dng" data-dl="${e.id}">Delete</button></span></div>`)}).join('')||'<div class="empty" style="grid-column:1/-1">Nothing matches.</div>';
  el.onclick=async ev=>{
    const ed=ev.target.closest('[data-ed]'),dd=ev.target.closest('[data-dl]');
    if(ed)exampleModal(byId(S.examples,ed.dataset.ed),drawEx);
    if(dd&&await confirmBox(byId(S.examples,dd.dataset.dl).auto?'Remove this example? It was found in your notes and will not be added again.':'Delete this example? It will also be removed from any topic or answer plan that uses it.')){
      const id=dd.dataset.dl;const ex=byId(S.examples,id);if(ex.auto){ex.dismissed=true;DISMISSED.add(id)}ex.deleted=true;ex.updated=Date.now();await DB.put('examples',ex);S.examples=S.examples.filter(x=>x.id!==id);
      for(const t of S.topics)if((t.exampleIds||[]).includes(id)){t.exampleIds=t.exampleIds.filter(x=>x!==id);t.updated=Date.now();await DB.put('topics',t)}
      for(const p of S.plans)if((p.exampleIds||[]).includes(id)){p.exampleIds=p.exampleIds.filter(x=>x!==id);p.updated=Date.now();await DB.put('plans',p)}
      drawEx();
    }
  };
}

<script>
'use strict';
const GL={mode:'',recall:false};
const wrapText=(s,max)=>{const w=s.split(/\s+/),lines=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()}if(cur)lines.push(cur);
  if(lines.length>3){lines.length=3;lines[2]=lines[2].replace(/.{0,2}$/,'')+'…'}return lines};
const TYPE_LTR={d:'D',f:'F',e:'E',w:'!',k:'K'};
function mapSVG(g,title){
  const W=1000,H=700,cx=500,cy=350,rx=235,ry=165,lrx=405,lry=285;
  const list=g.slice(0,12),n=list.length,extra=g.length-list.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Memory map of ${esc(title)}">`,nodes='';
  const attrs=go=>`data-gk="${go.k}" data-gi="${go.i}" data-gh="${esc(go.hl||'')}" role="button" tabindex="0"`;
  const box=(x,y,w,h,fill,stroke,lines,fs,cls,go,bold)=>{
    let o=`<g ${cls?`class="${cls}"`:''} ${go?attrs(go):''}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${Math.min(14,h/2)}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    lines.forEach((l,i)=>{o+=`<text x="${x}" y="${y-(lines.length-1)*fs*0.6+i*fs*1.2+fs*0.35}" font-size="${fs}" text-anchor="middle" ${bold?'font-weight="700"':''}>${esc(l)}</text>`});
    return o+'</g>';
  };
  const leaf=(x,y,lf,col)=>{
    const ls=wrapText(lf.label,17),h=ls.length*17+14,w=176,tp=lf.type&&lf.type!=='h'?lf.type:null;
    let o=`<g ${attrs(lf.go)}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${Math.min(14,h/2)}" fill="var(--surface2)" stroke="${col}" stroke-width="2"/>`;
    if(tp)o+=`<circle cx="${x-w/2+15}" cy="${y}" r="9" fill="var(--hl-${tp})" stroke="var(--ink)" stroke-width="1"/><text x="${x-w/2+15}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle">${TYPE_LTR[tp]}</text>`;
    const tx=x+(tp?11:0);
    ls.forEach((l,i)=>{o+=`<text x="${tx}" y="${y-(ls.length-1)*8.5+i*17+5}" font-size="13.5" text-anchor="middle">${esc(l)}</text>`});
    return o+'</g>';
  };
  list.forEach((b,i)=>{
    const a=-Math.PI/2+2*Math.PI*i/n,bx=cx+rx*Math.cos(a),by=cy+ry*Math.sin(a),col=BCOL(i);
    s+=`<path d="M${cx} ${cy}Q${(cx+bx)/2} ${(cy+by)/2} ${bx} ${by}" stroke="${col}" stroke-width="5" fill="none" opacity=".75"/>`;
    const lv=b.leaves.slice(0,4),k=lv.length,spread=Math.min(0.5,(2*Math.PI/n)*0.42);
    lv.forEach((lf,j)=>{
      const la=a+(k>1?(j/(k-1)-0.5)*2*spread:0),lx=cx+lrx*Math.cos(la),ly=cy+lry*Math.sin(la);
      s+=`<path d="M${bx} ${by}L${lx} ${ly}" stroke="${col}" stroke-width="2" fill="none" opacity=".6"/>`;
      nodes+=leaf(lx,ly,lf,col);
    });
    const bl=wrapText(b.title,18);
    nodes+=box(bx,by,168,bl.length*20+18,col,col,bl,16,'cn',b.go,true);
  });
  const cl=wrapText(title,22);
  nodes+=`<g class="cn"><ellipse cx="${cx}" cy="${cy}" rx="120" ry="${28+cl.length*14}" fill="var(--brand)"/>${cl.map((l,i)=>`<text x="${cx}" y="${cy-(cl.length-1)*11+i*22+6}" font-size="18" font-weight="700" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`;
  if(extra>0)nodes+=`<text x="${cx}" y="${H-12}" font-size="14" text-anchor="middle" fill="var(--muted)">+${extra} more sections. Use the Cards view to see them all.</text>`;
  return s+nodes+'</svg>';
}
const flashTerms=(el,o)=>{
  if(!el||typeof Highlight==='undefined'||!window.CSS||!CSS.highlights)return;
  const map=domTextMap(el);if(!map.nodes.length)return;
  let rx;
  if(o.hs){const w=o.hs.split(/[\s+]+/).filter(x=>x.length>=3).map(rxEsc);if(!w.length)return;rx=new RegExp('\\b('+w.map(x=>x+'\\w*').join('|')+')','gi')}
  else if(o.hl){rx=new RegExp(o.hl.trim().split(/\s+/).map(rxEsc).join('\\s+'),'gi')}
  else return;
  const rgs=[];for(const m of map.text.matchAll(rx))rgs.push(rangeAt(map,m.index,m.index+m[0].length));
  if(rgs.length){CSS.highlights.set('srch',new Highlight(...rgs));setTimeout(()=>CSS.highlights.delete('srch'),8000)}
};

VIEWS.topic=r=>{

  view().innerHTML=`<div class="thead"><a href="#/library" class="small">‹ Library</a><h1>${esc(t.title)}</h1>
    <div class="small muted">${esc(t.subject)}${t.unit?' › '+esc(t.unit):''}</div><div style="margin-top:6px">${(t.tags||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>

  function showTab(n,extra){

    ({glance:renderGlance,read:renderRead,related:renderRelated,examples:renderExamples})[n](extra);

  revInfo();
  $('#tRev').onclick=()=>modal(`<h3>How did revision go?</h3><p class="small muted" style="margin-top:0">This decides when the topic comes back.</p><div class="row" style="flex-direction:column;align-items:stretch"><button class="btn" data-g="hard"><b>Hard</b> – see it again tomorrow</button><button class="btn" data-g="ok"><b>Okay</b> – next interval</button><button class="btn" data-g="easy"><b>Easy</b> – skip ahead</button></div>`,b=>{
    b.onclick=async e=>{const x=e.target.closest('[data-g]');if(!x)return;await reviseTopic(t,x.dataset.g);closeModal();revInfo();toast('Next revision '+fmtDate(t.rev.due))};
  });

  /* ---- glance ---- */
  function renderGlance(){
    const V=NLP.view(t),md=GL.mode||(innerWidth<760?'cards':'map');
    const g=V.branches;
    const briefBody=t.summary?`<p>${esc(t.summary)}</p>`:
      (V.summary.length?`<ul class="brief">${V.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="small muted" style="margin-top:6px">Picked automatically from your note. <button class="btn sm ghost" id="sKeep">Keep as my summary</button></div>`:'<p class="muted">Add some text to this note and a summary will appear here.</p>');
    const it=(c,go,ttl,sub)=>`<div class="it ${c}" data-gk="${go.k}" data-gi="${go.i}" data-gh="${esc(go.hl||'')}"><span class="bd ${c}" aria-hidden="true">${TYPE_LTR[c]}</span><div class="tx"><b>${esc(ttl)}</b>${sub?`<span class="hide">${esc(sub)}</span>`:''}</div></div>`;

    const ess=

      det(false,'Cautions and criticisms',V.cautions.length,V.cautions.map(c=>it('w',{k:'c',i:c.ci,hl:c.phrase},c.label,c.text)).join(''));
    $('#tpane').innerHTML=`<div class="sumcard"><div class="row sp" style="margin-bottom:6px"><b>In brief</b><span><button class="btn sm" id="sEdit">${t.summary?'Edit':'Write my own'}</button>${t.summary?' <button class="btn sm" id="sAuto">Use automatic</button>':''}</span></div>${briefBody}</div>
      <div class="row sp" style="margin-top:14px"><div class="seg" role="group" aria-label="Glance style"><button data-m="cards" aria-pressed="${md==='cards'}">Cards</button><button data-m="map" aria-pressed="${md==='map'}">Map</button></div>
      <div class="row"><button class="chip" id="gRecall" aria-pressed="${GL.recall}">Test myself</button><button class="btn pri" id="gRead">Read in detail ${ic('next',16)}</button></div></div>

      <div id="gview" class="${GL.recall?'recall':''}">${md==='cards'||!g.length?ess:''}<div id="gstruct"></div></div>`;
    const gs=$('#gstruct');
    if(!g.length)gs.innerHTML=ess?'':'<div class="empty" style="margin-top:14px">This note has no text to map yet. Open Read, choose Edit, and add your notes.</div>';
    else if(md==='cards')gs.innerHTML=`<h2 class="sec">Structure of the note</h2><div class="branches">${g.map((b,i)=>`<div class="br" style="--c:${BCOL(i)}"><h4 data-gk="${b.go.k}" data-gi="${b.go.i}" tabindex="0" role="button">${esc(b.title)}</h4>${b.leaves.length?`<div class="lv">${b.leaves.map(l=>`<button class="lf" data-gk="${l.go.k}" data-gi="${l.go.i}" data-gh="${esc(l.go.hl||'')}">${l.type!=='h'?`<span class="bd ${l.type}" aria-hidden="true">${TYPE_LTR[l.type]}</span>`:''}${esc(l.label)}</button>`).join('')}</div>`:''}</div>`).join('')}</div>`;
    else gs.innerHTML=`<div class="mapwrap">${mapSVG(g,t.title)}</div><div class="legendmap"><span class="bd d">D</span> definition · <span class="bd f">F</span> fact · <span class="bd e">E</span> example · <span class="bd w">!</span> caution · <span class="bd k">K</span> key concept. Tap any box to open that part of the note.</div>`;
    $('#gRead').onclick=()=>showTab('read');
    $$('.seg button',$('#tpane')).forEach(b=>b.onclick=()=>{GL.mode=b.dataset.m;renderGlance()});
    $('#gRecall').onclick=()=>{GL.recall=!GL.recall;renderGlance()};
    const keep=$('#sKeep');if(keep)keep.onclick=()=>{t.summary=V.summary.join('\n');saveTopicNow(t);renderGlance();toast('Saved as your summary')};
    $('#sEdit').onclick=()=>modal(`<h3>In brief</h3><p class="small muted" style="margin-top:0">Five lines you could recite from memory.</p><textarea id="sv" style="min-height:160px">${esc(t.summary||V.summary.join('\n'))}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="sok">Save</button><button class="btn" id="sno">Cancel</button></div>`,b=>{$('#sv',b).focus();$('#sno',b).onclick=closeModal;$('#sok',b).onclick=()=>{t.summary=$('#sv',b).value.trim();saveTopicNow(t);closeModal();renderGlance()}});
    const au=$('#sAuto');if(au)au.onclick=async()=>{if(!await confirmBox('Replace your own summary with the automatic one?','Replace',false))return;t.summary='';saveTopicNow(t);renderGlance()};
    const pane=$('#tpane');
    pane.onclick=pane.onkeydown=e=>{
      if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
      const x=e.target.closest('[data-gk]');if(!x)return;
      if(GL.recall&&(x.classList.contains('it')||x.classList.contains('lf'))&&!x.classList.contains('shown')){x.classList.add('shown');return}

  /* ---- read ---- */
  function renderRead(target){
    if(tabClean){tabClean();tabClean=null}
    const rb0=$('#tpane');
    const legend=HL_KEYS.map(k=>`<mark class="hl hl-${k}">${esc(S.settings.legend[k])}</mark>`).join('');
    const etb=`<div class="row noprint" id="etb" style="margin-bottom:10px">${[['formatBlock','H2','H2'],['formatBlock','H3','H3'],['formatBlock','P','Text'],['bold','','Bold'],['underline','','Underline'],['insertUnorderedList','','Bullets'],['insertOrderedList','','Numbers'],['removeFormat','','Clear format'],['undo','','Undo']].map(([c,v,l])=>`<button class="btn sm" data-cmd="${c}" data-val="${v}">${l}</button>`).join('')}</div>`;
    const qtb=`<div class="qstoolbar noprint" id="qsTb">${[['formatBlock','H2','H2'],['formatBlock','H3','H3'],['formatBlock','P','Text'],['bold','','Bold'],['underline','','Underline'],['insertUnorderedList','','Bullets'],['insertOrderedList','','Numbers'],['removeFormat','','Clear format'],['undo','','Undo']].map(([c,v,l])=>`<button class="btn sm" data-cmd="${c}" data-val="${v}">${l}</button>`).join('')}
      <span style="width:1px;background:var(--line);margin:0 4px"></span>
      ${['#3B6FB8','#2E8B57','#C7761B','#B3261E','#B08900','#8A4FD1'].map(c=>`<button class="sw" style="background:${c}" data-cmd="forecolor" data-val="${c}" aria-label="Text colour ${c}" title="Text colour"></button>`).join('')}
