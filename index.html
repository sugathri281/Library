<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Library</title>
<meta name="theme-color" content="#1D4E6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#16232B; --muted:#56666E; --line:#D3DCD8;
  --brand:#1D4E6B; --brand-ink:#FFFFFF; --brand-soft:#DCEAF2; --danger:#B3261E;
  --hl-d:#CFE3FF; --hl-f:#CDEFD3; --hl-e:#FFE0BA; --hl-w:#FFD0CF; --hl-k:#FFF1A8;
  --b0:#1D4E6B; --b1:#7A3E9D; --b2:#B45309; --b3:#0F766E; --b4:#B0245B; --b5:#4D6B12; --b6:#3B4CCA; --b7:#8A5A00;
  --ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --read-font:var(--serif); --read-size:18px; --read-lh:1.7;
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --surface:#16222A; --surface2:#1B2A33; --ink:#E6EEF2; --muted:#9DB0BA; --line:#2A3A44;
    --brand:#6CB4D9; --brand-ink:#08222F; --brand-soft:#1D3542; --danger:#F2B8B5;
    --hl-d:#25467A; --hl-f:#22563A; --hl-e:#75501A; --hl-w:#7A2B2B; --hl-k:#6B6118;
    --b0:#6CB4D9; --b1:#C79BE0; --b2:#F0A75B; --b3:#5CD0C4; --b4:#F08DB4; --b5:#B4D66B; --b6:#9DA8FF; --b7:#E5BC5B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#16222A; --surface2:#1B2A33; --ink:#E6EEF2; --muted:#9DB0BA; --line:#2A3A44;
  --brand:#6CB4D9; --brand-ink:#08222F; --brand-soft:#1D3542; --danger:#F2B8B5;
  --hl-d:#25467A; --hl-f:#22563A; --hl-e:#75501A; --hl-w:#7A2B2B; --hl-k:#6B6118;
  --b0:#6CB4D9; --b1:#C79BE0; --b2:#F0A75B; --b3:#5CD0C4; --b4:#F08DB4; --b5:#B4D66B; --b6:#9DA8FF; --b7:#E5BC5B;
}
:root[data-theme="sepia"]{
  --bg:#F1E8D4; --surface:#FBF5E6; --surface2:#F6EED9; --ink:#33291B; --muted:#6E5F47; --line:#DDCFB0;
  --brand:#5B3A1E; --brand-ink:#FFFFFF; --brand-soft:#EBDCBC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.f{fill:currentColor;stroke:none}

/* shell */
#app{display:flex;min-height:100vh}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:12px;border-top:3px solid transparent}
nav#nav a[aria-current="page"]{color:var(--brand);border-top-color:var(--brand);font-weight:700}
main#view{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + 90px);max-width:980px;margin:0 auto;width:100%}
@media (min-width:900px){
  nav#nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 10px 16px}
  nav#nav a{flex:none;flex-direction:row;gap:12px;padding:11px 12px;border-top:0;border-left:3px solid transparent;border-radius:8px;font-size:15px}
  nav#nav a[aria-current="page"]{border-left-color:var(--brand);background:var(--brand-soft)}
  main#view{margin:0 0 0 200px;width:auto;max-width:1000px;padding:28px 32px 120px}
  #app{display:block}
}
h1.pg{font:600 26px/1.2 var(--serif);margin:4px 0 4px}
p.sub{color:var(--muted);margin:0 0 16px}
h2.sec{font:700 17px/1.3 var(--ui);margin:26px 0 10px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
textarea{min-height:88px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;margin:0 4px 4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.tight{padding:12px 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* library */
.grp{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.grp h3{margin:0;font:700 16px var(--ui);color:var(--brand)}
.grp .u{font-weight:400;color:var(--muted);font-size:14px}
.trow{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:0 0 8px}
.trow:hover{border-color:var(--brand)}
.trow .t{font-weight:700}
.trow .m{display:flex;gap:10px;align-items:center;margin-top:6px}
.trow .bar{flex:0 0 90px}
.snip{color:var(--muted);font-size:14px;margin-top:3px}
.snip b{background:var(--hl-k);color:inherit;padding:0 1px;border-radius:2px}

/* topic header + tabs */
.thead{margin-bottom:8px}
.thead h1{font:600 25px/1.25 var(--serif);margin:6px 0 4px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:10px 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* glance */
.sumcard{border-left:5px solid var(--brand);background:var(--surface);border-radius:0 14px 14px 0;padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sumcard p{margin:0;font:400 17px/1.6 var(--serif);white-space:pre-wrap}
.branches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.br{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 12px 12px 0;padding:12px 14px}
.br h4{margin:0 0 8px;font:600 17px/1.3 var(--serif);color:var(--c);cursor:pointer}
.br .lv{display:flex;flex-wrap:wrap;gap:6px}
.lf{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:14px;cursor:pointer;text-align:left}
.recall .lf{filter:blur(6px);transition:filter .15s}
.recall .lf.shown{filter:none}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:14px}
.mapwrap svg{display:block;min-width:820px;width:100%;height:auto}
.mapwrap text{font-family:var(--ui);fill:var(--ink)}
.mapwrap .cn text{fill:var(--brand-ink)}
.mapwrap g[data-go]{cursor:pointer}

/* reader */
.reader{font-family:var(--read-font);font-size:var(--read-size);line-height:var(--read-lh);max-width:44em;margin:0 auto}
.reader h1,.reader h2,.reader h3,.reader h4{font-family:var(--serif);line-height:1.3;color:var(--brand);position:relative;margin:1.6em 0 .5em;padding-right:34px}
.reader h1{font-size:1.5em}
.reader h2{font-size:1.3em;border-bottom:1px solid var(--line);padding-bottom:4px}
.reader h3{font-size:1.13em}
.reader h4,.reader h5,.reader h6{font-size:1em}
.reader p,.reader li{margin:.55em 0}
.reader p.sp{margin:.15em 0;min-height:1.1em}
.reader ul,.reader ol{padding-left:1.4em}
.reader table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:1em 0}
.reader td,.reader th{border:1px solid var(--line);padding:6px 10px;min-width:70px;vertical-align:top}
.reader th{background:var(--surface2)}
.reader img{max-width:100%;height:auto}
.reader blockquote{margin:1em 0;padding:2px 14px;border-left:4px solid var(--line);color:var(--muted)}
.reader pre{overflow:auto;background:var(--surface2);padding:10px;border-radius:8px;font-size:.85em}
.reader .hid{display:none}
.reader .tg{position:absolute;right:0;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:6px}
.reader h2 .tg{top:calc(50% - 2px)}
.reader h1.col .tg svg,.reader h2.col .tg svg,.reader h3.col .tg svg,.reader h4.col .tg svg{transform:rotate(-90deg)}
.reader.editing{outline:2px dashed var(--brand);outline-offset:8px;min-height:200px;padding:6px}
mark.hl{background:var(--hl-k);color:inherit;padding:0 2px;border-radius:3px;text-decoration-thickness:2px;text-underline-offset:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl-d{background:var(--hl-d);text-decoration-line:underline;text-decoration-style:solid}
mark.hl-f{background:var(--hl-f);text-decoration-line:underline;text-decoration-style:dotted}
mark.hl-e{background:var(--hl-e);text-decoration-line:underline;text-decoration-style:dashed}
mark.hl-w{background:var(--hl-w);text-decoration-line:underline;text-decoration-style:wavy}
mark.hl-k{background:var(--hl-k);text-decoration-line:underline;text-decoration-style:double}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend mark{font:400 13px var(--ui);padding:2px 8px}
.speaking{background:var(--brand-soft);border-radius:6px}
::highlight(tts-sent){background:var(--brand-soft);color:inherit}
::highlight(tts-word){background:var(--brand);color:var(--brand-ink)}
.hlonly h4{margin:16px 0 6px;font:700 15px var(--ui)}
.hlonly ul{margin:0;padding-left:1.2em}
.hlonly li{margin:6px 0}
.hlonly .from{color:var(--muted);font:13px var(--ui)}

/* floating bars */
#hlbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:none;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#hlbar.show{display:flex}
#hlbar button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);color:var(--ink);font-weight:700}
#hlbar button[data-c="d"]{background:var(--hl-d)}#hlbar button[data-c="f"]{background:var(--hl-f)}#hlbar button[data-c="e"]{background:var(--hl-e)}#hlbar button[data-c="w"]{background:var(--hl-w)}#hlbar button[data-c="k"]{background:var(--hl-k)}
#hlbar button[data-c="x"]{background:var(--surface)}
#player{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border-top:1px solid var(--line);display:none;align-items:center;gap:6px;padding:6px 10px}
#player.show{display:flex}
#player .now{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{min-width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#player button.play{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
@media (min-width:900px){#player{left:200px;bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;display:none;max-width:90vw}
#toast.show{display:block}

/* modal */
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,26,.55);display:none;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#modal.show{display:flex}
#modal .box{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#modal{align-items:center}#modal .box{border-radius:16px}}
#modal h3{margin:0 0 6px;font:600 21px var(--serif)}
.pick{max-height:46vh;overflow:auto;margin-top:8px}
.pick button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;margin:0 0 6px}
.pick button:hover{border-color:var(--brand)}

/* practise */
.qcard{display:block;text-decoration:none;color:inherit}
.skel{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 12px 12px 0;background:var(--surface);padding:12px 14px;margin:0 0 12px}
.skel h4{margin:0 0 6px;font:700 16px var(--ui);color:var(--c);display:flex;justify-content:space-between;gap:8px;align-items:center}
.skel .hint{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.skel .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.skel textarea{min-height:64px;margin:0 0 8px}
.skel.off{opacity:.55}
.timer{font:700 28px var(--ui);font-variant-numeric:tabular-nums}
.check label{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px}
.stat{font:600 34px/1 var(--serif);color:var(--brand)}
.legendedit{display:flex;gap:8px;align-items:center;margin:6px 0}
.legendedit mark{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
/* smart features */
nav#nav a{font-size:11.5px}
@media (min-width:900px){nav#nav a{font-size:15px}}
.bd{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:6px;font:700 11px var(--ui);color:var(--ink);flex:none;padding:0 4px;border:1px solid rgba(0,0,0,.25)}
.bd.d{background:var(--hl-d)}.bd.f{background:var(--hl-f)}.bd.e{background:var(--hl-e)}.bd.w{background:var(--hl-w)}.bd.k{background:var(--hl-k)}.bd.h{background:var(--line)}
details.ess{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}
details.ess>summary{cursor:pointer;padding:11px 14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.ess>summary::-webkit-details-marker{display:none}
details.ess>summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.ess[open]>summary::after{content:'▴'}
details.ess .cnt{font-weight:400;color:var(--muted);font-size:13px}
.ess .body{padding:0 14px 12px}
.cpts{display:flex;flex-wrap:wrap;gap:6px}
.cpt{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.cpt.def{border-color:var(--brand);font-weight:700}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-left:4px solid var(--c);background:var(--surface2);border-radius:0 8px 8px 0;margin:0 0 8px;cursor:pointer}
.it.d{--c:#3B6FB8}.it.f{--c:#2E8B57}.it.e{--c:#C7761B}.it.w{--c:#B3261E}.it.k{--c:#B08900}
.it .tx{flex:1;min-width:0;font-size:15px;line-height:1.5}
.it .tx b{display:block}
.it .hide{display:block;color:var(--muted);font-size:14px}
.recall .it:not(.shown) .hide{filter:blur(6px)}
ul.brief{margin:0;padding-left:1.2em;font:400 16px/1.55 var(--serif)}
ul.brief li{margin:5px 0}
.lf .bd{margin-right:6px;vertical-align:-3px}
.legendmap{font-size:12.5px;color:var(--muted);margin:8px 0}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.res h3{margin:0;font:700 16px var(--ui)}
.pas{display:block;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--line)}
.pas:first-of-type{border-top:0}
.pas:hover{background:var(--surface2)}
.pas .p{font-size:12.5px;color:var(--muted)}
.pas b,.snip b{background:var(--hl-k);color:inherit;border-radius:2px;padding:0 1px}
.pas b.r,.snip b.r{background:none;border-bottom:2px dotted var(--brand);border-radius:0}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.subjhead{margin:18px 0 6px;font:700 13px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--brand)}
::highlight(srch){background:#FFD54F;color:#1a1a1a}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{nav#nav,#player,#hlbar,.noprint{display:none!important}main#view{margin:0;padding:0}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="hlbar" role="toolbar" aria-label="Highlight colours">
  <button data-c="d" aria-label="Definition"></button>
  <button data-c="f" aria-label="Fact or data"></button>
  <button data-c="e" aria-label="Example or case study"></button>
  <button data-c="w" aria-label="Warning or exception"></button>
  <button data-c="k" aria-label="Answer keyword"></button>
  <button data-c="x" aria-label="Remove highlight">✕</button>
</div>
<div id="player" role="region" aria-label="Read aloud">
  <button id="pPrev" aria-label="Previous paragraph"></button>
  <button id="pPlay" class="play" aria-label="Play"></button>
  <button id="pNext" aria-label="Next paragraph"></button>
  <div class="now" id="pNow">Ready</div>
  <button id="pRate" aria-label="Speed">1x</button>
  <button id="pOpt" aria-label="Audio settings"></button>
  <button id="pClose" aria-label="Close player"></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- markdown -> html ---------- */
function inl(s){
  s=esc(s);
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
   .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
   .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>')
   .replace(/==([^=]+)==/g,'<mark class="hl hl-k">$1</mark>')
   .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function buildList(items){
  let html='';const st=[];
  for(const it of items){
    while(st.length&&it.indent<st[st.length-1].indent)html+='</li></'+st.pop().tag+'>';
    let top=st[st.length-1];
    if(top&&it.indent===top.indent&&top.tag!==(it.ord?'ol':'ul')){html+='</li></'+st.pop().tag+'>';top=st[st.length-1]}
    if(!top||it.indent>top.indent){const tag=it.ord?'ol':'ul';html+=`<${tag}><li>`;st.push({indent:it.indent,tag});}
    else html+='</li><li>';
    html+=inl(it.text);
  }
  while(st.length)html+='</li></'+st.pop().tag+'>';
  return html;
}
function md2html(md,opts={}){
  const L=String(md).replace(/\r/g,'').split('\n');const out=[];let i=0,m;
  const isBlock=l=>/^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+[.)])\s+|\s*\|.*\|\s*$)/.test(l);
  while(i<L.length){
    const line=L[i];
    if(/^\s*$/.test(line)){
      let n=0;while(i<L.length&&/^\s*$/.test(L[i])){n++;i++}
      const k=opts.lines?n:n-1;   // a single blank line just separates paragraphs; more than that is deliberate spacing
      if(out.length&&i<L.length&&k>0&&opts.spacers!==false)for(let j=0;j<Math.min(k,3);j++)out.push('<p class="sp"><br></p>');
      continue;
    }
    if(/^```/.test(line)){const buf=[];i++;while(i<L.length&&!/^```/.test(L[i]))buf.push(L[i++]);i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue}
    if((m=line.match(/^(#{1,6})\s+(.*)$/))){out.push(`<h${m[1].length}>${inl(m[2].replace(/\s*#+\s*$/,''))}</h${m[1].length}>`);i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){out.push('<hr>');i++;continue}
    if(/^>\s?/.test(line)){const buf=[];while(i<L.length&&/^>\s?/.test(L[i]))buf.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote><p>'+inl(buf.join(' '))+'</p></blockquote>');continue}
    if(/^\s*\|.*\|\s*$/.test(line)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));
      const head=cells(line);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(cells(L[i++]));
      out.push('<table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue;
    }
    if((m=line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))){
      const items=[];
      while(i<L.length&&(m=L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))){items.push({indent:m[1].replace(/\t/g,'    ').length,ord:/\d/.test(m[2]),text:m[3]});i++}
      out.push(buildList(items));continue;
    }
    if(opts.lines){out.push('<p>'+inl(line.trim())+'</p>');i++;continue}
    const buf=[];while(i<L.length&&!/^\s*$/.test(L[i])&&(buf.length===0||!isBlock(L[i])))buf.push(L[i++].trim());
    out.push('<p>'+inl(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ---------- sanitizer (imports, pastes) ---------- */
const ALLOW=new Set(['H1','H2','H3','H4','H5','H6','P','BR','UL','OL','LI','STRONG','EM','U','MARK','TABLE','THEAD','TBODY','TR','TH','TD','BLOCKQUOTE','PRE','CODE','A','IMG','HR','SUP','SUB','S']);
const TAGMAP={B:'STRONG',I:'EM',STRIKE:'S',DEL:'S',CAPTION:'P',TFOOT:'TBODY'};
const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','NOSCRIPT','HEAD','TITLE','META','LINK','SVG','FORM','BUTTON','INPUT','SELECT','TEXTAREA','CANVAS','VIDEO','AUDIO','COLGROUP','COL']);
const BLOCKISH=new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','TABLE','DIV','BLOCKQUOTE','PRE','SECTION','ARTICLE','LI','HR']);
function colourClass(v){
  try{
    const c=document.createElement('canvas').getContext('2d');c.fillStyle='#000';c.fillStyle=String(v).trim();
    let s=c.fillStyle,r,g,b;
    if(s[0]==='#'){r=parseInt(s.substr(1,2),16);g=parseInt(s.substr(3,2),16);b=parseInt(s.substr(5,2),16)}
    else{const m=s.match(/[\d.]+/g);r=+m[0];g=+m[1];b=+m[2]}
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx-mn<25)return null; // white / grey: not a highlight
    let h;const d=mx-mn;
    if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;
    if(h<18||h>=290)return 'w';if(h<45)return 'e';if(h<75)return 'k';if(h<170)return 'f';return 'd';
  }catch(e){return 'k'}
}
function styleWraps(n){
  const st=(n.getAttribute('style')||'').toLowerCase();const w=[];
  if(/font-weight:\s*(bold|[6-9]00)/.test(st))w.push(['strong']);
  if(/font-style:\s*italic/.test(st))w.push(['em']);
  if(/text-decoration[^;]*underline/.test(st))w.push(['u']);
  const bg=st.match(/(?:mso-highlight|background(?:-color)?):\s*([^;]+)/);
  if(bg){const c=colourClass(bg[1].replace(/!important/,''));if(c)w.push(['mark',c])}
  return w;
}
function sanitize(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out=document.createElement('div');
  const mk=(w)=>{const e=document.createElement(w[0]);if(w[0]==='mark')e.className='hl hl-'+(w[1]||'k');return e};
  const spacer=()=>{const p=document.createElement('p');p.className='sp';p.appendChild(document.createElement('br'));return p};
  const isBlankLine=n=>!!n.querySelector('br')||/\u00a0/.test(n.textContent);
  const walk=(node,parent)=>{
    for(const n of [...node.childNodes]){
      if(n.nodeType===3){parent.appendChild(document.createTextNode(n.data));continue}
      if(n.nodeType!==1)continue;
      let tag=n.tagName;if(DROP.has(tag))continue;
      tag=TAGMAP[tag]||tag;
      const style=/^(SPAN|FONT|B|STRONG|I|EM|U|P|TD|TH|H\d|LI|A)$/.test(n.tagName)?styleWraps(n):[];
      if((n.tagName==='B'||n.tagName==='STRONG')&&/font-weight:\s*(normal|400)/i.test(n.getAttribute('style')||'')){walk(n,parent);continue}
      let target=parent;
      if(tag==='MARK'){const m=(n.className||'').match(/hl-([dfewk])/);const e=mk(['mark',m?m[1]:'k']);if(n.getAttribute('data-a'))e.setAttribute('data-a','1');parent.appendChild(e);walk(n,e);continue}
      if(!ALLOW.has(tag)){

          const hasBlock=[...n.children].some(c=>BLOCKISH.has(c.tagName));

      if(tag==='TD'||tag==='TH'){['colspan','rowspan'].forEach(a=>{const v=parseInt(n.getAttribute(a),10);if(v>1&&v<20)el.setAttribute(a,v)})}

  $$('p,strong,em,u,s,mark,a,li,td,th,h1,h2,h3,h4,h5,h6',out).reverse().forEach(e=>{
    if(e.textContent.trim()||e.querySelector('img'))return;

      else e.remove();

    }

  });
  $$('br+br+br',out).forEach(b=>b.remove());   // keep one blank line inside a paragraph, not a run of them
  {let run=0;[...out.children].forEach(c=>{if(c.tagName==='P'&&c.classList.contains('sp')){if(++run>3)c.remove()}else run=0})}   // at most 3 spacers in a row

}
function splitByHeading(html){
  const d=document.createElement('div');d.innerHTML=html;
  const kids=[...d.children];
  const cnt=l=>kids.filter(k=>k.tagName==='H'+l).length;
  const lvl=[1,2,3].find(l=>cnt(l)>=2);
  if(!lvl)return null;
  const parts=[];let cur=null;
  for(const k of kids){
    if(k.tagName==='H'+lvl){cur={title:k.textContent.replace(/\s+/g,' ').trim().slice(0,140)||'Untitled',html:k.outerHTML};parts.push(cur)}
    else if(cur)cur.html+=k.outerHTML;
    else{cur={title:/^H[1-6]$/.test(k.tagName)?(k.textContent.replace(/\s+/g,' ').trim().slice(0,140)||'Introduction'):'Introduction',html:k.outerHTML};parts.push(cur)}
  }
  return parts.filter(p=>strip(p.html).length>0);
}

function html2md(html){
  const d=document.createElement('div');d.innerHTML=html;
  const kids=(n,ctx)=>[...n.childNodes].map(c=>node(c,ctx)).join('');
  const node=(n,ctx)=>{
    if(n.nodeType===3)return n.data.replace(/\s+/g,' ');
    if(n.nodeType!==1)return '';
    const t=n.tagName.toLowerCase(),inner=()=>kids(n,ctx);
    if(/^h[1-6]$/.test(t))return '\n\n'+'#'.repeat(+t[1])+' '+inner().trim()+'\n\n';
    switch(t){
      case 'p':return '\n\n'+inner().trim()+'\n\n';
      case 'br':return '  \n';
      case 'strong':return '**'+inner()+'**';
      case 'em':return '*'+inner()+'*';
      case 'u':return '<u>'+inner()+'</u>';
      case 's':return '~~'+inner()+'~~';
      case 'mark':return '=='+inner()+'==';
      case 'code':return '`'+n.textContent+'`';
      case 'pre':return '\n\n```\n'+n.textContent+'\n```\n\n';
      case 'a':return '['+inner()+']('+(n.getAttribute('href')||'')+')';
      case 'hr':return '\n\n---\n\n';
      case 'blockquote':return '\n\n'+inner().trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n';
      case 'img':return '![image]';
      case 'ul':case 'ol':{
        const dep=(ctx&&ctx.d)||0;let i=0;
        const items=[...n.children].filter(c=>c.tagName==='LI').map(li=>{i++;
          const own=[...li.childNodes].filter(c=>!/^(UL|OL)$/.test(c.tagName||'')).map(c=>node(c,{d:dep+1})).join('').replace(/\n+/g,' ').trim();
          const sub=[...li.children].filter(c=>/^(UL|OL)$/.test(c.tagName)).map(c=>node(c,{d:dep+1})).join('');
          return '  '.repeat(dep)+(t==='ol'?i+'. ':'- ')+own+(sub?'\n'+sub.replace(/^\n+|\n+$/g,''):'');
        });
        return (dep?'':'\n\n')+items.join('\n')+(dep?'':'\n\n');
      }
      case 'table':{
        const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>c.textContent.replace(/\s+/g,' ').trim().replace(/\|/g,'\\|')));
        if(!rows.length)return '';
        const w=Math.max(...rows.map(r=>r.length));const pad=r=>{while(r.length<w)r.push('');return '| '+r.join(' | ')+' |'};
        return '\n\n'+pad(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(pad).join('\n')+'\n\n';
      }
      default:return inner();
    }
  };
  return kids(d,null).replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

const dotv=(a,ao,b,bo,D)=>{let s=0;for(let k=0;k<D;k++)s+=a[ao+k]*b[bo+k];return s};

function queryModel(ix,q){

  const add=(s,w,src)=>{if(!ix.vocab.has(s))return;const o=terms.get(s);if(!o||o.w<w)terms.set(s,{w,src})};
  const qs=all.filter(t=>!t.stop&&t.w.length>=2&&!(long&&QSTOP.has(t.w)));
  for(const t of qs)add(t.s,1,'q');
  const qset=new Set(qs.map(t=>t.s)),syn=synMap();

function queryVec(ix,terms){

NLP.search=function(q,opts={}){

  const rel=[];for(const [s,o] of terms){if(o.src==='syn'||o.src==='pre'||o.src==='rel'){const w=ix.surf[ix.vocab.get(s)];if(w&&!rel.includes(w))rel.push(w)}}
  const stems=[...terms.entries()].filter(([,o])=>o.src==='q'||o.src==='syn'||o.src==='pre').map(([s])=>s);
  return{topics:out,examples:exs.slice(0,6).map(x=>x.e),related:rel.slice(0,8),stems,terms:[...terms.entries()].filter(([,o])=>o.src==='q').map(([s])=>ix.surf[ix.vocab.get(s)]),
    stats:{topics:out.length,passages:out.reduce((a,g)=>a+g.passages.length,0)},long};
};

/* ---- automatic links between notes ---- */
function conOf(ix,t){
  let c=ix.tcon.get(t.id);if(!c)return{map:new Map()};
  const norm=Math.sqrt(c.reduce((a,x)=>a+x.score*x.score,0))||1,map=new Map();
  c.forEach(x=>map.set(x.key,{w:x.score/norm,disp:x.term}));
  return{map};
}
NLP.related=function(t,limit=8){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const wa=ix.tt.get(t.id),me=ix.tv.get(t.id);if(!wa)return[];
  const A=conOf(ix,t),out=[];
  for(const o of S.topics){
    if(o.id===t.id||o.deleted)continue;
    const wb=ix.tt.get(o.id);if(!wb)continue;
    const [sm,bg]=wa.size<wb.size?[wa,wb]:[wb,wa];
    let cos=0;const contrib=[];
    for(const [id,x] of sm){const y=bg.get(id);if(y){cos+=x*y;contrib.push([id,x*y])}}
    if(cos<0.04)continue;
    const B=conOf(ix,o);let con=0;const phr=[];
    for(const [k,x] of A.map){const y=B.map.get(k);if(y){con+=x.w*y.w;phr.push([x.disp,x.w*y.w])}}
    const ov=ix.tv.get(o.id),sem=(me&&ov)?Math.max(0,dotv(me,0,ov,0,ix.D)):0;
    let sc=0.7*cos+0.2*Math.min(1,con*2)+0.1*sem;
    const cross=o.subject!==t.subject;if(cross)sc*=1.12;
    phr.sort((a2,b2)=>b2[1]-a2[1]);contrib.sort((a2,b2)=>b2[1]-a2[1]);
    const shared=phr.slice(0,3).map(x=>x[0]);
    const have=new Set(shared.join(' ').toLowerCase().split(/\W+/));
    for(const [id] of contrib){if(shared.length>=4)break;const w=ix.surf[id];if(!have.has(w)&&w.length>3&&!isGenStem(ix.termList[id])){shared.push(w);have.add(w)}}
    out.push({t:o,score:sc,sem,con,cos,shared,cross});
  }
  out.sort((a,b)=>b.score-a.score);
  const top=out.length?out[0].score:0;
  return out.filter(x=>x.score>=Math.max(0.06,top*0.35)).slice(0,limit);
};
NLP.sectionLinks=function(t,perSec=2){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const mine=ix.byTopic.get(t.id)||[],D=ix.D,bySec=new Map();
  mine.forEach(ci=>{const s=ix.chunks[ci].sid;(bySec.get(s)||bySec.set(s,[]).get(s)).push(ci)});
  const rare=ix.nc*0.06,res=[];
  for(const [sid,cis] of bySec){
    const v=new Float32Array(D),ids=new Set();
    cis.forEach(ci=>{for(let k=0;k<D;k++)v[k]+=ix.cvec[ci*D+k];ix.chunks[ci].ids.forEach(id=>{if(ix.df[id]<=rare&&ix.df[id]>=2)ids.add(id)})});
    let n=0;for(let k=0;k<D;k++)n+=v[k]*v[k];n=Math.sqrt(n)||1;for(let k=0;k<D;k++)v[k]/=n;
    const cand=[];
    for(let c=0;c<ix.nc;c++){
      const ch=ix.chunks[c];if(ch.tid===t.id)continue;
      const cos=dotv(v,0,ix.cvec,c*D,D);if(cos<0.25)continue;
      const shared=[];for(let k=0;k<ch.ids.length;k++)if(ids.has(ch.ids[k]))shared.push(ch.ids[k]);
      if(shared.length<2)continue;
      cand.push({c,score:cos+0.05*Math.min(6,shared.length),shared});
    }
    cand.sort((a,b)=>b.score-a.score);
    const seenT=new Set(),picks=[];
    for(const x of cand){const ch=ix.chunks[x.c];if(seenT.has(ch.tid))continue;seenT.add(ch.tid);const o=byId(S.topics,ch.tid);if(!o)continue;
      picks.push({t:o,ci:ch.ci,hi:ch.hi,st:ch.st,snip:shortTxt(ch.text,170),shared:x.shared.slice(0,4).map(id=>ix.surf[id]),score:x.score,cross:o.subject!==t.subject});if(picks.length>=perSec)break}
    if(picks.length){const sec=(ix.chunks[cis[0]]);res.push({title:sec.st,hi:sec.hi,ci:sec.ci,links:picks})}
  }
  return res;
};
NLP.crossConcepts=function(limit=24){
  const ix=NLP.idx;if(!ix||!ix.nc)return[];
  const M=new Map();
  for(const t of S.topics){const c=ix.tcon.get(t.id);if(!c)continue;
    for(const x of c){let o=M.get(x.key);if(!o){o={key:x.key,term:x.term,len:x.len,topics:new Map(),subjects:new Set(),score:0};M.set(x.key,o)}o.topics.set(t.id,t);o.subjects.add(t.subject);o.score+=x.score}}
  const phrases=[...M.values()].filter(o=>o.topics.size>=2&&o.len>=2||o.topics.size>=2&&o.subjects.size>=2);
  const seen=new Set(phrases.flatMap(o=>o.term.toLowerCase().split(/\W+/)));
  const terms=[];
  for(const [id,tis] of ix.tdocs){
    const w=ix.surf[id];if(w.length<5||isGen(w)||isGenStem(ix.termList[id])||seen.has(w))continue;
    const subs=new Set(tis.map(i=>ix.topics[i].subject));if(subs.size<2)continue;
    if(ix.N>=8&&tis.length>ix.N*0.5)continue;
    let sc=0;tis.forEach(i=>{sc+=ix.tt.get(ix.topics[i].id).get(id)||0});
    const tp=new Map();tis.forEach(i=>tp.set(ix.topics[i].id,ix.topics[i]));
    terms.push({key:w,term:w,len:1,topics:tp,subjects:subs,score:sc});
  }
  const rank=(a,b)=>b.subjects.size-a.subjects.size||b.topics.size-a.topics.size||b.score-a.score;
  return phrases.sort(rank).slice(0,Math.ceil(limit/2)).concat(terms.sort(rank)).slice(0,limit);
};
NLP.stats=function(){const ix=NLP.idx;return ix?{topics:ix.N,passages:ix.nc,words:ix.V||0}:null};

/* ---- highlight the important parts of a note automatically ---- */
function domTextMap(el){
  const nodes=[];let text='';
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.tg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode())){nodes.push({n,start:text.length});text+=n.data}
  return{nodes,text};
}
function rangeAt(map,a,b){
  const find=(off,end)=>{for(const nd of map.nodes){const L=nd.n.data.length;if(end?off<=nd.start+L:off<nd.start+L)return[nd.n,Math.max(0,off-nd.start)]}const l=map.nodes[map.nodes.length-1];return[l.n,l.n.data.length]};
  const r=document.createRange(),s=find(a,false),e=find(b,true);r.setStart(s[0],s[1]);r.setEnd(e[0],e[1]);return r;
}
function wrapRange(rg,cls,auto){
  const root=rg.commonAncestorContainer,nodes=[];
  if(root.nodeType===3)nodes.push(root);
  else{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&!n.parentElement.closest('.tg'))nodes.push(n)}}
  let made=0;
  for(const n of nodes){
    const st=n===rg.startContainer?rg.startOffset:0,en=n===rg.endContainer?rg.endOffset:n.length;
    if(st>=en||!n.data.slice(st,en).trim())continue;
    let mid=n;if(st>0)mid=n.splitText(st);if(en-st<mid.length)mid.splitText(en-st);
    const mk=document.createElement('mark');mk.className='hl hl-'+cls;if(auto)mk.setAttribute('data-a','1');
    mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid);made++;
  }
  return made;
}
function markPhrase(el,phrase,cls){
  if(!phrase||phrase.trim().length<2)return 0;
  const map=domTextMap(el);if(!map.nodes.length)return 0;
  const m=new RegExp(phrase.trim().split(/\s+/).map(rxEsc).join('\\s+'),'i').exec(map.text);if(!m)return 0;
  const rg=rangeAt(map,m.index,m.index+m[0].length);
  const inMark=(()=>{const w=document.createTreeWalker(rg.commonAncestorContainer.nodeType===3?rg.commonAncestorContainer.parentNode:rg.commonAncestorContainer,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&n.parentElement.closest('mark'))return true}return false})();
  if(inMark)return 0;
  return wrapRange(rg,cls,true)?1:0;
}
NLP.autoHighlight=function(t,root){
  const V=NLP.view(t),jobs=[];
  V.defs.forEach(d=>jobs.push([d.ci,d.phrase||d.term,'d']));
  V.facts.forEach(f=>jobs.push([f.ci,f.phrase,'f']));
  V.examples.forEach(x=>{if(x.phrase)jobs.push([x.ci,x.phrase,'e'])});
  V.cautions.slice(0,3).forEach(c=>jobs.push([c.ci,c.phrase,'w']));
  V.concepts.slice(0,8).forEach(c=>{if(c.go.k==='c')jobs.push([c.go.i,c.term,'k'])});
  let n=0;
  for(const [ci,ph,cls] of jobs){const el=root.children[ci];if(el)n+=markPhrase(el,ph,cls)}
  return n;
};
NLP.clearAuto=function(root){
  const ms=[...root.querySelectorAll('mark[data-a]')];
  ms.forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove();p.normalize()});
  return ms.length;
};

function drawLib(){
  const subs=subjects();
  const tagCount={};S.topics.forEach(t=>(t.tags||[]).forEach(g=>tagCount[g]=(tagCount[g]||0)+1));
  const tags=Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]).slice(0,14);
  $('#lchips').innerHTML=(subs.length>1?`<button class="chip" aria-pressed="${!LIB.subj}" data-s="">All subjects</button>`+subs.map(s=>`<button class="chip" aria-pressed="${LIB.subj===s}" data-s="${esc(s)}">${esc(s)}</button>`).join(''):'')+tags.map(g=>`<button class="chip" aria-pressed="${LIB.tag===g}" data-g="${esc(g)}">#${esc(g)}</button>`).join('');
  $('#lchips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;if('s' in c.dataset)LIB.subj=c.dataset.s;else LIB.tag=LIB.tag===c.dataset.g?'':c.dataset.g;drawLib()};
  let list=S.topics.filter(t=>(!LIB.subj||t.subject===LIB.subj)&&(!LIB.tag||(t.tags||[]).includes(LIB.tag)));
  const el=$('#llist');
  if(!S.topics.length){el.innerHTML='<div class="empty">No topics yet. Import your notes or create a topic.</div>';return}
  const row=(t,snip)=>`<a class="trow" href="#/topic/${t.id}"><div class="t">${esc(t.title)}</div>${snip?`<div class="snip">${snip}</div>`:''}<div class="m"><div class="bar"><i style="width:${pct(t)}%"></i></div><span class="small muted">${pct(t)}%</span><span>${isDue(t)?'<span class="tag" style="background:var(--hl-w);color:var(--ink)">due</span>':''}${(t.tags||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</span></div></a>`;
  const q=LIB.q.trim().toLowerCase();
  if(q){
    const terms=q.split(/\s+/).filter(Boolean),res=[];
    for(const t of list){
      const title=t.title.toLowerCase(),tg=(t.tags||[]).join(' ').toLowerCase(),text=topicText(t),low=text.toLowerCase();let score=0,ok=true;
      for(const w of terms){let s=0;if(title.includes(w))s+=5;if(tg.includes(w))s+=3;s+=Math.min(low.split(w).length-1,10);if(!s){ok=false;break}score+=s}
      if(!ok)continue;
      const idx=low.indexOf(terms[0]);let snip='';
      if(idx>=0){const part=text.slice(Math.max(0,idx-50),idx+100);snip=(idx>50?'…':'')+esc(part).replace(new RegExp('('+terms.map(x=>escRe(esc(x))).join('|')+')','gi'),'<b>$1</b>')+'…'}
      res.push({t,score,snip});
    }
    res.sort((a,b)=>b.score-a.score);
    const smart=`<p class="small"><a href="#/search?q=${encodeURIComponent(LIB.q.trim())}">Search inside every passage, with related ideas across subjects →</a></p>`;
    el.innerHTML=smart+(res.length?`<p class="small muted">${res.length} title match${res.length>1?'es':''}</p>`+res.map(r=>row(r.t,r.snip)).join(''):'<div class="empty">No note title or tag matches that.</div>');
    return;
  }
  const groups={};
  list.forEach(t=>{const s=t.subject||'General',u=t.unit||'';((groups[s]=groups[s]||{})[u]=groups[s][u]||[]).push(t)});
  el.innerHTML=Object.keys(groups).sort(natural).map(s=>`<div class="grp"><h3>${esc(s)}</h3><button class="btn sm ghost" data-rs="${esc(s)}" aria-label="Rename subject ${esc(s)}">Rename</button></div>`+
    Object.keys(groups[s]).sort(natural).map(u=>(u?`<div class="grp"><span class="u">${esc(u)}</span><button class="btn sm ghost" data-rs="${esc(s)}" data-ru="${esc(u)}" aria-label="Rename unit ${esc(u)}">Rename</button></div>`:'')+groups[s][u].sort((a,b)=>natural(a.title,b.title)).map(t=>row(t)).join('')).join('')).join('')||'<div class="empty">No topics match these filters.</div>';
  el.onclick=async e=>{
    const b=e.target.closest('[data-rs]');if(!b)return;e.preventDefault();
    const s=b.dataset.rs,u=b.dataset.ru;
    const v=await askText(u?'Rename unit':'Rename subject',u||s);if(!v||v===(u||s))return;
    S.topics.forEach(t=>{if(t.subject===s&&(u===undefined||t.unit===u)){if(u===undefined)t.subject=v;else t.unit=v;DB.put('topics',t)}});
    if(LIB.subj===s&&u===undefined)LIB.subj=v;drawLib();
  };
}

<script>
'use strict';
const GL={mode:'',recall:false};
const wrapText=(s,max)=>{const w=s.split(/\s+/),lines=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()}if(cur)lines.push(cur);
  if(lines.length>3){lines.length=3;lines[2]=lines[2].replace(/.{0,2}$/,'')+'…'}return lines};
const TYPE_LTR={d:'D',f:'F',e:'E',w:'!',k:'K'};
function mapSVG(g,title){
  const W=1000,H=700,cx=500,cy=350,rx=235,ry=165,lrx=405,lry=285;
  const list=g.slice(0,12),n=list.length,extra=g.length-list.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Memory map of ${esc(title)}">`,nodes='';
  const attrs=go=>`data-gk="${go.k}" data-gi="${go.i}" data-gh="${esc(go.hl||'')}" role="button" tabindex="0"`;
  const box=(x,y,w,h,fill,stroke,lines,fs,cls,go,bold)=>{
    let o=`<g ${cls?`class="${cls}"`:''} ${go?attrs(go):''}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${Math.min(14,h/2)}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    lines.forEach((l,i)=>{o+=`<text x="${x}" y="${y-(lines.length-1)*fs*0.6+i*fs*1.2+fs*0.35}" font-size="${fs}" text-anchor="middle" ${bold?'font-weight="700"':''}>${esc(l)}</text>`});
    return o+'</g>';
  };
  const leaf=(x,y,lf,col)=>{
    const ls=wrapText(lf.label,17),h=ls.length*17+14,w=176,tp=lf.type&&lf.type!=='h'?lf.type:null;
    let o=`<g ${attrs(lf.go)}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${Math.min(14,h/2)}" fill="var(--surface2)" stroke="${col}" stroke-width="2"/>`;
    if(tp)o+=`<circle cx="${x-w/2+15}" cy="${y}" r="9" fill="var(--hl-${tp})" stroke="var(--ink)" stroke-width="1"/><text x="${x-w/2+15}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle">${TYPE_LTR[tp]}</text>`;
    const tx=x+(tp?11:0);
    ls.forEach((l,i)=>{o+=`<text x="${tx}" y="${y-(ls.length-1)*8.5+i*17+5}" font-size="13.5" text-anchor="middle">${esc(l)}</text>`});
    return o+'</g>';
  };
  list.forEach((b,i)=>{
    const a=-Math.PI/2+2*Math.PI*i/n,bx=cx+rx*Math.cos(a),by=cy+ry*Math.sin(a),col=BCOL(i);
    s+=`<path d="M${cx} ${cy}Q${(cx+bx)/2} ${(cy+by)/2} ${bx} ${by}" stroke="${col}" stroke-width="5" fill="none" opacity=".75"/>`;
    const lv=b.leaves.slice(0,4),k=lv.length,spread=Math.min(0.5,(2*Math.PI/n)*0.42);
    lv.forEach((lf,j)=>{
      const la=a+(k>1?(j/(k-1)-0.5)*2*spread:0),lx=cx+lrx*Math.cos(la),ly=cy+lry*Math.sin(la);
      s+=`<path d="M${bx} ${by}L${lx} ${ly}" stroke="${col}" stroke-width="2" fill="none" opacity=".6"/>`;
      nodes+=leaf(lx,ly,lf,col);
    });
    const bl=wrapText(b.title,18);
    nodes+=box(bx,by,168,bl.length*20+18,col,col,bl,16,'cn',b.go,true);
  });
  const cl=wrapText(title,22);
  nodes+=`<g class="cn"><ellipse cx="${cx}" cy="${cy}" rx="120" ry="${28+cl.length*14}" fill="var(--brand)"/>${cl.map((l,i)=>`<text x="${cx}" y="${cy-(cl.length-1)*11+i*22+6}" font-size="18" font-weight="700" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`;
  if(extra>0)nodes+=`<text x="${cx}" y="${H-12}" font-size="14" text-anchor="middle" fill="var(--muted)">+${extra} more sections. Use the Cards view to see them all.</text>`;
  return s+nodes+'</svg>';
}
const flashTerms=(el,o)=>{
  if(!el||typeof Highlight==='undefined'||!window.CSS||!CSS.highlights)return;
  const map=domTextMap(el);if(!map.nodes.length)return;
  let rx;
  if(o.hs){const w=o.hs.split(/[\s+]+/).filter(x=>x.length>=3).map(rxEsc);if(!w.length)return;rx=new RegExp('\\b('+w.map(x=>x+'\\w*').join('|')+')','gi')}
  else if(o.hl){rx=new RegExp(o.hl.trim().split(/\s+/).map(rxEsc).join('\\s+'),'gi')}
  else return;
  const rgs=[];for(const m of map.text.matchAll(rx))rgs.push(rangeAt(map,m.index,m.index+m[0].length));
  if(rgs.length){CSS.highlights.set('srch',new Highlight(...rgs));setTimeout(()=>CSS.highlights.delete('srch'),8000)}
};
const SCROLLS=(()=>{try{return JSON.parse(localStorage.getItem('sl_scroll')||'{}')}catch(e){return{}}})();
const saveScrolls=()=>{try{localStorage.setItem('sl_scroll',JSON.stringify(SCROLLS))}catch(e){}};

VIEWS.topic=r=>{
  const t=byId(S.topics,r.a);
  if(!t){view().innerHTML='<div class="empty">That topic no longer exists. <a href="#/library">Back to library</a></div>';return}
  let tab=['glance','read','related','examples'].includes(r.b)?r.b:'glance';
  const qp=new URLSearchParams(r.q||'');
  let editing=qp.has('edit'),mode='full',tabClean=null;
  const deep=qp.has('c')?{k:'c',i:+qp.get('c'),hl:qp.get('hl')||'',hs:qp.get('hs')||''}:(qp.has('h')?{k:'h',i:+qp.get('h'),hs:qp.get('hs')||''}:null);
  t.lastOpened=Date.now();DB.put('topics',t);
  const flushEdit=()=>{const rb=$('#readBody');if(editing&&rb&&mode==='full'){t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopicNow(t)}};
  CLEAN.push(()=>{flushEdit();if(tabClean)tabClean()});

  view().innerHTML=`<div class="thead"><a href="#/library" class="small">‹ Library</a><h1>${esc(t.title)}</h1>
    <div class="small muted">${esc(t.subject)}${t.unit?' › '+esc(t.unit):''}</div><div style="margin-top:6px">${(t.tags||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn sm" id="tDet">${ic('sliders',18)} Details and export</button><button class="btn sm" id="tRev">${ic('check',18)} Revised today</button><span class="small muted" id="tRevInfo"></span></div></div>
    <div class="tabs" role="tablist">${[['glance','Glance'],['read','Read'],['related','Related'],['examples','Examples']].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div><div id="tpane"></div>`;

  function showTab(n,extra){
    flushEdit();if(tabClean){tabClean();tabClean=null}
    if(window.TTS)TTS.stop(true);

    history.replaceState(null,'','#/topic/'+t.id+'/'+n);
    ({glance:renderGlance,read:renderRead,related:renderRelated,examples:renderExamples})[n](extra);
  }
  $('.tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)showTab(b.dataset.t)};
  $('#tDet').onclick=detailsModal;
  const revInfo=()=>{const el=$('#tRevInfo');if(!el)return;el.textContent=t.rev?'Next revision '+fmtDate(t.rev.due)+' ('+dueLabel(t)+')':'Not scheduled yet';el.style.color=isDue(t)?'var(--danger)':''};
  revInfo();
  $('#tRev').onclick=()=>modal(`<h3>How did revision go?</h3><p class="small muted" style="margin-top:0">This decides when the topic comes back.</p><div class="row" style="flex-direction:column;align-items:stretch"><button class="btn" data-g="hard"><b>Hard</b> – see it again tomorrow</button><button class="btn" data-g="ok"><b>Okay</b> – next interval</button><button class="btn" data-g="easy"><b>Easy</b> – skip ahead</button></div>`,b=>{
    b.onclick=async e=>{const x=e.target.closest('[data-g]');if(!x)return;await reviseTopic(t,x.dataset.g);closeModal();revInfo();toast('Next revision '+fmtDate(t.rev.due))};
  });

  /* ---- glance ---- */
  function renderGlance(){
    const V=NLP.view(t),md=GL.mode||(innerWidth<760?'cards':'map');
    const g=V.branches;
    const briefBody=t.summary?`<p>${esc(t.summary)}</p>`:
      (V.summary.length?`<ul class="brief">${V.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="small muted" style="margin-top:6px">Picked automatically from your note. <button class="btn sm ghost" id="sKeep">Keep as my summary</button></div>`:'<p class="muted">Add some text to this note and a summary will appear here.</p>');
    const it=(c,go,ttl,sub)=>`<div class="it ${c}" data-gk="${go.k}" data-gi="${go.i}" data-gh="${esc(go.hl||'')}"><span class="bd ${c}" aria-hidden="true">${TYPE_LTR[c]}</span><div class="tx"><b>${esc(ttl)}</b>${sub?`<span class="hide">${esc(sub)}</span>`:''}</div></div>`;
    const det=(open,title,n,html)=>n?`<details class="ess" ${open?'open':''}><summary>${title} <span class="cnt">${n}</span></summary><div class="body">${html}</div></details>`:'';
    const ess=
      det(true,'Key concepts',V.concepts.length,`<div class="cpts">${V.concepts.map(c=>`<button class="cpt${c.def?' def':''}" data-gk="${c.go.k}" data-gi="${c.go.i}" data-gh="${esc(c.go.hl||'')}" ${c.def?`title="${esc(c.def)}"`:''}>${esc(c.term)}</button>`).join('')}</div><p class="small muted" style="margin:8px 0 0">Bold ones have a definition in your note (shown below).</p>`)+
      det(true,'Definitions',V.defs.length,V.defs.map(d=>it('d',{k:'c',i:d.ci,hl:d.phrase},d.term,d.text)).join(''))+
      det(true,'Facts and data',V.facts.length,V.facts.map(f=>it('f',{k:'c',i:f.ci,hl:f.phrase},f.label,f.text)).join(''))+
      det(true,'Examples and case studies',V.examples.length,V.examples.map(e=>it('e',{k:'c',i:e.ci,hl:e.phrase},e.title+(e.region&&!e.title.includes(e.region)?' · '+e.region:''),e.text)).join(''))+
      det(false,'Cautions and criticisms',V.cautions.length,V.cautions.map(c=>it('w',{k:'c',i:c.ci,hl:c.phrase},c.label,c.text)).join(''));
    $('#tpane').innerHTML=`<div class="sumcard"><div class="row sp" style="margin-bottom:6px"><b>In brief</b><span><button class="btn sm" id="sEdit">${t.summary?'Edit':'Write my own'}</button>${t.summary?' <button class="btn sm" id="sAuto">Use automatic</button>':''}</span></div>${briefBody}</div>
      <div class="row sp" style="margin-top:14px"><div class="seg" role="group" aria-label="Glance style"><button data-m="cards" aria-pressed="${md==='cards'}">Cards</button><button data-m="map" aria-pressed="${md==='map'}">Map</button></div>
      <div class="row"><button class="chip" id="gRecall" aria-pressed="${GL.recall}">Test myself</button><button class="btn pri" id="gRead">Read in detail ${ic('next',16)}</button></div></div>
      ${GL.recall?'<p class="small muted" style="margin:8px 0 0">Details are blurred. Try to recall each one, then tap it to check.</p>':''}
      <div id="gview" class="${GL.recall?'recall':''}">${md==='cards'||!g.length?ess:''}<div id="gstruct"></div></div>`;
    const gs=$('#gstruct');
    if(!g.length)gs.innerHTML=ess?'':'<div class="empty" style="margin-top:14px">This note has no text to map yet. Open Read, choose Edit, and add your notes.</div>';
    else if(md==='cards')gs.innerHTML=`<h2 class="sec">Structure of the note</h2><div class="branches">${g.map((b,i)=>`<div class="br" style="--c:${BCOL(i)}"><h4 data-gk="${b.go.k}" data-gi="${b.go.i}" tabindex="0" role="button">${esc(b.title)}</h4>${b.leaves.length?`<div class="lv">${b.leaves.map(l=>`<button class="lf" data-gk="${l.go.k}" data-gi="${l.go.i}" data-gh="${esc(l.go.hl||'')}">${l.type!=='h'?`<span class="bd ${l.type}" aria-hidden="true">${TYPE_LTR[l.type]}</span>`:''}${esc(l.label)}</button>`).join('')}</div>`:''}</div>`).join('')}</div>`;
    else gs.innerHTML=`<div class="mapwrap">${mapSVG(g,t.title)}</div><div class="legendmap"><span class="bd d">D</span> definition · <span class="bd f">F</span> fact · <span class="bd e">E</span> example · <span class="bd w">!</span> caution · <span class="bd k">K</span> key concept. Tap any box to open that part of the note.</div>`;
    $('#gRead').onclick=()=>showTab('read');
    $$('.seg button',$('#tpane')).forEach(b=>b.onclick=()=>{GL.mode=b.dataset.m;renderGlance()});
    $('#gRecall').onclick=()=>{GL.recall=!GL.recall;renderGlance()};
    const keep=$('#sKeep');if(keep)keep.onclick=()=>{t.summary=V.summary.join('\n');saveTopicNow(t);renderGlance();toast('Saved as your summary')};
    $('#sEdit').onclick=()=>modal(`<h3>In brief</h3><p class="small muted" style="margin-top:0">Five lines you could recite from memory.</p><textarea id="sv" style="min-height:160px">${esc(t.summary||V.summary.join('\n'))}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="sok">Save</button><button class="btn" id="sno">Cancel</button></div>`,b=>{$('#sv',b).focus();$('#sno',b).onclick=closeModal;$('#sok',b).onclick=()=>{t.summary=$('#sv',b).value.trim();saveTopicNow(t);closeModal();renderGlance()}});
    const au=$('#sAuto');if(au)au.onclick=async()=>{if(!await confirmBox('Replace your own summary with the automatic one?','Replace',false))return;t.summary='';saveTopicNow(t);renderGlance()};
    const pane=$('#tpane');
    pane.onclick=pane.onkeydown=e=>{
      if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
      const x=e.target.closest('[data-gk]');if(!x)return;
      if(GL.recall&&(x.classList.contains('it')||x.classList.contains('lf'))&&!x.classList.contains('shown')){x.classList.add('shown');return}
      showTab('read',{k:x.dataset.gk,i:+x.dataset.gi,hl:x.dataset.gh||''});
    };
  }

  /* ---- read ---- */
  function renderRead(target){
    if(tabClean){tabClean();tabClean=null}
    const rb0=$('#tpane');
    const legend=HL_KEYS.map(k=>`<mark class="hl hl-${k}">${esc(S.settings.legend[k])}</mark>`).join('');
    const etb=`<div class="row noprint" id="etb" style="margin-bottom:10px">${[['formatBlock','H2','H2'],['formatBlock','H3','H3'],['formatBlock','P','Text'],['bold','','Bold'],['underline','','Underline'],['insertUnorderedList','','Bullets'],['insertOrderedList','','Numbers'],['removeFormat','','Clear format'],['undo','','Undo']].map(([c,v,l])=>`<button class="btn sm" data-cmd="${c}" data-val="${v}">${l}</button>`).join('')}</div>`;
    rb0.innerHTML=`<div class="row sp noprint" style="margin-bottom:10px"><div class="seg" id="rmode"><button data-m="full" aria-pressed="${mode==='full'}">Full text</button><button data-m="hl" aria-pressed="${mode==='hl'}">Highlights only</button></div>
      <div class="row"><button class="btn sm" id="rListen">${ic('play',18)} Listen</button>${editing||mode==='hl'?'':'<button class="btn sm" id="rCol">Collapse all</button><button class="btn sm" id="rExp">Expand all</button><button class="btn sm" id="rAuto">Auto-highlight</button>'}<button class="btn sm ${editing?'pri':''}" id="rEdit">${editing?'Done editing':'Edit'}</button></div></div>
      ${editing?etb:''}<div class="legend">${legend}</div><article id="readBody" class="reader ${editing?'editing':''}"></article>
      <div class="row" style="margin:24px auto;max-width:44em"><button class="btn" id="rDone">Mark as read</button><span class="small muted" id="rProg">${pct(t)}% read</span></div>`;
    const rb=$('#readBody');
    const isH=el=>el&&/^H[1-6]$/.test(el.tagName),lvl=h=>+h.tagName[1];
    const empty=!strip(t.html||'');

    function setCollapsed(h,collapse){
      h.classList.toggle('col',collapse);const L=lvl(h);let el=h.nextElementSibling,skip=null;
      while(el&&!(isH(el)&&lvl(el)<=L)){
        if(collapse)el.classList.add('hid');
        else{
          if(skip!==null){if(isH(el)&&lvl(el)<=skip)skip=null;else{el=el.nextElementSibling;continue}}
          el.classList.remove('hid');if(isH(el)&&el.classList.contains('col'))skip=lvl(el);
        }
        el=el.nextElementSibling;
      }
    }
    const allH=()=>$$('h1,h2,h3,h4,h5,h6',rb);
    function prepare(){
      allH().forEach((h,i)=>{h.dataset.hi=i;
        if(!editing){const b=document.createElement('button');b.className='tg';b.type='button';b.contentEditable='false';b.setAttribute('aria-label','Collapse or expand section');b.innerHTML=ic('chev',18);h.appendChild(b)}});
    }
    function serialize(){
      const c=rb.cloneNode(true);$$('.tg',c).forEach(x=>x.remove());
      $$('.hid,.col,.speaking',c).forEach(x=>x.classList.remove('hid','col','speaking'));
      $$('[data-hi]',c).forEach(x=>x.removeAttribute('data-hi'));$$('[class=""]',c).forEach(x=>x.removeAttribute('class'));
      return c.innerHTML;
    }
    const persist=()=>{t.html=serialize();saveTopic(t)};
    function hlView(){
      const d=document.createElement('div');d.innerHTML=t.html||'';
      const hs=[...d.querySelectorAll('h1,h2,h3,h4,h5,h6')];hs.forEach((h,i)=>h.dataset.hi=i);
      const gr={d:[],f:[],e:[],w:[],k:[]};
      $$('mark',d).forEach(m=>{const c=(m.className.match(/hl-([dfewk])/)||[])[1]||'k';let k=m;while(k.parentElement&&k.parentElement!==d)k=k.parentElement;let h=k;while(h&&!isH(h))h=h.previousElementSibling;
        const tx=m.textContent.replace(/\s+/g,' ').trim();if(tx)gr[c].push({t:tx,h:h?h.textContent.trim():'',hi:h?+h.dataset.hi:-1})});
      const total=HL_KEYS.reduce((a,k)=>a+gr[k].length,0);
      if(!total)return '<div class="empty">No highlights yet. In Full text, select words and choose a colour. They will be collected here for quick revision.</div>';
      return `<div class="hlonly">${HL_KEYS.filter(k=>gr[k].length).map(k=>`<h4><mark class="hl hl-${k}">${esc(S.settings.legend[k])}</mark> <span class="muted">(${gr[k].length})</span></h4><ul>${gr[k].map(x=>`<li ${x.hi>=0?`data-hi="${x.hi}" style="cursor:pointer"`:''}>${esc(x.t)}${x.h?`<div class="from">in ${esc(x.h)}</div>`:''}</li>`).join('')}</ul>`).join('')}</div>`;
    }

    if(mode==='hl'){rb.className='reader';rb.innerHTML=hlView();rb.onclick=e=>{const li=e.target.closest('li[data-hi]');if(li){mode='full';renderRead({k:'h',i:+li.dataset.hi})}}}
    else if(empty&&!editing){rb.innerHTML='<p class="muted">This topic is empty. Choose Edit to paste or type your notes.</p>'}
    else{rb.innerHTML=t.html||'<p></p>';prepare()}
    if(editing&&mode==='full'){
      rb.contentEditable='true';rb.spellcheck=true;
      try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
      if(empty){rb.innerHTML='<p><br></p>'}
      rb.focus();
      rb.addEventListener('input',debounce(()=>{t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopic(t)},1200));
      rb.addEventListener('paste',e=>{e.preventDefault();const h=e.clipboardData.getData('text/html'),tx=e.clipboardData.getData('text/plain');
        document.execCommand('insertHTML',false,h?sanitize(h):md2html(tx,{lines:true}))});
      $('#etb').addEventListener('pointerdown',e=>e.preventDefault());
      $('#etb').onclick=e=>{const b=e.target.closest('[data-cmd]');if(!b)return;rb.focus();document.execCommand(b.dataset.cmd,false,b.dataset.val||null)};
    }
    /* collapse toggles */
    rb.addEventListener('click',e=>{
      const tg=e.target.closest('.tg');
      if(tg){const h=tg.parentElement;setCollapsed(h,!h.classList.contains('col'));return}
      const m=e.target.closest('mark');const sel=getSelection();
      if(m&&sel.isCollapsed&&mode==='full'){const rg=document.createRange();rg.selectNodeContents(m);sel.removeAllRanges();sel.addRange(rg)}
    });
    $('#rmode').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.m===mode)return;flushEdit();mode=b.dataset.m;if(mode==='hl')editing=false;renderRead()};
    const col=$('#rCol'),exp=$('#rExp');
    if(col)col.onclick=()=>allH().forEach(h=>{if(lvl(h)<=2)setCollapsed(h,true)});
    if(exp)exp.onclick=()=>allH().slice().reverse().forEach(h=>setCollapsed(h,false));
    $('#rEdit').onclick=()=>{
      if(editing){t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopicNow(t);editing=false;toast('Saved')}
      else{mode='full';editing=true}
      renderRead();
    };
    $('#rDone').onclick=()=>{t.progress=1;DB.put('topics',t);$('#rProg').textContent='100% read';toast('Marked as read')};
    $('#rListen').onclick=()=>{if(mode!=='full'){mode='full';renderRead()}if(editing){flushEdit();editing=false;renderRead()}TTS.open($('#readBody'),t)};

    /* jump to target */
    if(target&&mode==='full'){
      const openAll=()=>allH().slice().reverse().forEach(x=>setCollapsed(x,false));
      if(target.k==='h'){const h=$$('h1,h2,h3,h4,h5,h6',rb)[target.i];if(h){openAll();setTimeout(()=>{h.scrollIntoView({block:'start',behavior:'smooth'});h.classList.add('speaking');setTimeout(()=>h.classList.remove('speaking'),1600);flashTerms(h.nextElementSibling,target)},30)}}
      else if(target.k==='c'){const el=rb.children[target.i];if(el){openAll();setTimeout(()=>{el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('speaking');setTimeout(()=>el.classList.remove('speaking'),1600);flashTerms(el,target)},30)}}
    }else if(!target&&mode==='full'&&!editing&&SCROLLS[t.id]>300){
      const y=SCROLLS[t.id];setTimeout(()=>window.scrollTo(0,y),40);   // pick up where you stopped
    }
    const ab=$('#rAuto');
    if(ab){
      const hasAuto=!!rb.querySelector('mark[data-a]');
      if(hasAuto){ab.textContent='Clear auto-highlights'}
      ab.onclick=()=>{
        const y=window.scrollY;
        if(rb.querySelector('mark[data-a]')){NLP.clearAuto(rb);persist();toast('Automatic highlights removed');renderRead();window.scrollTo(0,y);return}
        const n=NLP.autoHighlight(t,rb);
        if(!n){toast('Nothing new to highlight in this note');return}
        persist();toast(`Highlighted ${n} key items. You can clear them from the same button.`,4500);renderRead();window.scrollTo(0,y);
      };
    }
    /* reading progress */
    const saveProg=debounce(()=>DB.put('topics',t),1500);
    const onScroll=()=>{if(mode!=='full'||editing)return;const b=rb.getBoundingClientRect();if(b.height<=0)return;const seen=Math.min(1,Math.max(0,(innerHeight-b.top)/b.height));
      if(seen>(t.progress||0)+0.02){t.progress=seen>0.97?1:seen;saveProg();const p=$('#rProg');if(p)p.textContent=pct(t)+'% read'}
      clearTimeout(onScroll.t);onScroll.t=setTimeout(()=>{SCROLLS[t.id]=Math.round(window.scrollY);saveScrolls()},400)};
    window.addEventListener('scroll',onScroll,{passive:true});
    /* highlight bar */
    let lastRange=null,hideT=null;const bar=$('#hlbar');
    const inRb=n=>n&&rb.contains(n.nodeType===3?n.parentNode:n);
    const onSel=()=>{
      const sel=getSelection();
      if(mode==='full'&&sel.rangeCount&&!sel.isCollapsed&&inRb(sel.anchorNode)&&inRb(sel.focusNode)){clearTimeout(hideT);lastRange=sel.getRangeAt(0).cloneRange();bar.classList.add('show')}
      else{clearTimeout(hideT);hideT=setTimeout(()=>{bar.classList.remove('show')},350)}
    };
    document.addEventListener('selectionchange',onSel);
    const barDown=()=>{clearTimeout(hideT)};
    bar.addEventListener('pointerdown',barDown);
    bar.onclick=e=>{
      const b=e.target.closest('button');if(!b||!lastRange)return;clearTimeout(hideT);
      const rg=lastRange,c=b.dataset.c;
      if(c==='x'){$$('mark',rb).filter(m=>rg.intersectsNode(m)).forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove()})}
      else{
        const root=rg.commonAncestorContainer,nodes=[];
        if(root.nodeType===3)nodes.push(root);
        else{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(rg.intersectsNode(n)&&!n.parentElement.closest('.tg'))nodes.push(n)}}
        for(const n of nodes){
          const st=n===rg.startContainer?rg.startOffset:0,en=n===rg.endContainer?rg.endOffset:n.length;
          if(st>=en||!n.data.slice(st,en).trim())continue;
          let mid=n;if(st>0)mid=n.splitText(st);if(en-st<mid.length)mid.splitText(en-st);
          const par=mid.parentElement;
          if(par&&par.tagName==='MARK'&&par.textContent===mid.data)par.className='hl hl-'+c;
          else{const mk=document.createElement('mark');mk.className='hl hl-'+c;mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid)}
        }
      }
      getSelection().removeAllRanges();bar.classList.remove('show');lastRange=null;
      if(editing){t.html=sanitize(rb.innerHTML)||'<p></p>';saveTopic(t)}else persist();
    };
    const prevClean=tabClean;
    tabClean=()=>{window.removeEventListener('scroll',onScroll);document.removeEventListener('selectionchange',onSel);bar.classList.remove('show');bar.onclick=null;bar.removeEventListener('pointerdown',barDown);DB.put('topics',t);if(prevClean)prevClean()};
  }

  /* ---- related ---- */
  async function renderRelated(){
    const pane=$('#tpane');
    pane.innerHTML='<p class="muted">Looking for connections across your notes…</p>';
    if(!NLP.idx){await NLP.whenReady();if(tab!=='related')return}
    const pairOf=l=>l.from===t.id?l.to:l.from;
    const mine=S.links.filter(l=>l.from===t.id||l.to===t.id);
    const hidden=new Set(mine.filter(l=>l.rel==='hidden').map(pairOf)),pinned=mine.filter(l=>l.rel!=='hidden');
    const have=new Set(pinned.map(pairOf));
    const auto=NLP.related(t,12).filter(x=>!hidden.has(x.t.id)&&!have.has(x.t.id)).slice(0,8),top=auto.length?auto[0].score:1;
    const secs=NLP.sectionLinks(t).map(sc=>({...sc,links:sc.links.filter(l=>!hidden.has(l.t.id))})).filter(sc=>sc.links.length);

<script>

/* ---------- global smart search ---------- */

const pushRecent=q=>{const l=[q,...recentQ().filter(x=>x!==q)].slice(0,8);try{localStorage.setItem(RECENT_KEY,JSON.stringify(l))}catch(e){}};
let SRCH={q:'',subject:''};
const hsParam=st=>(st||[]).slice(0,6).map(encodeURIComponent).join('+');

VIEWS.search=r=>{
  const qp=new URLSearchParams(r.q||'');if(qp.has('q')){SRCH.q=qp.get('q');SRCH.subject=''}
  view().innerHTML=`<h1 class="pg">Search</h1><p class="sub">Looks inside every note in every subject, and follows related ideas. Type a topic or concept, or paste a whole exam question.</p>

function searchEmpty(){

    (cc.length?`<h2 class="sec">Ideas that connect your subjects</h2><p class="small muted">Found automatically wherever the same idea appears in more than one subject. Tap one to see every place it comes up.</p><div class="rel">${cc.map(c=>`<button class="chip" data-q="${esc(c.term)}" title="${esc([...c.subjects].join(', '))}">${esc(c.term)} <span class="muted small">${c.subjects.size} subjects</span></button>`).join('')}</div>`:
    '<p class="muted">As your library grows, ideas shared between subjects will be listed here.</p>');

let SQID=0;
async function doSearch(raw,keep){
  const q=(raw||'').trim(),id=++SQID;SRCH.q=q;
  const res=$('#sres'),stat=$('#sstat'),flt=$('#sflt');if(!res)return;
  if(!S.topics.length){stat.textContent='';flt.innerHTML='';res.innerHTML='<div class="empty">Add some notes first, then search across them here.</div>';return}
  if(!NLP.idx){stat.textContent='Getting your notes ready…';await NLP.whenReady();if(id!==SQID||!$('#sres'))return}
  if(!q){stat.textContent='';flt.innerHTML='';searchEmpty();return}
  const out=NLP.search(q);
  if(!out||!out.topics.length){
    flt.innerHTML='';stat.textContent='';
    res.innerHTML=`<div class="empty">Nothing in your notes matches “${esc(q)}”.<br><span class="small">Try fewer or simpler words, or add related words under More → Smart features.</span></div>`;return;
  }
  pushRecent(q);
  const subs={};out.topics.forEach(g=>subs[g.t.subject]=(subs[g.t.subject]||0)+1);
  const names=Object.keys(subs).sort((a,b)=>subs[b]-subs[a]);
  flt.innerHTML=names.length>1?`<button class="chip" data-subj="" aria-pressed="${!SRCH.subject}">All subjects</button>`+names.map(n=>`<button class="chip" data-subj="${esc(n)}" aria-pressed="${SRCH.subject===n}">${esc(n)} (${subs[n]})</button>`).join(''):'';
  const shown=out.topics.filter(g=>!SRCH.subject||g.t.subject===SRCH.subject);
  stat.textContent=`${shown.length} note${shown.length===1?'':'s'} in ${names.length} subject${names.length===1?'':'s'}${out.long?' · treated as a question: key ideas were picked out':''}`;
  const hs=hsParam(out.stems);
  const chips=out.related.length?`<div class="small muted">Also looking at related ideas:</div><div class="rel">${out.related.map(w=>`<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:'';
  const groups={};shown.forEach(g=>(groups[g.t.subject]=groups[g.t.subject]||[]).push(g));
  const card=g=>{
    const p0=g.passages[0];
    return `<div class="res"><div class="row sp"><h3><a href="#/topic/${g.t.id}/read?c=${p0.ci}&hs=${hs}">${esc(g.t.title)}</a></h3><span class="tag">${esc(g.t.subject)}${g.t.unit?' › '+esc(g.t.unit):''}</span></div>`+
      g.passages.slice(0,3).map(p=>`<a class="pas" href="#/topic/${g.t.id}/read?c=${p.ci}&hs=${hs}"><div class="p">${p.path.length?esc(p.path.join(' › ')):'Opening section'}${p.via?' · related idea':''}${p.matched.length?' · matches '+esc(p.matched.slice(0,3).join(', ')):''}</div><div>${p.snip}</div></a>`).join('')+
      (g.passages.length>3?`<div class="small muted">+ ${g.passages.length-3} more passage${g.passages.length-3>1?'s':''} in this note</div>`:'')+`</div>`;
  };
  const ex=out.examples.length?`<div class="subjhead">Examples in your bank</div><div class="grid">${out.examples.map(e=>exCard(e)).join('')}</div>`:'';
  res.innerHTML=chips+Object.keys(groups).map(sj=>`<div class="subjhead">${esc(sj)}</div>`+groups[sj].map(card).join('')).join('')+ex;
}

<script>
'use strict';
/* ---------- shared: HTML -> simple block model ---------- */
const BLOCKTAGS=new Set(['H1','H2','H3','H4','H5','H6','P','UL','OL','TABLE','BLOCKQUOTE','PRE','HR','DIV']);
function docBlocks(html,shift=0){
  const d=document.createElement('div');d.innerHTML=html||'';const out=[];
  const inl=(node,fmt,runs)=>{
    for(const n of node.childNodes){
      if(n.nodeType===3){const t=n.data.replace(/\s+/g,' ');if(t)runs.push({t,f:fmt});continue}
      if(n.nodeType!==1)continue;
      const g=n.tagName;
      if(g==='BR'){runs.push({br:1});continue}
      if(g==='IMG'){runs.push({t:'[image]',f:fmt});continue}
      if(/^(UL|OL|TABLE)$/.test(g))continue;
      const f=Object.assign({},fmt);
      if(g==='STRONG'||g==='B')f.b=1;if(g==='EM'||g==='I')f.i=1;if(g==='U')f.u='single';if(g==='S')f.s=1;
      if(g==='SUP')f.sup=1;if(g==='SUB')f.sub=1;if(g==='CODE')f.code=1;
      if(g==='MARK')f.hl=((n.className.match(/hl-([dfewk])/)||[])[1])||'k';
      inl(n,f,runs);
    }
  };
  const trim=r=>{while(r.length&&r[0].t!==undefined&&!r[0].t.trim())r.shift();if(r.length&&r[0].t)r[0]={t:r[0].t.replace(/^\s+/,''),f:r[0].f};
    while(r.length&&r[r.length-1].t!==undefined&&!r[r.length-1].t.trim())r.pop();const l=r.length-1;if(l>=0&&r[l].t)r[l]={t:r[l].t.replace(/\s+$/,''),f:r[l].f};return r};
  const own=el=>{const r=[];inl(el,{},r);return trim(r)};
  const has=r=>r.some(x=>x.br||(x.t&&x.t.trim()));
  const walk=(parent,ctx)=>{
    let pend=[];
    const flush=()=>{const r=trim(pend);pend=[];if(has(r))out.push({k:'p',runs:r,indent:ctx.indent,quote:ctx.quote})};
    for(const el of parent.childNodes){
      if(el.nodeType===3||(el.nodeType===1&&!BLOCKTAGS.has(el.tagName))){const w=document.createElement('div');w.appendChild(el.cloneNode(true));inl(w,{},pend);continue}
      if(el.nodeType!==1)continue;
      flush();const t=el.tagName;
      if(/^H[1-6]$/.test(t)){const r=own(el);if(has(r))out.push({k:'h',n:Math.min(3,+t[1]+shift),runs:r})}
      else if(t==='P'){const r=own(el);if(has(r))out.push({k:'p',runs:r,indent:ctx.indent,quote:ctx.quote});else if(el.classList.contains('sp'))out.push({k:'p',runs:[{t:' '}],indent:0,quote:false})}
      else if(t==='UL'||t==='OL'){let i=0;
        for(const li of el.children){if(li.tagName!=='LI')continue;i++;
          const r=own(li);if(has(r))out.push({k:'p',runs:r,indent:ctx.indent+1,bullet:t==='OL'?i+'.':'•',quote:ctx.quote});
          for(const c of li.children)if(/^(UL|OL)$/.test(c.tagName)){const w=document.createElement('div');w.appendChild(c.cloneNode(true));walk(w,{indent:ctx.indent+1,quote:ctx.quote})}
        }}
      else if(t==='TABLE'){const rows=[...el.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>{const r=[];inl(c,{},r);return trim(r)}));
        if(rows.length)out.push({k:'t',rows,head:!!el.querySelector('th')})}
      else if(t==='BLOCKQUOTE'){walk(el,{indent:ctx.indent+1,quote:true})}
      else if(t==='PRE'){el.textContent.split('\n').forEach(l=>out.push({k:'p',runs:[{t:l||' ',f:{code:1}}],indent:ctx.indent,code:true}))}
      else if(t==='HR'){out.push({k:'hr'})}
      else if(t==='DIV'){walk(el,ctx)}
    }
    flush();
  };
  walk(d,{indent:0,quote:false});
  return out;
}
const HLFILL={d:'CFE3FF',f:'CDEFD3',e:'FFE0BA',w:'FFD0CF',k:'FFF1A8'};
const HLUL={d:'single',f:'dotted',e:'dash',w:'wave',k:'double'};
const legendRuns=()=>{const r=[{t:'Highlight key: ',f:{b:1}}];HL_KEYS.forEach(k=>{r.push({t:S.settings.legend[k],f:{hl:k}});r.push({t:'   '})});return r};

/* ---------- Word (.docx) ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;

function buildPdf(title,secs){

    for(const b of docBlocks(s.html,s.shift||0)){

async function exportTopics(list,title,fmt){
  if(!list.length){toast('Nothing to export');return false}
  const secs=list.length===1?[{heading:null,html:list[0].html,shift:0}]:list.map(t=>({heading:t.title,html:t.html,shift:1}));
  try{
    const bytes=fmt==='pdf'?buildPdf(title,secs):buildDocx(title,secs);
    return await saveFile(safeName(title)+'.'+fmt,bytes,fmt==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }catch(e){toast('Could not create the file: '+(e.message||e),5000);return false}
}

/* ---------- spaced revision ---------- */
const INTERVALS=[1,3,7,14,30,60,120];
const DAY=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const isDue=t=>!!(t.rev&&t.rev.due&&t.rev.due<=today0());
function reviseTopic(t,grade){
  const r=t.rev||{stage:-1,count:0};let st=r.stage;
  if(grade==='hard')st=0;else if(grade==='ok')st=Math.min(INTERVALS.length-1,st+1);else st=Math.min(INTERVALS.length-1,st+2);
  st=Math.max(0,st);
  let due=today0()+INTERVALS[st]*DAY;
  if(S.settings.examDate){
    const ex=new Date(S.settings.examDate+'T00:00:00').getTime()-2*DAY;
    if(ex>today0()&&due>ex)due=Math.max(today0()+DAY,ex);
  }
  t.rev={stage:st,due,last:Date.now(),count:(r.count||0)+1,weak:grade==='hard'};
  return saveTopicNow(t);
}
const dueLabel=t=>{if(!t.rev)return '';const n=dayDiff(t.rev.due,today0());return n<0?`${-n} day${n===-1?'':'s'} overdue`:n===0?'due today':n===1?'due tomorrow':'due in '+n+' days'};
